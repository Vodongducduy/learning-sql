lumn doesn't need to be a primary key or have a foreign key constraint — though joining on indexed columns is more efficient."}, {"q": "What is a 'fanout' in JOIN results?", "opts": ["A type of CROSS JOIN", "When a left table row matches multiple right rows, appearing multiple times in results", "A failed JOIN", "A LEFT JOIN error"], "ans": 1, "exp": "Fanout happens in one-to-many joins. One user with 5 orders appears 5 times in a users-orders join. This inflates COUNT(*) and SUM() — use DISTINCT or aggregate before joining."}, {"q": "What does STRAIGHT_JOIN do in MySQL?", "opts": ["Same as INNER JOIN", "Forces join order: left table always read first (overrides optimizer)", "Creates an index", "A type of OUTER JOIN"], "ans": 1, "exp": "STRAIGHT_JOIN forces MySQL to read tables in the order listed, overriding the query optimizer's join order decision. Used when the optimizer picks a suboptimal order."}, {"q": "What does ON a.id = b.a_id AND b.type = 'premium' do in a LEFT JOIN?", "opts": ["Same as adding WHERE b.type = 'premium'", "Filters the join condition — only matches 'premium' b rows; non-premium a rows still appear with NULL b", "Error — ON can only have one condition", "Removes NULL rows"], "ans": 1, "exp": "In LEFT JOIN, additional conditions in ON affect which right-table rows match, but left rows are never excluded. A rows with no 'premium' b match get NULL b columns. If moved to WHERE, it would exclude those a rows."}, {"q": "What join type is best for a many-to-many relationship query?", "opts": ["CROSS JOIN", "JOIN through a bridge table: a JOIN bridge ON a.id=bridge.a_id JOIN b ON bridge.b_id=b.id", "SELF JOIN", "FULL OUTER JOIN"], "ans": 1, "exp": "Many-to-many relationships use a bridge (junction) table. Join table A to bridge, then bridge to table B. This avoids Cartesian products and uses the normalized relationship correctly."}, {"q": "What does SELECT u.*, o.* FROM users u JOIN orders o ON u.id = o.user_id return when orders has an 'id' column too?", "opts": ["Only one 'id' column", "Both 'id' columns (ambiguous) — the result has two columns both named 'id'", "Error — ambiguous column", "Only user id"], "ans": 1, "exp": "SELECT * on a join returns ALL columns from both tables, including same-named columns. The result has two 'id' columns which can cause issues in application code. Always alias or specify columns explicitly."}]}, {"id": 4, "title": "Aggregation & GROUP BY", "level": "Fresher → Junior", "icon": "📊", "desc": "COUNT, SUM, AVG, MIN, MAX, GROUP BY, HAVING", "questions": [{"q": "What does COUNT(*) count?", "opts": ["Only non-NULL values", "All rows including NULL", "Only distinct values", "Only numeric rows"], "ans": 1, "exp": "COUNT(*) counts ALL rows regardless of NULL. COUNT(column) counts only non-NULL values in that column. Use COUNT(*) for total row counts."}, {"q": "What does GROUP BY do?", "opts": ["Sorts results", "Combines rows with the same value into groups for aggregation", "Filters groups", "Removes duplicates"], "ans": 1, "exp": "GROUP BY groups rows with identical values in the specified column(s). Aggregate functions (COUNT, SUM, etc.) then operate on each group separately."}, {"q": "What is the difference between WHERE and HAVING?", "opts": ["No difference", "WHERE filters rows before grouping; HAVING filters groups after aggregation", "HAVING filters rows; WHERE filters groups", "WHERE can use aggregates; HAVING cannot"], "ans": 1, "exp": "WHERE is evaluated before GROUP BY (filters individual rows). HAVING is evaluated after (filters groups based on aggregate results). Use HAVING when filtering on aggregate values like COUNT > 5."}, {"q": "What does AVG(price) return when price column has NULLs?", "opts": ["NULL", "0 for NULLs", "AVG ignores NULLs — calculates average of non-NULL values only", "Error"], "ans": 2, "exp": "All aggregate functions (SUM, AVG, COUNT(col), MIN, MAX) ignore NULL values. AVG(price) = SUM of non-NULL prices / COUNT of non-NULL prices."}, {"q": "What does SELECT department, COUNT(*) FROM employees GROUP BY department return?", "opts": ["Total count of all employees", "Error — need WHERE", "Count of employees per department", "Count of departments"], "ans": 2, "exp": "GROUP BY department creates one group per unique department value. COUNT(*) then counts rows in each group, giving employee count per department."}, {"q": "What does SUM(NULL) return?", "opts": ["0", "NULL", "Error", "Ignores NULL and returns 0"], "ans": 1, "exp": "SUM() ignores NULL values. SUM of only NULLs returns NULL. SUM of [1, 2, NULL] = 3 (NULLs ignored)."}, {"q": "What is the correct order: SELECT, FROM, WHERE, GROUP BY, HAVING, ORDER BY?", "opts": ["WHERE → GROUP BY → HAVING", "SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY", "GROUP BY → HAVING → WHERE → SELECT", "FROM → WHERE → HAVING → GROUP BY → SELECT → ORDER BY"], "ans": 1, "exp": "Written order: SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY. Logical execution order: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY."}, {"q": "Can you GROUP BY multiple columns?", "opts": ["No — only one column", "Yes — GROUP BY col1, col2 creates groups by unique combinations", "Only with subqueries", "Only with HAVING"], "ans": 1, "exp": "GROUP BY can use multiple columns. Each unique combination of all listed columns forms one group. Example: GROUP BY year, month groups by each year-month combination."}, {"q": "What is wrong with: SELECT department, name, COUNT(*) FROM emp GROUP BY department?", "opts": ["COUNT(*) is wrong", "name is not in GROUP BY and not an aggregate — causes error or non-deterministic result", "WHERE is missing", "Nothing wrong"], "ans": 1, "exp": "Non-aggregated columns in SELECT must appear in GROUP BY (SQL standard). MySQL may allow it but returns a non-deterministic value. Standard SQL requires all SELECT columns to be either in GROUP BY or inside an aggregate function."}, {"q": "What does HAVING COUNT(*) > 5 do?", "opts": ["Filters rows where COUNT is > 5", "Filters groups that have more than 5 rows", "Filters columns", "Limits to 5 rows"], "ans": 1, "exp": "HAVING filters the grouped results. Only groups with more than 5 rows are included in the output."}, {"q": "What does COUNT(DISTINCT email) count?", "opts": ["All emails", "Unique non-NULL email values", "All rows", "Duplicate emails only"], "ans": 1, "exp": "COUNT(DISTINCT col) counts unique non-NULL values. COUNT(email) counts non-NULL values including duplicates. COUNT(*) counts all rows."}, {"q": "Which detects duplicate emails in a user table?", "opts": ["SELECT email FROM users WHERE email = email", "SELECT email, COUNT(*) FROM users GROUP BY email HAVING COUNT(*) > 1", "SELECT DISTINCT email FROM users", "SELECT email FROM users GROUP BY email"], "ans": 1, "exp": "GROUP BY email groups rows by email value. HAVING COUNT(*) > 1 keeps only groups with 2+ rows — these are duplicate emails."}, {"q": "What does MIN(salary) return if all salaries are NULL?", "opts": ["0", "NULL", "Error", "Infinity"], "ans": 1, "exp": "MIN() ignores NULLs. If all values are NULL, there are no non-NULL values to compare, so MIN returns NULL."}, {"q": "Can HAVING be used without GROUP BY?", "opts": ["No — HAVING requires GROUP BY", "Yes — HAVING applies to the entire result set as one group", "Only with subqueries", "Only with DISTINCT"], "ans": 1, "exp": "HAVING without GROUP BY treats the entire result as one group. HAVING COUNT(*) > 10 would return results only if the entire table has > 10 rows. Rare but valid."}, {"q": "What does GROUP BY with ROLLUP do?", "opts": ["Sorts groups", "Adds subtotal rows for each grouping level and a grand total", "Removes groups with NULL", "Filters after grouping"], "ans": 1, "exp": "ROLLUP adds summary rows: subtotals for each group level plus a grand total row. Useful for hierarchical reports (e.g., total per department + company-wide total)."}, {"q": "What is the difference between COUNT(1) and COUNT(*)?", "opts": ["COUNT(1) counts only the first column", "COUNT(1) is faster", "Functionally identical — both count all rows", "COUNT(1) ignores NULLs"], "ans": 2, "exp": "COUNT(1) and COUNT(*) are functionally identical — both count all rows. Modern query optimizers treat them the same. COUNT(column_name) is different — it excludes NULLs."}, {"q": "What does SELECT MAX(salary) - MIN(salary) FROM employees return?", "opts": ["Error — can't subtract aggregates", "The salary range (highest - lowest)", "NULL", "Average salary"], "ans": 1, "exp": "Arithmetic on aggregate functions is valid in SELECT. MAX(salary) - MIN(salary) returns the salary range. Both are calculated from non-NULL salaries."}, {"q": "What is a QA use case for GROUP BY?", "opts": ["Formatting output", "Detecting duplicate records and counting records by status", "Sorting alphabetically", "Joining tables"], "ans": 1, "exp": "QA uses GROUP BY to: detect duplicates (GROUP BY email HAVING COUNT > 1), count bugs by status, count test results by category, verify distribution of test data."}, {"q": "What does SUM(price * quantity) calculate?", "opts": ["Error — can't use expressions in SUM", "Total revenue across all rows (price × qty per row, then summed)", "Average order value", "Count of products"], "ans": 1, "exp": "SUM() can take expressions. For each row, price × quantity is calculated, then all results are summed. This gives total revenue across all order lines."}, {"q": "What does GROUP BY NULL do?", "opts": ["Error", "Groups all rows into one group (NULL group)", "Excludes NULL rows", "Nothing — NULL is ignored in GROUP BY"], "ans": 1, "exp": "GROUP BY treats NULL as a group key value. All rows with NULL in the grouping column are grouped together into a single NULL group."}, {"q": "Which correctly finds the most purchased product?", "opts": ["SELECT product_id, MAX(COUNT(*)) FROM orders GROUP BY product_id", "SELECT product_id, COUNT(*) FROM orders GROUP BY product_id ORDER BY COUNT(*) DESC LIMIT 1", "SELECT TOP product_id FROM orders", "SELECT product_id FROM orders HAVING MAX(quantity)"], "ans": 1, "exp": "COUNT(*) per product, then ORDER BY count DESC, LIMIT 1 gives the most purchased. Nesting aggregates (MAX(COUNT(*))) isn't directly valid in standard SQL without subqueries."}, {"q": "What is the difference between SUM and COUNT for a QA report?", "opts": ["No difference", "SUM adds numeric values; COUNT counts rows (or non-NULL values)", "COUNT adds values; SUM counts rows", "Both can only be used with numbers"], "ans": 1, "exp": "COUNT(*) or COUNT(col) counts rows. SUM(amount) adds numeric values. A QA report might COUNT test cases and SUM their durations."}, {"q": "What does AVG(DISTINCT price) calculate?", "opts": ["Average of all prices", "Average of unique price values only", "Error", "Minimum average"], "ans": 1, "exp": "AVG(DISTINCT price) first finds unique price values, then averages them. This is different from AVG(price) when duplicate price values exist."}, {"q": "Can you use aggregate functions in WHERE?", "opts": ["Yes — always", "No — use HAVING for aggregate conditions", "Only with GROUP BY", "Only COUNT can be used in WHERE"], "ans": 1, "exp": "Aggregate functions cannot be used in WHERE because WHERE is evaluated before aggregation. Use HAVING: not WHERE COUNT(*) > 5 but add GROUP BY ... HAVING COUNT(*) > 5."}, {"q": "What does SELECT COUNT(*) FROM users WHERE status='active' return?", "opts": ["Count of all users", "Count of active users only", "Error — need GROUP BY", "Percentage of active users"], "ans": 1, "exp": "WHERE filters rows before COUNT(*). Only 'active' rows reach the COUNT. No GROUP BY needed since we're counting the filtered set as a whole."}, {"q": "What query counts bugs by severity level?", "opts": ["SELECT COUNT(*) FROM bugs", "SELECT severity, COUNT(*) FROM bugs GROUP BY severity", "SELECT * FROM bugs GROUP BY severity", "SELECT severity FROM bugs HAVING COUNT(*) > 0"], "ans": 1, "exp": "GROUP BY severity creates one group per severity level. COUNT(*) counts bugs in each group. This gives a bug count breakdown by severity."}, {"q": "What does HAVING SUM(amount) > 1000 filter?", "opts": ["Individual rows where amount > 1000", "Groups where the total amount exceeds 1000", "All amounts", "Groups with at least 1000 rows"], "ans": 1, "exp": "HAVING filters on aggregate results. SUM(amount) > 1000 keeps only groups where the sum of amounts in that group exceeds 1000."}, {"q": "What is the result of GROUP BY on a column with all unique values?", "opts": ["Error", "One group per row (same as no grouping)", "One group for all rows", "Removes duplicate rows"], "ans": 1, "exp": "If every value is unique, GROUP BY creates one group per row — same row count as without GROUP BY. Aggregates then operate on each single-row group."}, {"q": "What does SELECT user_id, COUNT(*) as order_count, SUM(total) as revenue FROM orders GROUP BY user_id HAVING order_count > 3 return?", "opts": ["Error — HAVING can't use aliases", "Users with more than 3 orders and their revenue (using alias in HAVING)", "All users", "Users with revenue > 3"], "ans": 1, "exp": "MySQL (unlike strict SQL standard) allows aliases in HAVING. This returns users with more than 3 orders along with their order count and total revenue."}, {"q": "Which aggregate function is NOT affected by NULLs?", "opts": ["SUM", "AVG", "COUNT(*)", "MIN"], "ans": 2, "exp": "COUNT(*) counts ALL rows regardless of NULL values. COUNT(col), SUM, AVG, MIN, MAX all ignore NULLs. COUNT(*) is the only aggregate completely unaffected by NULLs."}, {"q": "What does SELECT department, AVG(salary) FROM employees GROUP BY department ORDER BY AVG(salary) DESC return?", "opts": ["Error — can't ORDER BY aggregate", "Departments sorted by average salary (highest first)", "Departments sorted alphabetically", "Average salary of all departments"], "ans": 1, "exp": "ORDER BY can use aggregate functions. This returns departments with their average salary, sorted highest to lowest. Valid SQL."}, {"q": "What is wrong with HAVING without GROUP BY: SELECT name, HAVING COUNT(*) > 1 FROM users?", "opts": ["HAVING position is wrong — must come after GROUP BY/FROM", "Nothing wrong", "Should use WHERE", "HAVING cannot use COUNT"], "ans": 0, "exp": "HAVING must come after WHERE and GROUP BY in the clause order: FROM → WHERE → GROUP BY → HAVING. Also, name in SELECT with HAVING would be non-deterministic."}, {"q": "What does GROUP_CONCAT(name) do in MySQL?", "opts": ["Counts names", "Concatenates all name values in a group into a comma-separated string", "Finds maximum name", "Returns NULL for groups"], "ans": 1, "exp": "GROUP_CONCAT() is a MySQL aggregate that concatenates values within a group. Useful for listing all items in a group: GROUP_CONCAT(tag SEPARATOR ', ')."}, {"q": "What is the purpose of the ROLLUP modifier?", "opts": ["Encrypts grouped data", "Creates subtotal and grand total rows", "Randomizes group order", "Limits group size"], "ans": 1, "exp": "GROUP BY col1, col2 WITH ROLLUP adds rows: one subtotal per col1 value + one grand total row. Used for hierarchical summary reports."}, {"q": "What does MIN(CASE WHEN status='failed' THEN created_at END) return?", "opts": ["Error — CASE in aggregate is invalid", "Earliest timestamp of failed records", "NULL if no failed records", "Latest failed timestamp"], "ans": 1, "exp": "CASE inside aggregates is valid. For non-failed rows, CASE returns NULL. MIN ignores NULL. Result: earliest created_at among failed rows. Returns NULL if no failed rows exist."}, {"q": "When is COUNT(col) different from COUNT(*)?", "opts": ["Always different", "When the column contains NULL values", "Never — they're identical", "Only with DISTINCT"], "ans": 1, "exp": "COUNT(col) excludes NULL values. COUNT(*) includes all rows. They differ when the column has NULLs. COUNT(email) < COUNT(*) if any email is NULL."}, {"q": "What does SELECT status, COUNT(*) FROM orders GROUP BY status WITH ROLLUP return?", "opts": ["Count per status only", "Count per status PLUS a grand total row where status is NULL", "Error", "Count only for NULL status"], "ans": 1, "exp": "WITH ROLLUP adds a final summary row. The NULL in the status column of that row indicates it's the grand total, not an actual NULL status value."}, {"q": "Which correctly calculates daily active users?", "opts": ["SELECT COUNT(DISTINCT user_id) FROM logs", "SELECT DATE(created_at), COUNT(DISTINCT user_id) FROM logs GROUP BY DATE(created_at)", "SELECT user_id, COUNT(*) FROM logs GROUP BY DATE(created_at)", "SELECT DISTINCT user_id, DATE(created_at) FROM logs"], "ans": 1, "exp": "DATE(created_at) groups by day. COUNT(DISTINCT user_id) counts unique users per day. This is the correct DAU calculation pattern."}, {"q": "What is a GROUP BY column expression?", "opts": ["Invalid — GROUP BY needs column names", "GROUP BY can use expressions like YEAR(date), LENGTH(name), etc.", "Only simple column names allowed", "Only indexes allowed"], "ans": 1, "exp": "GROUP BY accepts expressions. GROUP BY YEAR(created_at), MONTH(created_at) groups by year-month. GROUP BY LENGTH(name) groups by name length. Very useful for time-series analysis."}, {"q": "What does SELECT COUNT(*) FILTER (WHERE status='pass') do in PostgreSQL?", "opts": ["Error — use CASE instead", "Counts only passing test cases without subquery", "Syntax for MySQL also", "Is the same as COUNT(status)"], "ans": 1, "exp": "FILTER(WHERE ...) is a PostgreSQL extension to aggregate functions for conditional counting. In MySQL, use: SUM(CASE WHEN status='pass' THEN 1 ELSE 0 END)."}, {"q": "What query finds the day with the most orders?", "opts": ["SELECT MAX(COUNT(*)) FROM orders", "SELECT DATE(created_at), COUNT(*) as cnt FROM orders GROUP BY DATE(created_at) ORDER BY cnt DESC LIMIT 1", "SELECT DATE(created_at) FROM orders HAVING MAX(*)", "SELECT * FROM orders GROUP BY DATE LIMIT 1"], "ans": 1, "exp": "GROUP BY date, COUNT(*) per date, ORDER BY count DESC, LIMIT 1 gives the single day with the most orders. Cannot nest MAX(COUNT(*)) directly."}, {"q": "In a QA context, what does SELECT test_suite, COUNT(*), SUM(CASE WHEN result='pass' THEN 1 ELSE 0 END) as passed FROM tests GROUP BY test_suite return?", "opts": ["Error", "Total tests and pass count per test suite", "Only passing tests", "All failed tests"], "ans": 1, "exp": "A conditional SUM (using CASE) counts only passing tests per suite. This pattern produces a test results summary: suite name, total count, and pass count — key QA reporting."}, {"q": "What does SELECT category, AVG(price) FROM products GROUP BY category HAVING AVG(price) > 100 ORDER BY AVG(price) return?", "opts": ["Error — ORDER BY and HAVING can't both be used", "Categories where avg price > 100, sorted by avg price ascending", "All categories sorted by price", "Categories with price = 100"], "ans": 1, "exp": "HAVING filters (avg > 100), ORDER BY sorts the filtered results (default ASC). Both can be used together. ORDER BY AVG(price) sorts the qualifying groups by average price."}, {"q": "What is wrong: SELECT dept, AVG(salary) FROM emp WHERE AVG(salary) > 50000 GROUP BY dept?", "opts": ["AVG is wrong here", "WHERE cannot use aggregate functions — move to HAVING", "GROUP BY must come before WHERE", "dept must be in ORDER BY"], "ans": 1, "exp": "WHERE evaluates before aggregation, so aggregate functions like AVG are not yet calculated at WHERE time. Move the condition to HAVING: GROUP BY dept HAVING AVG(salary) > 50000."}, {"q": "What does SELECT FLOOR(price/10)*10 AS price_bracket, COUNT(*) FROM products GROUP BY price_bracket return?", "opts": ["Error — can't GROUP BY alias", "Product counts grouped by price in $10 brackets (0-9, 10-19, 20-29...)", "Average prices in brackets", "All prices rounded down"], "ans": 1, "exp": "MySQL allows GROUP BY to reference SELECT aliases. This buckets prices into $10 brackets: 0-9→0, 10-19→10, etc. COUNT(*) per bracket gives distribution — useful for QA data analysis."}, {"q": "Which is a valid way to get the second highest salary?", "opts": ["SELECT MAX(salary) WHERE salary != MAX(salary) FROM emp", "SELECT MAX(salary) FROM emp WHERE salary < (SELECT MAX(salary) FROM emp)", "SELECT salary FROM emp ORDER BY salary DESC LIMIT 1,1", "Both B and C"], "ans": 3, "exp": "Both work: B finds MAX where it's less than the overall MAX (= second highest). C sorts descending, skips first (OFFSET 1), takes next. B is cleaner for n-th highest patterns."}, {"q": "What does GROUP BY on an expression like MOD(id, 3) accomplish?", "opts": ["Error", "Groups rows by remainder when id is divided by 3 (creates 3 groups: 0,1,2)", "Groups by id", "Divides table into 3 equal parts"], "ans": 1, "exp": "MOD(id, 3) returns 0, 1, or 2 for any id. GROUP BY this expression creates 3 groups. Useful for test data distribution analysis or load balancing checks."}, {"q": "What does SELECT COUNT(*) FROM t HAVING COUNT(*) > 100 do?", "opts": ["Error", "Returns count only if more than 100 rows exist; empty result otherwise", "Always returns count", "Returns 100"], "ans": 1, "exp": "Without GROUP BY, HAVING treats the whole table as one group. COUNT(*) > 100 evaluates that total. If the table has ≤ 100 rows, the result is empty. A useful existence/threshold check."}, {"q": "Which query detects test data pollution (test emails in production)?", "opts": ["SELECT * FROM users WHERE email LIKE '%test%'", "SELECT COUNT(*) FROM users WHERE email LIKE '%@test.%' OR email LIKE '%test@%'", "SELECT email FROM users GROUP BY email", "SELECT * FROM users WHERE role = 'test'"], "ans": 1, "exp": "Counting suspicious email patterns detects test data leakage. GROUP BY and HAVING can further analyze distribution. This is a real QA production health check."}, {"q": "What is the output of SELECT COUNT(*) FROM (SELECT DISTINCT email FROM users) t?", "opts": ["Total users", "Count of unique emails", "Error — can't COUNT from subquery", "Count of all emails including duplicates"], "ans": 1, "exp": "The subquery selects distinct emails. COUNT(*) on that result gives the number of unique emails — same as COUNT(DISTINCT email) but as a subquery pattern."}, {"q": "What does SUM(price) return if the table has zero rows after WHERE filtering?", "opts": ["0", "NULL", "Error", "Empty string"], "ans": 1, "exp": "SUM of an empty set returns NULL. Same for AVG, MIN, MAX. COUNT returns 0. This is different from SUM when values include 0."}, {"q": "Can you HAVING on a column not in SELECT?", "opts": ["No — must be in SELECT", "Yes — HAVING can reference any aggregated or grouped column", "Only with aliases", "Only with *"], "ans": 1, "exp": "HAVING can reference columns in the FROM table even if not in SELECT. HAVING AVG(salary) > 50000 works without AVG(salary) being in SELECT."}, {"q": "What is the QA use of GROUP BY date in a test run log table?", "opts": ["None — GROUP BY date has no QA purpose", "Reveals daily test execution counts, pass/fail rates per day, trend detection", "Sorts test results", "Deletes old test runs"], "ans": 1, "exp": "Grouping test logs by date enables trend analysis: daily execution counts, daily pass rates, spotting regressions (sudden drop in pass rate on a specific day). Critical for QA metrics."}, {"q": "What does SELECT user_id FROM orders GROUP BY user_id HAVING COUNT(DISTINCT status) > 1 find?", "opts": ["Users with more than 1 order", "Users with orders in multiple statuses", "Error", "Duplicate user_ids"], "ans": 1, "exp": "This finds users whose orders span more than one status value — e.g., user has both 'pending' and 'delivered' orders. Useful for user journey analysis in QA."}, {"q": "What does GROUP BY city, status return?", "opts": ["One group per city", "One group per unique combination of city AND status", "One group per status", "Two separate GROUP BY results"], "ans": 1, "exp": "Multiple GROUP BY columns create groups based on unique combinations. (city='NYC', status='active') is one group; (city='NYC', status='inactive') is another."}, {"q": "What is the output of AVG(1) applied to a table with 5 rows?", "opts": ["5", "1", "0.5", "Error"], "ans": 1, "exp": "AVG(1) averages the literal value 1 across all rows. Sum of five 1s = 5. Count = 5. Average = 1. It's an unusual but valid query."}, {"q": "What does SELECT COUNT(*), SUM(amount) FROM orders WHERE status = 'pending' return if no pending orders exist?", "opts": ["NULL, NULL", "0, NULL", "0, 0", "Error"], "ans": 1, "exp": "COUNT(*) returns 0 for empty sets. SUM() returns NULL for empty sets (no values to sum). This asymmetry is important: use COALESCE(SUM(amount), 0) to get 0 instead of NULL."}, {"q": "When must you use HAVING instead of WHERE?", "opts": ["Always", "When filtering on an aggregate function result (e.g., HAVING COUNT(*) > 5)", "When filtering on NULL values", "When using ORDER BY"], "ans": 1, "exp": "HAVING is required for aggregate conditions because WHERE executes before aggregation — aggregate functions aren't yet computed at WHERE time. Use HAVING COUNT(*) > 5, not WHERE COUNT(*) > 5."}, {"q": "What is the difference between COUNT(DISTINCT col) and COUNT(*)?", "opts": ["No difference", "COUNT(DISTINCT col) counts unique non-NULL values; COUNT(*) counts all rows", "COUNT(*) is always larger", "COUNT(DISTINCT col) includes NULLs"], "ans": 1, "exp": "COUNT(*) counts every row. COUNT(DISTINCT col) counts unique non-NULL values in col. If col has duplicates or NULLs, COUNT(*) > COUNT(DISTINCT col)."}, {"q": "What is a GROUP BY use case for QA test suite reporting?", "opts": ["None — GROUP BY has no QA use", "SELECT suite_name, COUNT(*) total, SUM(passed) pass, SUM(failed) fail FROM test_results GROUP BY suite_name — per-suite pass/fail breakdown", "DELETE test data", "Sort results"], "ans": 1, "exp": "Grouping test results by suite gives per-suite metrics: total tests, pass count, fail count. This is the foundation of test reporting dashboards."}]}, {"id": 5, "title": "Subqueries & IN/EXISTS", "level": "Junior", "icon": "🪆", "desc": "Scalar subqueries, correlated subqueries, IN, NOT IN, EXISTS, derived tables", "questions": [{"q": "What is a subquery?", "opts": ["A query inside another query", "A partial query", "A stored procedure", "A view"], "ans": 0, "exp": "A subquery (inner query) is a SELECT statement nested inside another SQL statement. It's evaluated first and its result is used by the outer query."}, {"q": "What is a scalar subquery?", "opts": ["A subquery returning many rows", "A subquery returning exactly one row and one column", "A subquery in FROM clause", "A correlated subquery"], "ans": 1, "exp": "A scalar subquery returns a single value (one row, one column). It can be used anywhere a single value is expected: SELECT, WHERE, HAVING."}, {"q": "What is a correlated subquery?", "opts": ["A subquery that references columns from the outer query", "A subquery inside FROM clause", "A subquery returning multiple columns", "A subquery using IN"], "ans": 0, "exp": "A correlated subquery references a column from the outer query, creating a dependency. It's re-evaluated for every row of the outer query, making it slower but more powerful."}, {"q": "What does EXISTS return?", "opts": ["The rows from the subquery", "TRUE if subquery returns any rows, FALSE if none", "Count of matching rows", "NULL if no rows"], "ans": 1, "exp": "EXISTS is a Boolean test — it returns TRUE if the subquery returns at least one row, FALSE otherwise. The actual columns returned by the subquery don't matter."}, {"q": "Why is NOT EXISTS better than NOT IN when the subquery may have NULLs?", "opts": ["NOT EXISTS is faster", "NOT IN with NULLs returns empty result (NULL comparison issue); NOT EXISTS handles NULLs correctly", "They are identical", "NOT IN is always better"], "ans": 1, "exp": "NOT IN internally uses !=. If any value in the list is NULL, then NULL != x returns NULL (not TRUE), causing the entire NOT IN to return no rows. NOT EXISTS is immune to this."}, {"q": "What is a derived table?", "opts": ["A temporary table", "A subquery used in the FROM clause, given an alias", "A permanent computed table", "A VIEW"], "ans": 1, "exp": "A derived table (inline view) is a subquery in the FROM clause. It must have an alias. Example: FROM (SELECT user_id, COUNT(*) as cnt FROM orders GROUP BY user_id) oc."}, {"q": "What does IN return when the subquery is empty?", "opts": ["TRUE — empty means all match", "FALSE for all rows", "NULL", "Error"], "ans": 1, "exp": "col IN (empty set) always returns FALSE. If the subquery returns no rows, no value matches, so all rows are excluded."}, {"q": "What is the difference between IN and =ANY?", "opts": ["They are different", "Functionally identical — IN is shorthand for = ANY", "= ANY is faster", "IN only works with literals"], "ans": 1, "exp": "col IN (subquery) and col = ANY (subquery) are functionally identical. IN is more readable. Similarly, NOT IN = <> ALL."}, {"q": "Which is generally faster: IN or EXISTS for large datasets?", "opts": ["IN is always faster", "EXISTS is generally faster when the subquery returns large result sets", "They are always identical", "Depends on indexes and query planner"], "ans": 3, "exp": "Performance depends on the database optimizer, indexes, and data distribution. Modern optimizers often transform IN to EXISTS internally. EXISTS short-circuits at first match; IN may process all values."}, {"q": "What does a subquery in SELECT clause do?", "opts": ["Filters rows", "Adds a calculated column to each row using an inner query", "Creates a join", "Sorts results"], "ans": 1, "exp": "A subquery in SELECT is evaluated once per row and its result appears as a column value. Example: SELECT name, (SELECT COUNT(*) FROM orders WHERE user_id = u.id) as order_count FROM users u."}, {"q": "What is wrong: SELECT * FROM users WHERE id IN (SELECT id, name FROM users)?", "opts": ["IN requires EXISTS", "IN with multiple columns needs ROW comparison: WHERE (id, name) IN (SELECT id, name...)", "Nothing wrong", "IN can't use subqueries"], "ans": 1, "exp": "IN expects the subquery to return a single column. (SELECT id, name) returns two columns, causing an error. For multi-column IN, use: WHERE (col1, col2) IN (SELECT c1, c2 FROM ...)."}, {"q": "What does NOT EXISTS do when the subquery finds a match?", "opts": ["Returns TRUE", "Returns FALSE — match found means NOT EXISTS is FALSE", "Returns NULL", "Throws an error"], "ans": 1, "exp": "NOT EXISTS returns FALSE when the subquery finds at least one matching row. It returns TRUE only when the subquery returns no rows."}, {"q": "What is the risk of a correlated subquery in SELECT with a large outer table?", "opts": ["No risk", "Performance: subquery runs once per outer row — N executions for N rows", "Memory overflow", "NULL errors"], "ans": 1, "exp": "Correlated subqueries are evaluated per outer row. For a table with 1 million rows, the subquery runs 1 million times. This is a major performance risk — use JOIN instead where possible."}, {"q": "What does the following return: SELECT * FROM users WHERE salary > (SELECT AVG(salary) FROM users)?", "opts": ["Error — can't compare to subquery", "Users earning above average salary", "Average salary", "All users"], "ans": 1, "exp": "The scalar subquery returns the average salary. The outer query compares each user's salary to that average. This is a classic use of scalar subqueries."}, {"q": "What is a CTE (Common Table Expression)?", "opts": ["A type of index", "A named temporary result set defined with WITH clause, used in the main query", "A stored procedure", "A database trigger"], "ans": 1, "exp": "CTE (WITH clause) defines a named subquery that can be referenced multiple times in the main query. More readable than nested subqueries. WITH cte AS (SELECT...) SELECT * FROM cte."}, {"q": "What is a recursive CTE?", "opts": ["A CTE referencing itself to handle hierarchical data", "A CTE inside another CTE", "A CTE returning recursive results", "A CTE used twice"], "ans": 0, "exp": "A recursive CTE has a base case + recursive case and references itself. Used for hierarchical/tree data: organizational charts, category trees, network graphs."}, {"q": "What does WITH orders_summary AS (SELECT user_id, COUNT(*) cnt FROM orders GROUP BY user_id) SELECT u.name, os.cnt FROM users u JOIN orders_summary os ON u.id = os.user_id do?", "opts": ["Error", "Joins users with a pre-computed order count per user", "Creates a new table", "Inserts data"], "ans": 1, "exp": "The CTE pre-computes order counts. The main query joins users to these counts. Equivalent to using a derived table but more readable. os.cnt = order count per user."}, {"q": "How do you use a subquery to find the department with the highest average salary?", "opts": ["SELECT MAX(AVG(salary)) FROM employees", "SELECT department FROM employees GROUP BY department HAVING AVG(salary) = (SELECT MAX(avg_sal) FROM (SELECT AVG(salary) avg_sal FROM employees GROUP BY department) t)", "SELECT department, MAX(salary) FROM employees", "SELECT department FROM employees ORDER BY salary DESC LIMIT 1"], "ans": 1, "exp": "Inner subquery computes AVG per department. Outer subquery gets MAX of those averages. Main query finds the department matching that MAX. Nested aggregates require nested subqueries."}, {"q": "What does SELECT * FROM orders WHERE user_id NOT IN (SELECT id FROM banned_users) return?", "opts": ["Orders from banned users", "Orders from non-banned users (if banned_users has no NULLs)", "All orders", "Error"], "ans": 1, "exp": "NOT IN excludes matching rows. If banned_users.id contains any NULL, NOT IN returns empty result (NULL issue). Safe when the subquery column is NOT NULL constrained."}, {"q": "What is a semi-join?", "opts": ["Half a INNER JOIN", "A pattern returning left rows that have at least one match in the right — similar to EXISTS", "A non-equijoin", "A LEFT JOIN without NULLs"], "ans": 1, "exp": "A semi-join returns rows from table A that have at least one match in table B without duplicating left rows (unlike regular JOIN). Implemented via IN or EXISTS in SQL."}, {"q": "What does the following do: SELECT name FROM users u WHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.user_id = u.id)?", "opts": ["Users who have placed orders", "Users who have NOT placed any orders (anti-join)", "All users", "Error"], "ans": 1, "exp": "NOT EXISTS returns TRUE when no matching order exists for the user. This is a classic anti-join: find users with no orders. More reliable than NOT IN when NULLs might be present."}, {"q": "When would you use a CTE instead of a subquery?", "opts": ["Never — CTEs are always worse", "When the subquery is reused multiple times or for readability", "CTEs are always faster", "Only in stored procedures"], "ans": 1, "exp": "CTEs improve readability, especially for complex queries. They can be referenced multiple times (unlike subqueries in WHERE). Some databases also cache CTE results."}, {"q": "What is the difference between a derived table and a CTE?", "opts": ["No difference", "CTE is defined before the main query with WITH; derived table is inline in FROM", "CTEs are faster", "Derived tables can be recursive"], "ans": 1, "exp": "CTEs are defined upfront (WITH clause) and can be referenced by name multiple times. Derived tables are inline anonymous subqueries in FROM. CTEs are more readable; derived tables are self-contained."}, {"q": "What does SELECT * FROM a WHERE id = (SELECT MAX(id) FROM a) return?", "opts": ["Error — can't use subquery in WHERE with own table", "The row with the maximum id", "All rows", "The minimum id row"], "ans": 1, "exp": "The scalar subquery returns the MAX id. The outer query finds the row with that id. Perfectly valid — a table can appear in both the outer query and subquery."}, {"q": "What makes a subquery uncorrelated?", "opts": ["It uses EXISTS", "It doesn't reference the outer query — evaluates independently", "It uses IN", "It returns only one row"], "ans": 1, "exp": "An uncorrelated (non-correlated) subquery is independent of the outer query. It runs once and returns a fixed result used by the outer query. More efficient than correlated subqueries."}, {"q": "Can a subquery return multiple columns and rows?", "opts": ["No — always one column, one row", "Yes — but only usable in FROM clause as a derived table", "Yes — usable anywhere", "Only in SELECT"], "ans": 1, "exp": "Multi-row, multi-column subqueries can only be used in FROM (derived table). Single-column multi-row can be used in IN/EXISTS. Single-column single-row (scalar) can be used in WHERE, SELECT, HAVING."}, {"q": "What does SELECT COUNT(*) FROM (SELECT DISTINCT user_id FROM events) t return?", "opts": ["Count of all events", "Count of unique users who have events", "Error — can't COUNT derived tables", "Count of event types"], "ans": 1, "exp": "The derived table selects unique user_ids. COUNT(*) on that result gives the number of distinct users. Equivalent to COUNT(DISTINCT user_id) from events."}, {"q": "What is wrong with referencing a CTE after the main SELECT statement?", "opts": ["Nothing wrong", "CTEs must be defined BEFORE the query that uses them (WITH clause at the top)", "CTEs can be defined anywhere", "CTEs are defined after SELECT"], "ans": 1, "exp": "CTEs are defined with the WITH clause before the main SELECT. They cannot be defined after the main query. All CTEs in a WITH block are defined before the SELECT begins."}, {"q": "What does SELECT * FROM products p WHERE price > ALL (SELECT price FROM discounts WHERE product_id = p.id) return?", "opts": ["Products cheaper than all discounts", "Products whose price exceeds every applicable discount price", "Error — ALL is invalid here", "Products with no discounts"], "ans": 1, "exp": "ALL requires the condition to hold for every row in the subquery. If a product has no discounts, ALL returns TRUE (vacuously true). Products returned have a price higher than all their discount prices."}, {"q": "Why might a subquery in SELECT cause performance issues?", "opts": ["Subqueries in SELECT are always efficient", "It runs once per row of the outer query (N queries for N rows)", "SELECT subqueries don't run", "SELECT is not affected by subqueries"], "ans": 1, "exp": "A correlated subquery in SELECT is the costliest pattern. For 100,000 rows, it runs 100,000 times. Replace with JOIN or window functions for better performance."}, {"q": "What does WITH RECURSIVE cte AS (SELECT 1 AS n UNION ALL SELECT n+1 FROM cte WHERE n < 5) SELECT * FROM cte return?", "opts": ["Error", "Rows with n = 1, 2, 3, 4, 5", "Infinite loop", "Only n = 1"], "ans": 1, "exp": "Recursive CTE: base case (n=1), recursive case (n+1) until n=5. Result is 5 rows: 1, 2, 3, 4, 5. The WHERE n < 5 terminates recursion."}, {"q": "What is the subquery equivalent of LEFT JOIN ... WHERE b IS NULL?", "opts": ["NOT IN (SELECT ...)", "NOT EXISTS (SELECT 1 FROM b WHERE b.key = a.key)", "IN (SELECT ...)", "Both A and B (with caveat for NULLs)"], "ans": 3, "exp": "Both patterns find rows in A with no match in B. NOT EXISTS is always safe. NOT IN works when the subquery column is non-nullable. LEFT JOIN + WHERE IS NULL is often the most readable."}, {"q": "What does SELECT * FROM users WHERE (SELECT COUNT(*) FROM orders WHERE user_id = users.id) = 0 return?", "opts": ["Users with orders", "Users with no orders", "Error", "All users"], "ans": 1, "exp": "The correlated subquery counts orders for each user. WHERE count = 0 keeps users with zero orders. Equivalent to NOT EXISTS pattern but less efficient."}, {"q": "Can CTEs be used in INSERT, UPDATE, DELETE?", "opts": ["No — SELECT only", "Yes — CTEs work in DML statements too", "Only in stored procedures", "Only in views"], "ans": 1, "exp": "CTEs can be used in INSERT, UPDATE, and DELETE. WITH cte AS (...) DELETE FROM t WHERE id IN (SELECT id FROM cte). Very useful for complex conditional DML."}, {"q": "What does the LATERAL keyword do in subqueries?", "opts": ["An alias for correlated subquery", "Allows a subquery in FROM to reference columns from preceding tables in the same FROM clause", "Makes subqueries faster", "Required for all derived tables"], "ans": 1, "exp": "LATERAL (supported in PostgreSQL, MySQL 8.0+) allows a derived table to reference columns from tables earlier in the FROM clause — enabling row-by-row derived table evaluation."}, {"q": "What query finds users who ordered all products in category 'electronics'?", "opts": ["SELECT DISTINCT user_id FROM orders WHERE category='electronics'", "SELECT user_id FROM orders o JOIN products p ON o.product_id=p.id WHERE p.category='electronics' GROUP BY user_id HAVING COUNT(DISTINCT o.product_id) = (SELECT COUNT(*) FROM products WHERE category='electronics')", "SELECT user_id FROM orders WHERE product_id IN (SELECT id FROM products WHERE category='electronics')", "SELECT * FROM users WHERE EXISTS (SELECT 1 FROM orders WHERE category='electronics')"], "ans": 1, "exp": "Count distinct electronics products ordered per user, compare to total electronics products. If equal, the user ordered ALL electronics. This 'division' pattern uses GROUP BY + HAVING with a subquery."}, {"q": "In QA, when would you use a subquery over a JOIN?", "opts": ["Never — JOINs are always better", "When you need to reference an aggregate result (e.g., WHERE salary > AVG(salary)) or check existence", "For all conditions", "Only for DELETE statements"], "ans": 1, "exp": "Subqueries shine for: comparing to aggregates, checking existence (IN/EXISTS), and when JOIN would create unwanted row duplication. JOINs are better when you need columns from both tables."}, {"q": "What does SELECT * FROM a WHERE id IN (SELECT id FROM b UNION SELECT id FROM c) do?", "opts": ["Error — IN can't use UNION", "Rows from a where id exists in b OR c", "Rows from a where id exists in b AND c", "Rows from a, b, and c combined"], "ans": 1, "exp": "UNION combines ids from b and c (deduplicating). IN then checks if a.id is in that combined set — matching rows from either b or c."}, {"q": "What does the following detect: SELECT * FROM orders o WHERE amount <> (SELECT SUM(amount) FROM order_items WHERE order_id = o.id)?", "opts": ["Orders with no items", "Orders where the header amount doesn't match the sum of line items", "Duplicate orders", "Orders with NULLs"], "ans": 1, "exp": "This detects data integrity issues: orders where the total in the orders table doesn't match the sum of its order_items. A critical QA data consistency check."}, {"q": "What is the ANY operator equivalent in plain English?", "opts": ["'Greater than all values'", "'Equal to or greater/lesser than at least one value in the set'", "'Exists in the set'", "'Not in the set'"], "ans": 1, "exp": "ANY (or SOME) applies the comparison to each value in the subquery — returns TRUE if the comparison is TRUE for at least one value. price > ANY(10, 20, 30) = price > 10."}, {"q": "What is the ALL operator equivalent in plain English?", "opts": ["'Equal to some value'", "'The comparison must be true for EVERY value in the subquery'", "'Exists'", "'Not any'"], "ans": 1, "exp": "ALL requires the condition to hold for every value in the subquery. price > ALL(10, 20, 30) = price > 30 (must exceed the maximum). ALL with empty set returns TRUE."}, {"q": "Can a subquery be used in GROUP BY?", "opts": ["Yes", "No — GROUP BY requires direct column references or expressions", "Only in MySQL", "Only with CTEs"], "ans": 1, "exp": "GROUP BY does not accept subqueries. Use a CTE or derived table to pre-compute values and then GROUP BY the result."}, {"q": "What does SELECT EXISTS (SELECT 1 FROM users WHERE role='admin') return?", "opts": ["List of admin users", "1 (TRUE) if any admin exists, 0 (FALSE) if none", "Error", "NULL"], "ans": 1, "exp": "EXISTS returns 1 or 0. This query is a quick existence check — useful in application queries, stored procedures, or QA verification scripts."}, {"q": "What is a QA use case for subqueries?", "opts": ["None", "Verifying that every order has at least one item, detecting orphan data, comparing aggregates to thresholds", "Only for reporting", "Only for deleting test data"], "ans": 1, "exp": "QA subquery use cases: NOT EXISTS to find orders without items, IN to verify test data matches expected IDs, scalar subqueries to compare values against computed benchmarks."}, {"q": "When does a scalar subquery cause an error?", "opts": ["When it returns 0 rows", "When it returns more than one row", "When it returns NULL", "When it uses GROUP BY"], "ans": 1, "exp": "A scalar subquery context expects exactly one value. If it returns multiple rows, MySQL raises an error. If it returns 0 rows, it returns NULL (not an error)."}, {"q": "What is the purpose of SELECT 1 in an EXISTS subquery?", "opts": ["Returns the value 1", "The returned value doesn't matter — EXISTS only checks row existence", "Counts rows", "Required syntax"], "ans": 1, "exp": "EXISTS only cares if rows exist, not what they contain. SELECT 1 is idiomatic — SELECT 1, SELECT *, SELECT null all work equally. SELECT 1 is conventional because it's explicit about not needing real data."}, {"q": "What does WITH cte1 AS (...), cte2 AS (...) SELECT ... mean?", "opts": ["Error — only one CTE allowed", "Multiple CTEs defined in a single WITH clause, usable in the main query", "Two separate queries", "CTEs that reference each other"], "ans": 1, "exp": "Multiple CTEs can be defined in one WITH clause, separated by commas. Each can reference previously defined CTEs in the same WITH block. Both are available to the final SELECT."}, {"q": "What does SELECT * FROM orders o WHERE NOT EXISTS (SELECT 1 FROM returns r WHERE r.order_id = o.id AND r.status = 'approved') find?", "opts": ["Returned orders", "Orders with no approved return", "Orders with returns", "Error"], "ans": 1, "exp": "NOT EXISTS returns TRUE when no matching return exists. This finds orders that either have no return at all, or have returns that aren't 'approved' — orders that haven't been successfully refunded."}, {"q": "What is an inline view?", "opts": ["A database VIEW", "A subquery in FROM clause (derived table)", "A CTE", "An indexed view"], "ans": 1, "exp": "An inline view is a subquery used in the FROM clause, also called a derived table. It behaves like a temporary table scoped to the query. Must have an alias."}, {"q": "How do you avoid the N+1 query problem in SQL?", "opts": ["Use NOT IN", "Use JOINs or single queries with subqueries instead of one query per row", "Use more indexes", "Use DELETE instead of SELECT"], "ans": 1, "exp": "N+1 problem: 1 query to get N records, then N queries to get related data. Solution: one JOIN or subquery to get all data at once. Critical for application performance and QA load testing."}, {"q": "What does SELECT user_id FROM (SELECT user_id, ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY created_at DESC) as rn FROM orders) t WHERE rn = 1 return?", "opts": ["Error", "Most recent order per user (deduplication via window function in subquery)", "All orders", "Oldest order per user"], "ans": 1, "exp": "Inner query assigns row numbers within each user partition, newest first. Outer query keeps rn=1 — the most recent order row per user. This subquery+window function pattern is a key Junior SQL skill."}, {"q": "What is a derived table?", "opts": ["A table created by CREATE TABLE", "A subquery in FROM clause given an alias", "A temporary table", "A view"], "ans": 1, "exp": "A derived table is a subquery used in FROM: SELECT * FROM (SELECT col FROM t WHERE cond) AS alias. It acts as a virtual table for the duration of the query."}, {"q": "What does IN (SELECT ...) do when the subquery returns 0 rows?", "opts": ["Returns all rows", "Returns no rows (no values to match against)", "Error", "Returns NULL"], "ans": 1, "exp": "col IN (empty set) is always FALSE. If the subquery returns no rows, the IN list is empty and nothing matches, resulting in an empty result set."}, {"q": "What is the purpose of the WITH clause?", "opts": ["Creating permanent tables", "Defining named CTEs (Common Table Expressions) for use in the main query", "Granting permissions", "Creating views"], "ans": 1, "exp": "WITH defines CTEs — named, reusable subqueries within a single SQL statement. They make complex queries more readable and can be referenced multiple times in the main query."}, {"q": "What does WHERE col = ANY (SELECT ...) mean?", "opts": ["col equals every value in subquery", "col equals at least one value in subquery (equivalent to IN)", "col equals none", "Syntax error"], "ans": 1, "exp": "= ANY is equivalent to IN. col = ANY(1, 2, 3) is TRUE if col equals 1, 2, or 3. <> ANY (not equal to at least one) is NOT the same as NOT IN."}, {"q": "What happens when a scalar subquery returns 0 rows?", "opts": ["Error", "Returns NULL", "Returns 0", "Returns empty string"], "ans": 1, "exp": "A scalar subquery context expects one row. If 0 rows are returned, NULL is used. This is different from returning multiple rows (which causes an error)."}, {"q": "Which is more readable for complex multi-step logic: nested subqueries or CTEs?", "opts": ["Nested subqueries — more concise", "CTEs — named, modular, each step is clear", "No difference", "CTEs are invalid SQL"], "ans": 1, "exp": "CTEs name each logical step, making queries self-documenting. Nested subqueries become increasingly hard to read with depth. CTEs are the modern preferred approach for complex queries."}, {"q": "What does NOT IN (1, 2, NULL) return for any value?", "opts": ["Works correctly", "Returns NULL/empty for all values (because of NULL in the list)", "Error", "Returns TRUE for values not in list"], "ans": 1, "exp": "NOT IN internally uses !=. col != NULL = NULL (not FALSE). Any NULL in the NOT IN list causes the entire condition to be NULL (not TRUE), resulting in no rows returned. Classic SQL trap."}, {"q": "What is a correlated subquery's main performance concern?", "opts": ["It returns too many rows", "It executes once per outer query row (N executions for N rows)", "It uses too much memory", "It can't use indexes"], "ans": 1, "exp": "A correlated subquery is tightly coupled to the outer query and re-executed per row. For a million-row outer table = a million subquery executions. Use JOINs or window functions to avoid this."}, {"q": "How do you find the latest row per group using a subquery?", "opts": ["SELECT * FROM t ORDER BY date DESC LIMIT 1", "SELECT * FROM t WHERE date = (SELECT MAX(date) FROM t t2 WHERE t2.group_id = t.group_id)", "SELECT MAX(date) FROM t GROUP BY group_id", "SELECT * FROM t GROUP BY group_id"], "ans": 1, "exp": "Correlated subquery finds MAX(date) for each group. Outer query returns the row with that date per group. This is a classic 'latest per group' pattern (also solved with window functions)."}]}, {"id": 6, "title": "NULL Handling & Data Integrity", "level": "Junior", "icon": "🚫", "desc": "NULL semantics, COALESCE, NULLIF, constraints, integrity checks", "questions": [{"q": "What does NULL represent in SQL?", "opts": ["Zero", "Empty string", "Unknown or missing value", "False"], "ans": 2, "exp": "NULL means the value is unknown, missing, or not applicable. It is NOT zero, NOT empty string, NOT false. Any operation with NULL returns NULL."}, {"q": "What is the result of NULL = NULL?", "opts": ["TRUE", "FALSE", "NULL", "Error"], "ans": 2, "exp": "NULL = NULL returns NULL (unknown), not TRUE. You cannot compare NULL with = — use IS NULL or IS NOT NULL instead."}, {"q": "What does COALESCE(a, b, c) return?", "opts": ["The sum of a, b, c", "The first non-NULL value among a, b, c", "Always a", "NULL if all are NULL"], "ans": 1, "exp": "COALESCE returns the first non-NULL argument. If all are NULL, it returns NULL. It's the standard way to provide a default value for NULLable columns."}, {"q": "What does NULLIF(a, b) return?", "opts": ["NULL always", "a if a != b; NULL if a = b", "b if b != a", "Error if equal"], "ans": 1, "exp": "NULLIF(a, b) returns NULL when a equals b, otherwise returns a. Useful for avoiding division by zero: price / NULLIF(quantity, 0)."}, {"q": "What does COUNT(col) vs COUNT(*) return when col has NULLs?", "opts": ["Same count", "COUNT(col) < COUNT(*) when NULLs exist", "COUNT(*) excludes NULLs", "COUNT(col) includes NULLs"], "ans": 1, "exp": "COUNT(col) skips NULL values. COUNT(*) counts all rows. If 5 of 100 rows have NULL in col, COUNT(*) = 100, COUNT(col) = 95."}, {"q": "What does NULL + 5 return?", "opts": ["5", "0", "NULL", "Error"], "ans": 2, "exp": "Any arithmetic with NULL returns NULL. NULL means unknown, so unknown + 5 = unknown (NULL). Use COALESCE to handle: COALESCE(col, 0) + 5."}, {"q": "What constraint ensures a column cannot be NULL?", "opts": ["UNIQUE", "PRIMARY KEY", "NOT NULL", "CHECK"], "ans": 2, "exp": "NOT NULL constraint prevents NULL values in a column. PRIMARY KEY implies NOT NULL + UNIQUE. UNIQUE allows NULLs (and typically allows multiple NULLs). CHECK validates value conditions."}, {"q": "What does IFNULL(col, 'default') do?", "opts": ["Returns 'default' always", "Returns col if not NULL, else 'default'", "Returns NULL if col = 'default'", "Same as NVL"], "ans": 1, "exp": "IFNULL(col, replacement) is MySQL's two-argument NULL handler. Returns col if it's not NULL; returns replacement if it is NULL. COALESCE(col, 'default') does the same with standard SQL."}, {"q": "A column has a UNIQUE constraint. How many NULLs can it contain?", "opts": ["Zero — UNIQUE means no NULLs", "One only", "Multiple (NULLs are not considered equal for UNIQUE)", "Two maximum"], "ans": 2, "exp": "In most databases (MySQL, PostgreSQL), a UNIQUE column can have multiple NULL values because NULL != NULL, so they don't violate uniqueness. One exception: SQL Server allows only one NULL in a unique index."}, {"q": "What is the result of 'hello' || NULL in SQL (concatenation)?", "opts": ["'hello'", "'helloNULL'", "NULL", "Error"], "ans": 2, "exp": "String concatenation with NULL returns NULL in standard SQL. In MySQL, CONCAT('hello', NULL) = NULL. Use COALESCE: CONCAT('hello', COALESCE(col, ''))."}, {"q": "What does WHERE col IS NOT NULL AND col != '' ensure?", "opts": ["col is not empty", "col has a meaningful non-empty, non-null value", "col equals something", "col is numeric"], "ans": 1, "exp": "This double check is required: IS NOT NULL rejects NULL values, != '' rejects empty strings. Together they ensure the column has actual content."}, {"q": "What is a NULL in a foreign key column?", "opts": ["Always a violation", "Means the relationship is optional (the FK is not set)", "Error in all databases", "Same as 0"], "ans": 1, "exp": "A NULL foreign key means the record doesn't reference any parent — the relationship is optional. This is valid unless the column has a NOT NULL constraint. Example: an employee with no manager (manager_id IS NULL)."}, {"q": "What does COALESCE(SUM(amount), 0) protect against?", "opts": ["Division by zero", "SUM returning NULL when the table is empty", "NULL in individual amounts", "Overflow"], "ans": 1, "exp": "SUM of an empty set returns NULL. COALESCE(SUM(amount), 0) converts that NULL to 0, which is usually the desired behavior for financial totals when no data exists."}, {"q": "What is NULL-safe equality in MySQL?", "opts": ["= operator", "<=> operator (spaceship operator)", "IS operator", "!= operator"], "ans": 1, "exp": "<=> (NULL-safe equals) returns TRUE when both sides are NULL (unlike = which returns NULL). NULL <=> NULL = 1. NULL = NULL = NULL. Useful when comparing nullable columns."}, {"q": "What constraint prevents duplicate values but allows NULLs?", "opts": ["PRIMARY KEY", "UNIQUE", "NOT NULL", "FOREIGN KEY"], "ans": 1, "exp": "UNIQUE constraint prevents duplicate non-NULL values while typically allowing multiple NULLs. PRIMARY KEY = UNIQUE + NOT NULL. FOREIGN KEY checks referential integrity."}, {"q": "How do you detect rows where any column in a row is NULL?", "opts": ["WHERE * IS NULL", "WHERE col1 IS NULL OR col2 IS NULL OR col3 IS NULL", "WHERE NULL", "WHERE ROW IS NULL"], "ans": 1, "exp": "Must check each column individually with IS NULL. SQL has no wildcard NULL check across all columns. INFORMATION_SCHEMA can help identify nullable columns to build the query."}, {"q": "What is a data integrity check for NULL in a required field?", "opts": ["SELECT * FROM users WHERE name = NULL", "SELECT * FROM users WHERE name IS NULL", "SELECT * FROM users WHERE name = ''", "SELECT COUNT(name) FROM users"], "ans": 1, "exp": "IS NULL is the only correct way to check for NULL. SELECT users with NULL name reveals records that should have required data but don't — a data quality issue for QA."}, {"q": "What does NULLIF(salary, 0) achieve when used in salary/NULLIF(salary,0)?", "opts": ["Rounds to nearest zero", "Returns NULL instead of division-by-zero error when salary = 0", "Rounds salary", "Returns 0 when salary is 0"], "ans": 1, "exp": "NULLIF(salary, 0) returns NULL when salary = 0. Dividing by NULL returns NULL instead of throwing a division-by-zero error. salary/NULLIF(salary,0) = 1 always (when not zero), which isn't useful, but the pattern prevents errors."}, {"q": "What does GROUP BY treat NULLs as?", "opts": ["Excludes NULLs", "Groups all NULLs together as one group", "Error", "Converts NULLs to 0"], "ans": 1, "exp": "GROUP BY treats NULL as a grouping key — all rows with NULL in the group column form one group. This can be surprising: a 'NULL' group appears in the results."}, {"q": "What does ORDER BY place NULLs by default in MySQL?", "opts": ["Last for ASC", "First for ASC (NULLs are smallest)", "Excluded", "Last for both ASC and DESC"], "ans": 1, "exp": "In MySQL, NULLs are treated as the lowest possible value in sorting. So in ASC order, NULLs come first; in DESC order, NULLs come last."}, {"q": "What is the QA implication of finding unexpected NULLs in a NOT NULL column?", "opts": ["No implication — NULLs in NOT NULL columns are normal", "Impossible — NOT NULL constraint prevents it", "Indicates the constraint may not be enforced (direct DB write, migration issue)", "Data is correct"], "ans": 2, "exp": "If NOT NULL constraint is properly enforced, NULLs can't exist. Finding NULLs means data was inserted bypassing the constraint (direct SQL, migration, data import). Critical QA finding."}, {"q": "What does COALESCE(price, list_price, 0) represent logically?", "opts": ["Returns the maximum price", "Returns price if available, otherwise list_price, otherwise 0", "Returns sum of all prices", "Returns the first price"], "ans": 1, "exp": "COALESCE tries each value left to right, returning the first non-NULL. This implements a priority fallback: use price, fall back to list_price, default to 0."}, {"q": "What does NOT NULL in a column definition guarantee?", "opts": ["Column has a value greater than zero", "Column cannot contain NULL — every row must have a value", "Column is indexed", "Column is unique"], "ans": 1, "exp": "NOT NULL constraint enforces that every row in that column must have a non-NULL value. The database rejects any INSERT or UPDATE that would set the column to NULL."}, {"q": "What query detects records with empty or null phone numbers?", "opts": ["SELECT * FROM users WHERE phone = NULL", "SELECT * FROM users WHERE phone IS NULL OR TRIM(phone) = ''", "SELECT * FROM users WHERE phone != ''", "SELECT * FROM users WHERE LENGTH(phone) = 0"], "ans": 1, "exp": "IS NULL catches NULL values. TRIM(phone) = '' catches strings with only spaces. LENGTH = 0 would miss whitespace-only strings. The combined IS NULL OR TRIM = '' pattern is most thorough."}, {"q": "What does this find: SELECT id FROM orders WHERE shipped_at IS NULL AND status = 'shipped'?", "opts": ["Shipped orders with no timestamp (data inconsistency)", "All shipped orders", "Unshipped orders", "Orders with NULL status"], "ans": 0, "exp": "A status of 'shipped' but null shipped_at is a data inconsistency — orders marked as shipped but missing the timestamp. This is a critical QA data integrity finding."}, {"q": "What is the difference between a NULL and an empty string in a database?", "opts": ["No difference", "NULL = unknown/missing; '' = known but empty — different in comparisons and storage", "NULL is bigger", "'' is always better"], "ans": 1, "exp": "NULL is the absence of a value (unknown). '' is an actual value that happens to be empty. They compare differently (IS NULL vs = ''), store differently, and have different semantic meanings."}, {"q": "What does CASE WHEN col IS NULL THEN 'Missing' ELSE col END do?", "opts": ["Converts all values to 'Missing'", "Replaces NULLs with 'Missing' — same as COALESCE(col, 'Missing')", "Checks if col is a string", "Returns NULL for non-NULL values"], "ans": 1, "exp": "This CASE expression replaces NULL with 'Missing'. Functionally equivalent to COALESCE(col, 'Missing') but more explicit. COALESCE is preferred for simple NULL replacement."}, {"q": "What does a FOREIGN KEY constraint NOT do?", "opts": ["Prevents orphan records", "Ensures child rows have valid parent references", "Automatically deletes child rows when parent is deleted (unless CASCADE is set)", "Replaces the need for joins"], "ans": 2, "exp": "Foreign keys don't automatically cascade deletes unless ON DELETE CASCADE is specified. Default behavior is to RESTRICT (prevent parent deletion if children exist). FKs prevent orphans but need configuration for cascade behavior."}, {"q": "What does CHECK(age >= 0) constraint do?", "opts": ["Automatically sets age to 0", "Prevents negative age values from being inserted", "Makes age required", "Indexes the age column"], "ans": 1, "exp": "CHECK constraint validates that the specified condition is TRUE for every row. CHECK(age >= 0) prevents negative ages. MySQL 8.0.16+ enforces CHECK constraints."}, {"q": "What is referential integrity?", "opts": ["All values in a column are unique", "Foreign key values must reference existing primary key values (or be NULL)", "All columns have values", "Dates are in correct format"], "ans": 1, "exp": "Referential integrity means that every foreign key value either references an existing primary key value in the parent table, or is NULL (if the FK column allows NULL). Enforced by FOREIGN KEY constraints."}, {"q": "What QA check finds rows where amount_charged != amount_expected?", "opts": ["SELECT * FROM transactions WHERE amount IS NULL", "SELECT * FROM transactions WHERE amount_charged != amount_expected OR (amount_charged IS NULL) != (amount_expected IS NULL)", "SELECT * FROM transactions WHERE amount_charged = 0", "SELECT * FROM transactions GROUP BY amount"], "ans": 1, "exp": "Simple != misses cases where one is NULL (NULL != x = NULL). The complete check handles the case where exactly one side is NULL using COALESCE or IS NULL comparison."}, {"q": "What does IFNULL(col, 0) vs COALESCE(col, 0) have in common?", "opts": ["Nothing", "Both return 0 when col is NULL — functionally identical for two arguments", "IFNULL is SQL standard", "COALESCE only works with numbers"], "ans": 1, "exp": "For two arguments, IFNULL(a, b) and COALESCE(a, b) are functionally identical. COALESCE is SQL standard and accepts multiple arguments. IFNULL is MySQL-specific and limited to two arguments."}, {"q": "What does IS DISTINCT FROM do?", "opts": ["Same as !=", "NULL-safe comparison: returns TRUE when values differ, treating NULL = NULL as equal", "Always returns FALSE", "Sorts values"], "ans": 1, "exp": "IS DISTINCT FROM is NULL-safe inequality. NULL IS DISTINCT FROM NULL = FALSE (they're the same). NULL IS DISTINCT FROM 1 = TRUE. The inverse of <=> (NULL-safe equals)."}, {"q": "What is the result of NULL OR TRUE?", "opts": ["NULL", "TRUE", "FALSE", "Error"], "ans": 1, "exp": "In three-valued logic: NULL OR TRUE = TRUE. Because regardless of whether the NULL is true or false, OR with TRUE is always TRUE. NULL OR FALSE = NULL. NULL AND TRUE = NULL."}, {"q": "What is the result of NULL AND FALSE?", "opts": ["NULL", "TRUE", "FALSE", "Error"], "ans": 2, "exp": "NULL AND FALSE = FALSE. Because regardless of whether NULL is true or false, AND with FALSE is always FALSE. This is three-valued logic in SQL."}, {"q": "What triggers a 'Data too long for column' error in QA testing?", "opts": ["NULL input", "Input exceeding column size definition (e.g., VARCHAR(50) getting 100 chars)", "Integer overflow", "Constraint violation"], "ans": 1, "exp": "VARCHAR and CHAR have length limits. Inserting data longer than the defined length triggers this error. QA boundary testing should include strings at and beyond the column's max length."}, {"q": "What does a UNIQUE constraint with multiple columns create?", "opts": ["Each column is individually unique", "The combination of those columns must be unique", "Error — only one column per UNIQUE", "A composite primary key"], "ans": 1, "exp": "UNIQUE(col1, col2) ensures that the combination of col1+col2 values is unique across rows. Individual values can repeat — only the combination must be unique."}, {"q": "What does SELECT * FROM invoices WHERE paid_at IS NULL AND due_date < NOW() return for a QA check?", "opts": ["All invoices", "Overdue unpaid invoices (past due date, not yet paid)", "All paid invoices", "Invoices with null amounts"], "ans": 1, "exp": "Unpaid (paid_at IS NULL) AND past due date (due_date < NOW()) = overdue invoices. This is a real QA financial data integrity check."}, {"q": "What is the danger of NOT IN when the right-side list contains NULL?", "opts": ["No danger", "NOT IN returns empty result (no rows), even if logical matches exist", "NOT IN throws an error", "NOT IN converts NULL to 0"], "ans": 1, "exp": "NULL in NOT IN list: a != NULL returns NULL (not TRUE). Since NOT IN requires all comparisons to be TRUE (uses AND internally), any NULL makes everything NULL. Result: empty result set."}, {"q": "What does COALESCE(a, b, c, d) return if a=NULL, b=NULL, c=5, d=10?", "opts": ["NULL", "10", "5", "Error"], "ans": 2, "exp": "COALESCE returns the first non-NULL from left to right: a=NULL skip, b=NULL skip, c=5 return. It doesn't evaluate d because a non-NULL was found at c."}, {"q": "How do you check that a JSON column is neither NULL nor empty JSON?", "opts": ["WHERE col != NULL", "WHERE col IS NOT NULL AND col != 'null' AND JSON_LENGTH(col) > 0", "WHERE col = '{}'", "WHERE LENGTH(col) > 2"], "ans": 1, "exp": "JSON columns can be NULL, the string 'null', or an empty object/array. IS NOT NULL handles database NULL. col != 'null' handles JSON null literal. JSON_LENGTH > 0 ensures there's actual content."}, {"q": "What QA scenario makes NULLIF most useful?", "opts": ["Joining tables", "Avoiding division-by-zero when denominator might be 0 or a sentinel value", "Counting rows", "Sorting results"], "ans": 1, "exp": "NULLIF(denominator, 0) converts 0 to NULL, making division return NULL instead of error. Example: success_rate = success_count / NULLIF(total_count, 0)."}, {"q": "What is NULL in three-valued logic?", "opts": ["False", "A third truth value: unknown (neither TRUE nor FALSE)", "Zero", "An error state"], "ans": 1, "exp": "SQL uses three-valued logic: TRUE, FALSE, and NULL (unknown). Standard boolean logic is two-valued. The third value NULL introduces counter-intuitive behavior in comparisons and logical operators."}, {"q": "When should a column be made NOT NULL in a test database?", "opts": ["Never — test data needs flexibility", "When the production column is NOT NULL — test data should mirror production constraints", "Always", "Only for primary keys"], "ans": 1, "exp": "Test databases should mirror production constraints including NOT NULL, to catch constraint violations during testing rather than in production. Relaxing constraints in test environments creates false confidence."}, {"q": "What does IS NULL vs = NULL test in terms of QA results?", "opts": ["Same results", "IS NULL: correct (finds NULLs). = NULL: incorrect (never matches, always returns NULL)", "= NULL: correct", "Both are incorrect"], "ans": 1, "exp": "IS NULL correctly identifies NULL values. = NULL never returns TRUE (NULL = NULL = NULL, not TRUE). Using = NULL instead of IS NULL is a common bug that causes WHERE to match nothing."}, {"q": "What does the following detect: SELECT email, COUNT(*) FROM users GROUP BY email HAVING COUNT(*) > 1?", "opts": ["Unique emails", "Users with the same email address (duplicates)", "Invalid emails", "All emails with orders"], "ans": 1, "exp": "GROUP BY email + HAVING COUNT > 1 identifies email values that appear more than once — duplicate registrations or data integrity issues. Classic QA deduplication check."}, {"q": "What does NOT NULL mean in a SELECT result vs in a column definition?", "opts": ["Same meaning", "SELECT: values happen to be non-null; Definition: constraint preventing NULLs", "No difference", "SELECT NOT NULL is a filter"], "ans": 1, "exp": "NOT NULL in column definition is a constraint enforced by the database. In SELECT results, a value being non-null just means it has a value in that query's output — no constraint implied."}, {"q": "What does NULLIF(price, 0) protect against in division?", "opts": ["Dividing by large numbers", "Dividing by zero — NULLIF(price,0) returns NULL when price=0, making division return NULL instead of error", "Null division", "Negative numbers"], "ans": 1, "exp": "revenue / NULLIF(price, 0): when price=0, NULLIF returns NULL. NULL / NULL = NULL — no error. Without NULLIF, division by zero throws an exception."}, {"q": "What is the result of NULL AND TRUE?", "opts": ["TRUE", "FALSE", "NULL", "Error"], "ans": 2, "exp": "Three-valued logic: NULL AND TRUE = NULL. The NULL could be TRUE or FALSE — we don't know. TRUE AND TRUE = TRUE. FALSE AND TRUE = FALSE. NULL AND TRUE = unknown."}, {"q": "What does WHERE TRIM(col) IS NOT NULL AND TRIM(col) != '' accomplish?", "opts": ["Same as col IS NOT NULL", "Ensures the column has actual non-whitespace content (catches NULL, empty, and whitespace-only values)", "Removes whitespace", "Converts NULL to empty string"], "ans": 1, "exp": "TRIM removes leading/trailing spaces. Checking TRIM(col) != '' catches whitespace-only strings like '   ' that aren't truly meaningful values. Combined with IS NOT NULL, this is thorough content validation."}, {"q": "What does COALESCE(NULL, NULL, NULL) return?", "opts": ["0", "''", "NULL", "Error"], "ans": 2, "exp": "COALESCE returns the first non-NULL argument. If all arguments are NULL, COALESCE returns NULL."}, {"q": "Can UNIQUE constraint columns contain multiple NULLs?", "opts": ["No — UNIQUE means only one of each value including NULL", "Yes — in most databases, NULLs don't violate UNIQUE (NULL != NULL)", "Only one NULL allowed", "Depends on the data type"], "ans": 1, "exp": "In MySQL and PostgreSQL, NULL values don't violate UNIQUE constraints because NULL != NULL. A UNIQUE column can have multiple NULL rows. SQL Server allows only one NULL in a unique index."}, {"q": "What is the difference between IFNULL and COALESCE in MySQL?", "opts": ["No difference", "IFNULL takes exactly 2 args; COALESCE takes 2+ args; IFNULL is MySQL-specific; COALESCE is SQL standard", "IFNULL is faster", "COALESCE only works with strings"], "ans": 1, "exp": "IFNULL(a, b) is MySQL-specific with exactly 2 arguments. COALESCE(a, b, c, ...) is SQL standard and accepts any number. For 2 arguments, they're functionally identical."}, {"q": "What does WHERE age != 30 return for a row where age is NULL?", "opts": ["The row is included (NULL != 30 is TRUE)", "The row is excluded (NULL != 30 is NULL, not TRUE)", "Error", "The row is included only if other conditions are TRUE"], "ans": 1, "exp": "NULL != 30 = NULL (unknown), not TRUE. The WHERE clause requires TRUE to include a row. Unknown (NULL) means the row is excluded. To also find NULL ages: WHERE age != 30 OR age IS NULL."}, {"q": "What is NULL propagation?", "opts": ["NULL spreading between tables", "When NULL in a calculation makes the entire result NULL (arithmetic, concat, comparison with NULL)", "NULL indexes", "A type of constraint"], "ans": 1, "exp": "NULL propagates through operations: NULL + 5 = NULL, NULL * 0 = NULL, CONCAT('x', NULL) = NULL. The 'unknown' value infects the entire expression result."}, {"q": "How do you find rows where a JSON column field is NULL?", "opts": ["WHERE col IS NULL", "WHERE col->'$.field' IS NULL", "WHERE JSON_VALUE(col, 'field') = NULL", "WHERE col = 'null'"], "ans": 1, "exp": "col->'$.field' IS NULL finds rows where the JSON path exists but is null, OR where the path doesn't exist. JSON_EXTRACT(col, '$.field') IS NULL is the equivalent explicit syntax."}, {"q": "What does NULLIF(SUM(amount), 0) prevent?", "opts": ["Large sums", "A zero sum being used as a divisor elsewhere (converts to NULL so division returns NULL not error)", "Negative sums", "NULL in the sum"], "ans": 1, "exp": "If SUM(amount) = 0 and this is used as a denominator, division by zero occurs. NULLIF(SUM(amount), 0) converts that 0 to NULL so division returns NULL gracefully."}, {"q": "What is the QA significance of finding NULL in an auto_increment primary key?", "opts": ["Normal — NULL is default before insert", "Critical bug — primary keys cannot be NULL (NOT NULL implied by PRIMARY KEY)", "Minor warning", "Only a problem in MySQL"], "ans": 1, "exp": "PRIMARY KEY implies NOT NULL + UNIQUE. A NULL primary key is impossible with proper constraints. Finding one means the constraint is somehow not enforced — serious data integrity issue."}, {"q": "What does WHERE created_at IS NOT NULL AND created_at > '2000-01-01' accomplish?", "opts": ["Same as just WHERE created_at > '2000-01-01'", "Extra clarity but functionally equivalent — NULL > date returns NULL (excluded anyway), but IS NOT NULL is explicit", "Faster query", "Includes more rows"], "ans": 1, "exp": "NULL > any value = NULL (not TRUE), so NULL dates are already excluded by the comparison. Adding IS NOT NULL is redundant but makes intent explicit and avoids confusion in code review."}, {"q": "What is the purpose of CHECK constraint in data quality testing?", "opts": ["None — CHECK is only for developers", "Enforces business rules at DB level: QA can verify constraints exist and work by trying to insert invalid data", "Slows down inserts", "Only works with NOT NULL"], "ans": 1, "exp": "CHECK constraints enforce data rules (CHECK(age >= 0), CHECK(status IN ('active','inactive'))). QA should test that invalid data is rejected at DB level — validating constraint existence and correct implementation."}]}, {"id": 7, "title": "Date & Time Functions", "level": "Junior", "icon": "📅", "desc": "NOW, CURDATE, DATE_ADD, DATEDIFF, DATE_FORMAT, time ranges", "questions": [{"q": "What does NOW() return?", "opts": ["Current date only", "Current time only", "Current date AND time (datetime)", "NULL"], "ans": 2, "exp": "NOW() returns the current datetime including both date and time components. CURDATE() returns only the date. CURTIME() returns only the time."}, {"q": "What is the difference between NOW() and CURDATE()?", "opts": ["No difference", "NOW() includes time component; CURDATE() is date only", "CURDATE() includes time; NOW() doesn't", "NOW() is UTC; CURDATE() is local"], "ans": 1, "exp": "NOW() returns a DATETIME (e.g., 2024-01-15 14:30:00). CURDATE() returns a DATE (e.g., 2024-01-15). Use CURDATE() when you only need to compare dates without time."}, {"q": "What does DATE_ADD(date, INTERVAL 7 DAY) do?", "opts": ["Subtracts 7 days", "Adds 7 days to the date", "Returns 7 days as an interval", "Returns the date of 7 days ago"], "ans": 1, "exp": "DATE_ADD adds the specified interval to the date. DATE_ADD('2024-01-01', INTERVAL 7 DAY) = '2024-01-08'. DATE_SUB subtracts."}, {"q": "What does DATEDIFF(date1, date2) return?", "opts": ["The larger date", "The difference in days: date1 - date2", "The smaller date", "NULL if dates are equal"], "ans": 1, "exp": "DATEDIFF returns the number of days between two dates: date1 minus date2. If date1 < date2, the result is negative. DATEDIFF('2024-01-10', '2024-01-05') = 5."}, {"q": "What does DATE(created_at) = CURDATE() filter?", "opts": ["Records from this week", "Records created today (any time)", "Records from exactly right now", "Records older than today"], "ans": 1, "exp": "DATE(created_at) extracts the date part from the datetime. Comparing to CURDATE() finds all records from today, regardless of the exact time they were created."}, {"q": "What does YEAR(date) return?", "opts": ["Full date", "Year component as integer", "Year as string", "NULL"], "ans": 1, "exp": "YEAR() extracts the year as an integer. YEAR('2024-06-15') = 2024. Similarly, MONTH() returns 1-12, DAY() returns 1-31."}, {"q": "What is INTERVAL syntax used for?", "opts": ["Creating table intervals", "Specifying time periods for date arithmetic", "Formatting dates", "Creating indexes on date columns"], "ans": 1, "exp": "INTERVAL specifies a time period: INTERVAL 1 DAY, INTERVAL 3 MONTH, INTERVAL 2 HOUR. Used with DATE_ADD, DATE_SUB, and arithmetic operators."}, {"q": "How do you find records from the last 30 days?", "opts": ["WHERE date > 30", "WHERE date >= DATE_SUB(NOW(), INTERVAL 30 DAY)", "WHERE DATEDIFF(date, NOW()) = 30", "WHERE date BETWEEN NOW()-30 AND NOW()"], "ans": 1, "exp": "DATE_SUB(NOW(), INTERVAL 30 DAY) computes the datetime 30 days ago. >= includes records from that moment forward. Option D's NOW()-30 subtracts 30 seconds, not days."}, {"q": "What does DATE_FORMAT(date, '%Y-%m-%d') return for '2024-06-15'?", "opts": ["'2024-06-15'", "'15/06/2024'", "'June 15, 2024'", "Error"], "ans": 0, "exp": "DATE_FORMAT with '%Y-%m-%d' returns the date in ISO format: year-month-day. %Y = 4-digit year, %m = 2-digit month, %d = 2-digit day."}, {"q": "What does UNIX_TIMESTAMP() return?", "opts": ["Date in Unix format string", "Seconds since epoch (1970-01-01 00:00:00 UTC)", "Milliseconds since epoch", "Current time zone offset"], "ans": 1, "exp": "UNIX_TIMESTAMP() returns an integer: seconds elapsed since the Unix epoch (Jan 1, 1970 UTC). FROM_UNIXTIME() converts back to datetime."}, {"q": "What is the difference between DATETIME and TIMESTAMP in MySQL?", "opts": ["No difference", "DATETIME: 1000-9999 range, stores as-is; TIMESTAMP: 1970-2038, stores as UTC, auto-converts on timezone change", "TIMESTAMP is more precise", "DATETIME is deprecated"], "ans": 1, "exp": "DATETIME stores exactly as entered (no timezone conversion). TIMESTAMP stores UTC and converts to server timezone on retrieval. TIMESTAMP also has a much smaller range (2038 problem)."}, {"q": "What does TIMESTAMPDIFF(HOUR, start_time, end_time) return?", "opts": ["Difference in minutes", "Difference in hours between two timestamps", "Difference in days", "Error"], "ans": 1, "exp": "TIMESTAMPDIFF(unit, start, end) returns the difference in the specified unit. HOUR gives hours, MINUTE gives minutes, DAY gives days, etc."}, {"q": "How do you find users registered in 2023?", "opts": ["WHERE created_at = 2023", "WHERE YEAR(created_at) = 2023", "WHERE created_at LIKE '2023%'", "Both B and C (with caveats)"], "ans": 3, "exp": "YEAR(created_at) = 2023 works but can't use date index. LIKE '2023%' works if stored as string but is fragile. Best index-friendly approach: BETWEEN '2023-01-01' AND '2023-12-31 23:59:59'."}, {"q": "What does NOW() - INTERVAL 1 HOUR return?", "opts": ["Yesterday", "One hour ago from now", "Tomorrow", "Error — can't subtract interval from NOW()"], "ans": 1, "exp": "Date arithmetic with INTERVAL is valid. NOW() - INTERVAL 1 HOUR returns the datetime exactly one hour before the current time."}, {"q": "What is the 2038 problem with TIMESTAMP?", "opts": ["Year 2038 doesn't exist", "TIMESTAMP uses 32-bit integer; will overflow on Jan 19, 2038", "TIMESTAMP can't store years after 2038 in any database", "2038 is a leap year issue"], "ans": 1, "exp": "TIMESTAMP is stored as a 32-bit unsigned integer (seconds since epoch). It overflows on Jan 19, 2038 at 03:14:07 UTC. Use DATETIME for long-lived data beyond 2038."}, {"q": "What does DATE_SUB(CURDATE(), INTERVAL 1 MONTH) return on 2024-03-01?",
