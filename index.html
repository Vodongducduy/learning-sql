"opts": ["2024-02-01", "2024-02-29", "2024-01-31", "Error"], "ans": 0, "exp": "DATE_SUB subtracts 1 month: 2024-03-01 - 1 month = 2024-02-01. MySQL handles month-end edge cases by adjusting to valid dates."}, {"q": "What does STR_TO_DATE('15/06/2024', '%d/%m/%Y') return?", "opts": ["Error", "'2024-06-15' as a DATE", "'15/06/2024'", "NULL"], "ans": 1, "exp": "STR_TO_DATE converts a string to a DATE using a format mask. Useful when date strings from APIs or CSVs need to be stored as proper DATE types."}, {"q": "What does LAST_DAY('2024-02-01') return?", "opts": ["2024-02-01", "2024-02-28 or 2024-02-29 depending on leap year", "2024-02-30", "Error"], "ans": 1, "exp": "LAST_DAY() returns the last day of the month for the given date. It correctly handles leap years: 2024-02-01 → 2024-02-29 (2024 is a leap year)."}, {"q": "How do you group records by month for a report?", "opts": ["GROUP BY date", "GROUP BY MONTH(created_at)", "GROUP BY DATE_FORMAT(created_at, '%Y-%m')", "Both B and C (with difference)"], "ans": 3, "exp": "MONTH(created_at) groups by month number (1-12) — doesn't distinguish years. DATE_FORMAT(created_at, '%Y-%m') groups by year+month ('2024-01', '2024-02') — correct for multi-year reports."}, {"q": "What is the result of CURDATE() + INTERVAL 0 DAY?", "opts": ["NULL", "Yesterday", "Today's date (same as CURDATE())", "Error"], "ans": 2, "exp": "Adding 0 days returns the same date. CURDATE() + INTERVAL 0 DAY = CURDATE(). A no-op but valid syntax."}, {"q": "What does CONVERT_TZ(dt, 'UTC', 'US/Eastern') do?", "opts": ["Converts the date to a string", "Converts a datetime from UTC to US Eastern timezone", "Changes the server timezone", "Stores timezone info in the datetime"], "ans": 1, "exp": "CONVERT_TZ() converts datetimes between timezones. Requires the timezone tables to be populated. Critical for QA when testing applications serving multiple timezones."}, {"q": "What query finds sessions longer than 30 minutes?", "opts": ["WHERE duration > 30", "WHERE TIMESTAMPDIFF(MINUTE, start_time, end_time) > 30", "WHERE end_time - start_time > 30", "WHERE session_length > '00:30:00'"], "ans": 1, "exp": "TIMESTAMPDIFF(MINUTE, start, end) returns duration in minutes. > 30 filters sessions exceeding 30 minutes. Direct subtraction of datetimes gives seconds in MySQL."}, {"q": "What does DATE_FORMAT(NOW(), '%W, %M %d %Y') return?", "opts": ["Error", "Something like 'Tuesday, June 15 2024'", "'06/15/2024'", "ISO format date"], "ans": 1, "exp": "DATE_FORMAT format codes: %W = weekday name, %M = month name, %d = day, %Y = 4-digit year. Returns human-readable date string."}, {"q": "What is the QA use of SYSDATE() vs NOW()?", "opts": ["Same function", "NOW() returns query start time (consistent in a transaction); SYSDATE() returns current time at each call", "SYSDATE is deprecated", "NOW() is faster"], "ans": 1, "exp": "In a single transaction, NOW() returns the same timestamp throughout (transaction start time). SYSDATE() returns the actual current time at each call. For consistent timestamps in test transactions, use NOW()."}, {"q": "What query finds records from 'this week' (Monday to Sunday)?", "opts": ["WHERE WEEK(date) = WEEK(NOW())", "WHERE date BETWEEN DATE_SUB(CURDATE(), INTERVAL WEEKDAY(CURDATE()) DAY) AND DATE_ADD(DATE_SUB(CURDATE(), INTERVAL WEEKDAY(CURDATE()) DAY), INTERVAL 6 DAY)", "WHERE DATEDIFF(NOW(), date) < 7", "Both A and B work but differently"], "ans": 3, "exp": "WEEK(date) = WEEK(NOW()) is simple but may include last week's days for early-week dates. The WEEKDAY-based calculation precisely finds Monday-Sunday of current week. Both have valid use cases."}, {"q": "What does MAKEDATE(2024, 100) return?", "opts": ["Error", "April 9, 2024 (the 100th day of 2024)", "100th row", "January 100, 2024 (error)"], "ans": 1, "exp": "MAKEDATE(year, dayofyear) creates a date from year and day-of-year number. Day 100 of 2024 = April 9 (31+29+31+9=100, Feb has 29 in leap year 2024)."}, {"q": "How would you compare two dates ignoring time?", "opts": ["date1 = date2", "DATE(date1) = DATE(date2)", "TRUNCATE(date1) = TRUNCATE(date2)", "CAST(date1 AS DATE) = CAST(date2 AS DATE)"], "ans": 1, "exp": "DATE() extracts just the date part. Both B and D work, but DATE() is more concise. Direct = comparison on DATETIME includes time, so different times on the same day would not match."}, {"q": "What does WHERE created_at BETWEEN '2024-01-01' AND '2024-01-31' miss?", "opts": ["Nothing — captures all January", "Records on Jan 31 after midnight (e.g., 2024-01-31 14:30:00)", "Records on Jan 1", "All records"], "ans": 1, "exp": "BETWEEN with DATETIME compares including time. '2024-01-31' is interpreted as '2024-01-31 00:00:00'. Records on Jan 31 after midnight are excluded. Use: BETWEEN '2024-01-01' AND '2024-01-31 23:59:59' or < '2024-02-01'."}, {"q": "What is the best way to store timestamps for auditing in QA?", "opts": ["VARCHAR date strings", "TIMESTAMP with DEFAULT CURRENT_TIMESTAMP", "INT Unix timestamps", "DATE type"], "ans": 1, "exp": "TIMESTAMP with DEFAULT CURRENT_TIMESTAMP automatically records when a row was created. ON UPDATE CURRENT_TIMESTAMP tracks updates. This is the standard audit trail pattern."}, {"q": "What does SELECT DAYOFWEEK('2024-01-15') return?", "opts": ["1 (Monday)", "2 (Monday in MySQL — 1=Sunday, 2=Monday)", "15", "Error"], "ans": 1, "exp": "DAYOFWEEK() returns 1=Sunday, 2=Monday, 3=Tuesday...7=Saturday. Jan 15, 2024 was a Monday = 2. WEEKDAY() uses 0=Monday convention."}, {"q": "What does QUARTER(date) return for October?", "opts": ["3", "4", "10", "Error"], "ans": 1, "exp": "QUARTER() returns 1-4. October is in Q4 (Oct-Dec). Q1=Jan-Mar, Q2=Apr-Jun, Q3=Jul-Sep, Q4=Oct-Dec."}, {"q": "What query finds events scheduled for tomorrow?", "opts": ["WHERE event_date = NOW()+1", "WHERE DATE(event_date) = CURDATE() + INTERVAL 1 DAY", "WHERE event_date > CURDATE()", "WHERE DATEDIFF(event_date, NOW()) = 1"], "ans": 1, "exp": "DATE(event_date) = CURDATE() + INTERVAL 1 DAY correctly finds tomorrow's date regardless of time. Option C includes all future dates. Option D might miss some cases with time components."}, {"q": "What is the purpose of DATE() function when used in WHERE clause?", "opts": ["Formats date for display", "Extracts date from DATETIME for date-only comparison", "Converts string to date", "Validates date format"], "ans": 1, "exp": "DATE() in WHERE extracts the date component, enabling date-only comparisons. Without DATE(), comparing a DATETIME column to a DATE requires exact time match (usually midnight)."}, {"q": "What does TIMESTAMPADD(MINUTE, 15, NOW()) return?", "opts": ["15 minutes ago", "15 minutes from now", "15 seconds from now", "Error"], "ans": 1, "exp": "TIMESTAMPADD(unit, count, datetime) adds count units to datetime. MINUTE + 15 = 15 minutes from now. Equivalent to NOW() + INTERVAL 15 MINUTE."}, {"q": "What does DAYNAME('2024-12-25') return?", "opts": ["25", "'December'", "'Wednesday'", "'Christmas'"], "ans": 2, "exp": "DAYNAME() returns the full name of the day of the week. Dec 25, 2024 falls on a Wednesday."}, {"q": "What is the correct way to store a timezone-aware timestamp for global QA?", "opts": ["VARCHAR string with timezone in text", "TIMESTAMP type (auto-converts to UTC for storage)", "DATETIME with a separate timezone column", "INT Unix timestamp"], "ans": 1, "exp": "TIMESTAMP stores as UTC internally and converts to session timezone on retrieval — best for global apps. For more control, DATETIME + separate timezone column or INT Unix timestamp (timezone-neutral) are alternatives."}, {"q": "What does EXTRACT(HOUR FROM NOW()) return?", "opts": ["The current minute", "The current hour (0-23)", "Seconds", "Full time string"], "ans": 1, "exp": "EXTRACT(unit FROM datetime) extracts a specific component. HOUR returns 0-23. MINUTE returns 0-59. SECOND returns 0-59."}, {"q": "What does DATE_FORMAT(NOW(), '%H:%i:%s') return?", "opts": ["Date in European format", "Current time as HH:MM:SS", "Error", "Date and time combined"], "ans": 1, "exp": "Date_FORMAT codes: %H = hour (24h), %i = minute, %s = second. Returns formatted time like '14:35:22'."}, {"q": "What query finds test runs completed in the last hour?", "opts": ["WHERE completed_at > NOW()-60", "WHERE completed_at >= NOW() - INTERVAL 1 HOUR", "WHERE HOUR(completed_at) = HOUR(NOW())", "WHERE TIMESTAMPDIFF(MINUTE, completed_at, NOW()) < 60"], "ans": 3, "exp": "Options B and D both work correctly. B is simpler (checks if timestamp is within last hour range). D uses TIMESTAMPDIFF for explicit minute-level check. Option C only checks the hour portion, not the date."}, {"q": "What does PERIOD_DIFF('202406', '202401') return?", "opts": ["5", "6", "January", "Error"], "ans": 0, "exp": "PERIOD_DIFF() calculates the number of months between two periods (YYYYMM format). June 2024 - January 2024 = 5 months."}, {"q": "How do you calculate age in years from a birthdate?", "opts": ["DATEDIFF(NOW(), birthdate)", "YEAR(NOW()) - YEAR(birthdate)", "TIMESTAMPDIFF(YEAR, birthdate, NOW())", "Both B and C (with difference)"], "ans": 3, "exp": "B is simple but incorrect for birthdays not yet reached this year. TIMESTAMPDIFF(YEAR, birthdate, NOW()) accurately handles the birthday cutoff. Both are used but C is more accurate."}, {"q": "What does WHERE event_time >= CURDATE() filter in a DATETIME column?", "opts": ["Events today only", "Events from today midnight onwards (today + future)", "Past events", "Events after noon today"], "ans": 1, "exp": "CURDATE() returns today at 00:00:00 when compared to DATETIME. >= means today from midnight onwards, including future events. This is the standard 'from today' filter."}, {"q": "What QA check uses DATEDIFF?", "opts": ["Checking column lengths", "Verifying SLA compliance: DATEDIFF(resolved_at, created_at) > SLA_days finds violations", "Counting rows", "Joining tables"], "ans": 1, "exp": "DATEDIFF is perfect for SLA verification. DATEDIFF(resolved_at, created_at) > 5 finds tickets not resolved within 5 days. A critical QA operations metric."}, {"q": "What is a common QA bug involving date comparison?", "opts": ["Using = for dates", "Using DATETIME columns with DATE-only comparison, missing time-based records", "Using CURDATE()", "Using INTERVAL"], "ans": 1, "exp": "Common bug: WHERE created_at = '2024-01-15' expects to find all records from that day, but actually matches only '2024-01-15 00:00:00' exactly. Fix: DATE(created_at) = '2024-01-15' or use BETWEEN."}, {"q": "What does DATE_ADD('2024-01-31', INTERVAL 1 MONTH) return?", "opts": ["2024-02-31 (error)", "2024-02-29 (MySQL clamps to last day of Feb)", "2024-03-01", "2024-02-28"], "ans": 1, "exp": "When month arithmetic would produce an invalid date (Feb 31), MySQL returns the last valid day of that month. 2024 is a leap year, so Feb has 29 days → 2024-02-29."}, {"q": "What does WEEKDAY('2024-01-15') return?", "opts": ["2 (Wednesday because Jan 15, 2024 is Monday)", "0 (Monday — WEEKDAY uses 0=Monday convention)", "1", "15"], "ans": 1, "exp": "WEEKDAY() uses 0=Monday, 1=Tuesday...6=Sunday. Jan 15, 2024 was a Monday = 0. DAYOFWEEK() uses 1=Sunday, 2=Monday convention."}, {"q": "What does TIME_TO_SEC('01:30:00') return?", "opts": ["130", "1.5", "5400", "Error"], "ans": 2, "exp": "TIME_TO_SEC converts a time to seconds: 1 hour = 3600 sec, 30 min = 1800 sec. Total = 5400 seconds. SEC_TO_TIME reverses this."}, {"q": "What is the purpose of ADDDATE vs DATE_ADD?", "opts": ["Different functions entirely", "Synonyms — ADDDATE and DATE_ADD do the same thing", "ADDDATE is deprecated", "ADDDATE adds only days; DATE_ADD adds any unit"], "ans": 0, "exp": "ADDDATE and DATE_ADD are synonyms in MySQL. Both add an interval to a date. ADDDATE can also take just a number of days: ADDDATE('2024-01-01', 10) adds 10 days."}, {"q": "What does TIMESTAMP('2024-01-15', '10:30:00') return?", "opts": ["Error", "2024-01-15 10:30:00 as DATETIME", "'10:30:00'", "NULL"], "ans": 1, "exp": "TIMESTAMP(date, time) combines a date and time into a DATETIME. Useful for constructing specific test timestamps."}, {"q": "How do you find records from Q1 of the current year?", "opts": ["WHERE date LIKE YEAR(NOW())%01%", "WHERE QUARTER(date) = 1 AND YEAR(date) = YEAR(NOW())", "WHERE date BETWEEN '01-01' AND '03-31'", "WHERE MONTH(date) <= 3"], "ans": 1, "exp": "QUARTER(date) = 1 gets Q1 (Jan-Mar). YEAR(date) = YEAR(NOW()) restricts to current year. Option D would include other years. BETWEEN without year is incomplete."}, {"q": "What does CURRENT_TIMESTAMP return?", "opts": ["Null", "The same as NOW() — current date and time", "Only current date", "Only current time"], "ans": 1, "exp": "CURRENT_TIMESTAMP is a synonym for NOW(). Both return the current datetime. In column definitions, DEFAULT CURRENT_TIMESTAMP auto-sets the value on insert."}, {"q": "What does PERIOD_ADD('202401', 6) return?", "opts": ["'202407'", "'202406'", "202407", "Error"], "ans": 2, "exp": "PERIOD_ADD(period, n) adds n months to a period (YYYYMM format). 202401 + 6 = 202407. Note: returns an integer, not a string."}, {"q": "What does DATE_DIFF('2024-06-15', '2024-01-01') calculate?", "opts": ["Difference in months", "Difference in years", "Not a MySQL function — use DATEDIFF('2024-06-15', '2024-01-01') = 166 days", "Hours between dates"], "ans": 2, "exp": "MySQL uses DATEDIFF (no underscore in 'DATE'). DATEDIFF('2024-06-15', '2024-01-01') = 165 days. DATE_DIFF with underscore is not a MySQL function."}, {"q": "How do you get the first day of the current month?", "opts": ["DATE_SUB(CURDATE(), INTERVAL DAY(CURDATE())-1 DAY)", "DATE_FORMAT(CURDATE(), '%Y-%m-01')", "MAKEDATE(YEAR(NOW()), MONTH(NOW()))", "Both A and B are correct"], "ans": 3, "exp": "Both approaches work: A uses DATE_SUB to subtract (day_of_month - 1) days from today. B formats the current date with day set to '01'. DATE_FORMAT is simpler and more readable."}, {"q": "What does DAYOFYEAR('2024-12-31') return?", "opts": ["365", "366", "31", "12"], "ans": 1, "exp": "2024 is a leap year (366 days). DAYOFYEAR() returns the day number within the year (1-366). Dec 31 of 2024 = day 366."}, {"q": "What is the difference between TIME() and CURTIME()?", "opts": ["Same function", "TIME(datetime) extracts time from any datetime; CURTIME() returns current time", "CURTIME() includes date", "TIME() is deprecated"], "ans": 1, "exp": "TIME(expr) extracts the time portion from any date/datetime argument. CURTIME() returns the current time only. TIME(NOW()) = CURTIME()."}, {"q": "What does NOW() return inside a stored procedure that runs for 5 minutes?", "opts": ["Changes every second", "Returns the same value throughout the procedure call (statement start time)", "Returns the procedure start time", "Changes every minute"], "ans": 1, "exp": "NOW() returns the time the statement started (not real-time). For long-running operations, SYSDATE() returns actual real-time. In a transaction, NOW() stays constant throughout."}, {"q": "What is the result of DATE_ADD('2024-01-15', INTERVAL -7 DAY)?", "opts": ["Error — negative intervals invalid", "2024-01-08 (subtracts 7 days)", "2024-01-22", "2024-01-14"], "ans": 1, "exp": "Negative INTERVAL values are valid and work as subtraction. DATE_ADD with INTERVAL -7 DAY = DATE_SUB with INTERVAL 7 DAY. Both return 7 days before the given date."}, {"q": "How do you find the day of the week for a date?", "opts": ["DAY('2024-06-15')", "DAYNAME('2024-06-15') → 'Saturday'", "WEEKDAY('2024-06-15') → 5 (0=Monday)", "Both B and C (different formats)"], "ans": 3, "exp": "DAYNAME() returns the full day name ('Saturday'). WEEKDAY() returns a number (0=Monday through 6=Sunday). Both are useful — DAYNAME for display, WEEKDAY for calculations."}, {"q": "What does WHERE YEAR(created_at) = 2024 AND MONTH(created_at) = 6 filter?", "opts": ["Records from June 2024 only", "Records from all of 2024", "Records where created_at = '2024-06-01'", "Records from June any year"], "ans": 0, "exp": "YEAR = 2024 AND MONTH = 6 filters to June 2024 only. This is equivalent to: WHERE created_at BETWEEN '2024-06-01' AND '2024-06-30 23:59:59'. The BETWEEN approach is more index-friendly."}]}, {"id": 8, "title": "QA Data Verification Patterns", "level": "Junior", "icon": "✅", "desc": "API verification, test data, integrity checks, QA-specific SQL patterns", "questions": [{"q": "After POST /users, what SQL verifies the user was created?", "opts": ["SELECT * FROM users", "SELECT * FROM users WHERE email = 'posted_email' ORDER BY created_at DESC LIMIT 1", "SELECT COUNT(*) FROM users", "DELETE FROM users WHERE email = 'posted_email'"], "ans": 1, "exp": "Filter by the specific email posted, order by created_at DESC to get the most recent, LIMIT 1. This precisely identifies the row created by the API call."}, {"q": "What SQL verifies a PUT /users/{id} updated the correct field?", "opts": ["SELECT * FROM users", "SELECT name, email FROM users WHERE id = {id}", "UPDATE users SET name = ... WHERE id = {id}", "SELECT COUNT(*) FROM users WHERE id = {id}"], "ans": 1, "exp": "After a PUT, select the specific updated fields for the specific ID and verify they match what was sent. SELECT * works but specific columns confirm exactly what changed."}, {"q": "What query confirms a DELETE /orders/{id} actually removed the record?", "opts": ["SELECT COUNT(*) FROM orders WHERE id = {id} (expect 0)", "DELETE FROM orders WHERE id = {id}", "SELECT * FROM orders", "SELECT id FROM orders WHERE id IS NULL"], "ans": 0, "exp": "After DELETE, COUNT(*) for that ID should return 0. If it returns 1, the delete failed. This is the standard API delete verification pattern."}, {"q": "What SQL detects duplicate registrations by the same user?", "opts": ["SELECT DISTINCT email FROM users", "SELECT email, COUNT(*) FROM users GROUP BY email HAVING COUNT(*) > 1", "SELECT * FROM users WHERE email IS NOT NULL", "SELECT email FROM users ORDER BY created_at"], "ans": 1, "exp": "GROUP BY email + HAVING COUNT > 1 finds emails that appear more than once — duplicate registrations. The most common data integrity check for registration flows."}, {"q": "How do you verify that a bulk insert API created the expected number of records?", "opts": ["SELECT * FROM table", "SELECT COUNT(*) FROM table WHERE batch_id = {id}", "SELECT SUM(*) FROM table", "SELECT MAX(id) FROM table"], "ans": 1, "exp": "Count records matching the batch identifier. Compare the count to the number sent in the bulk insert. If they differ, some records weren't created."}, {"q": "What SQL finds orders in 'shipped' status but with no tracking number?", "opts": ["SELECT * FROM orders WHERE status = 'shipped'", "SELECT * FROM orders WHERE status = 'shipped' AND (tracking_number IS NULL OR tracking_number = '')", "SELECT * FROM orders WHERE tracking_number IS NULL", "SELECT * FROM orders GROUP BY status"], "ans": 1, "exp": "Combines status check with NULL/empty tracking number check — a data consistency issue: order is marked shipped but missing the tracking info that should be set at the same time."}, {"q": "What is the SQL pattern to verify referential integrity after inserting child records?", "opts": ["SELECT * FROM child", "SELECT c.* FROM child c LEFT JOIN parent p ON c.parent_id = p.id WHERE p.id IS NULL", "SELECT COUNT(*) FROM child", "SELECT * FROM parent"], "ans": 1, "exp": "LEFT JOIN child with parent, WHERE parent IS NULL reveals child records whose parent_id doesn't exist in the parent table — broken foreign key references, a critical data integrity issue."}, {"q": "After a password reset API, what SQL verifies the reset token was saved?", "opts": ["SELECT password FROM users WHERE id = {id}", "SELECT reset_token, reset_token_expiry FROM users WHERE id = {id}", "SELECT * FROM users", "SELECT COUNT(*) FROM users WHERE reset_token IS NOT NULL"], "ans": 1, "exp": "Select specifically the reset_token and its expiry for the user. Verify the token is set (not NULL) and expiry is in the future. Don't select the password — security risk."}, {"q": "What SQL verifies that test cleanup deleted only the intended records?", "opts": ["SELECT COUNT(*) FROM users", "SELECT COUNT(*) FROM users WHERE email LIKE '%test%' (should be 0 after cleanup)", "DELETE FROM users", "SELECT * FROM users WHERE id > 0"], "ans": 1, "exp": "After cleanup, count the test records that were supposed to be deleted. If count = 0, cleanup succeeded. If > 0, some test data remains."}, {"q": "What query checks for status transitions that shouldn't be possible?", "opts": ["SELECT * FROM orders", "SELECT * FROM orders WHERE status = 'delivered' AND shipped_at IS NULL", "SELECT status FROM orders GROUP BY status", "SELECT * FROM orders WHERE status IS NULL"], "ans": 1, "exp": "A 'delivered' order with no shipped_at timestamp is an invalid state transition — can't be delivered without being shipped. This catches workflow/state machine bugs."}, {"q": "How do you verify an API correctly applied a 10% discount?", "opts": ["SELECT discount FROM orders WHERE id = {id}", "SELECT original_price, discounted_price, ABS(discounted_price - original_price * 0.9) < 0.01 as correct FROM orders WHERE id = {id}", "SELECT * FROM orders WHERE discount = 10", "SELECT COUNT(*) FROM orders WHERE discount_applied = 1"], "ans": 1, "exp": "Floating point comparison: check that discounted_price ≈ original_price * 0.9 within a small tolerance (< 0.01). Direct = comparison on floating point values can fail due to precision."}, {"q": "What SQL detects payments processed without a corresponding order?", "opts": ["SELECT * FROM payments", "SELECT p.* FROM payments p LEFT JOIN orders o ON p.order_id = o.id WHERE o.id IS NULL", "SELECT * FROM orders WHERE payment_id IS NULL", "SELECT * FROM payments JOIN orders ON payments.order_id = orders.id"], "ans": 1, "exp": "LEFT JOIN payments (left) with orders (right). WHERE orders.id IS NULL = payments with no matching order. A critical financial data integrity check."}, {"q": "What query verifies all required fields are populated after an API insert?", "opts": ["SELECT * FROM table WHERE id = {id}", "SELECT id FROM table WHERE id = {id} AND (name IS NULL OR email IS NULL OR phone IS NULL)", "SELECT COUNT(*) FROM table", "SELECT * FROM table WHERE id IS NOT NULL"], "ans": 1, "exp": "Check for NULL in fields that should have been populated. If the query returns any rows, the required fields are missing — API validation or business logic failure."}, {"q": "How do you verify that an ORDER BY API returns results in the correct database order?", "opts": ["Trust the API response order", "SELECT id, name, created_at FROM table ORDER BY created_at DESC LIMIT N and compare to API response", "SELECT * FROM table", "Count the rows returned"], "ans": 1, "exp": "Run the equivalent SQL query with the same sorting and compare to what the API returned. Verify column values match in the same order — confirms the API's sort logic is correct."}, {"q": "What query finds users who completed registration but never verified their email?", "opts": ["SELECT * FROM users WHERE verified = 0", "SELECT * FROM users WHERE registration_complete = 1 AND email_verified_at IS NULL", "SELECT * FROM users WHERE email IS NULL", "SELECT COUNT(*) FROM users"], "ans": 1, "exp": "registration_complete = 1 (they finished registration) AND email_verified_at IS NULL (never clicked the verification link). Useful for QA funnel analysis."}, {"q": "What SQL verifies a pagination API returns the correct page of results?", "opts": ["SELECT * FROM table", "SELECT * FROM table ORDER BY id LIMIT {page_size} OFFSET {(page-1)*page_size} and compare to API response", "SELECT COUNT(*) FROM table", "SELECT * FROM table WHERE page = {page}"], "ans": 1, "exp": "Replicate the pagination logic in SQL: LIMIT = page size, OFFSET = (page-1) * page_size. Compare the DB result to the API response to verify correct pagination."}, {"q": "How do you verify that a soft-delete API marks records as deleted without removing them?", "opts": ["SELECT * FROM users WHERE id = {id} (should return no rows)", "SELECT * FROM users WHERE id = {id} AND deleted_at IS NOT NULL", "SELECT * FROM users WHERE deleted_at IS NULL", "DELETE FROM users WHERE id = {id}"], "ans": 1, "exp": "Soft delete sets deleted_at timestamp. Verify the row still exists AND has a deleted_at value. If deleted_at IS NULL after the delete API call, the soft delete failed."}, {"q": "What query detects test pollution in a production-like environment?", "opts": ["SELECT * FROM users", "SELECT * FROM users WHERE email LIKE '%@test.%' OR name LIKE 'Test%' OR email LIKE 'test%@%'", "SELECT * FROM users WHERE role = 'tester'", "SELECT COUNT(*) FROM users WHERE id > 1000"], "ans": 1, "exp": "Multiple patterns to find test data: test email domains, names starting with 'Test', emails starting with 'test'. Real data pollution check before go-live or performance testing."}, {"q": "After an order status update API, what SQL verifies the audit trail was logged?", "opts": ["SELECT * FROM orders WHERE id = {id}", "SELECT * FROM order_audit_log WHERE order_id = {id} AND new_status = '{updated_status}' ORDER BY changed_at DESC LIMIT 1", "SELECT status FROM orders WHERE id = {id}", "SELECT * FROM audit_log"], "ans": 1, "exp": "Verify the audit log captured the specific status change for the specific order. Check new_status matches what was sent, changed_at is recent, and the record exists — confirms audit trail is working."}, {"q": "What query verifies that a multi-step registration saves intermediate state?", "opts": ["SELECT * FROM users WHERE id = {id}", "SELECT step1_complete, step2_complete, step3_complete FROM registrations WHERE user_id = {id}", "SELECT COUNT(*) FROM registrations", "SELECT * FROM registrations WHERE step = 3"], "ans": 1, "exp": "Select all step completion flags for the specific user and verify the correct steps are marked complete, matching the test scenario's progress point."}, {"q": "How do you verify that a price calculation API handles edge cases correctly in the DB?", "opts": ["Trust the API calculation", "SELECT price, discount_percent, final_price, ABS(final_price - price * (1 - discount_percent/100)) as diff FROM orders WHERE id = {id}", "SELECT * FROM orders", "SELECT COUNT(*) FROM orders"], "ans": 1, "exp": "Recalculate expected price in SQL and compare to stored final_price. diff should be < 0.01 for correct calculation. Verifies the calculation was stored correctly, not just returned."}, {"q": "What SQL verifies a batch job processed all pending items?", "opts": ["SELECT * FROM jobs", "SELECT COUNT(*) FROM jobs WHERE status = 'pending' (should be 0 after batch run)", "SELECT * FROM jobs WHERE status = 'complete'", "SELECT MAX(processed_at) FROM jobs"], "ans": 1, "exp": "After the batch job, COUNT pending items should be 0. If > 0, some items weren't processed. Combine with checking completion count matches original pending count."}, {"q": "How would you verify that a CASCADE DELETE worked correctly?", "opts": ["Select from parent only", "SELECT COUNT(*) FROM child_table WHERE parent_id = {deleted_id} (should be 0)", "SELECT * FROM parent WHERE id IS NULL", "Delete again to check"], "ans": 1, "exp": "After deleting a parent record, verify all child records were also deleted. Count children with the deleted parent's ID — should be 0 if cascade worked."}, {"q": "What query verifies that a scheduled task ran at the expected time?", "opts": ["SELECT * FROM tasks", "SELECT * FROM task_logs WHERE task_name = '{name}' AND ran_at >= NOW() - INTERVAL 1 HOUR ORDER BY ran_at DESC LIMIT 1", "SELECT COUNT(*) FROM tasks", "SELECT * FROM tasks WHERE status = 'running'"], "ans": 1, "exp": "Find the most recent log entry for the task within the expected time window. Verify ran_at is within the acceptable schedule window, task completed, and no errors."}, {"q": "What SQL detects API responses that return more data than the user should see?", "opts": ["SELECT * FROM responses", "SELECT COUNT(DISTINCT user_id) FROM visible_records WHERE accessing_user_id != record_owner_id", "SELECT * FROM users", "SELECT response_data FROM api_logs"], "ans": 1, "exp": "A data isolation check: find records visible to a user who doesn't own them. This verifies row-level security or authorization logic is correctly filtering data."}, {"q": "How do you verify a file upload API saved metadata correctly?", "opts": ["Check the file system", "SELECT filename, file_size, mime_type, uploaded_by, created_at FROM uploads WHERE id = {upload_id}", "SELECT * FROM uploads", "SELECT COUNT(*) FROM uploads"], "ans": 1, "exp": "Select specific metadata fields and verify: filename matches what was uploaded, file_size is correct, mime_type is appropriate, uploaded_by is the correct user, created_at is recent."}, {"q": "What query finds records stuck in 'processing' state for too long?", "opts": ["SELECT * FROM records WHERE status = 'processing'", "SELECT * FROM records WHERE status = 'processing' AND updated_at < NOW() - INTERVAL 30 MINUTE", "SELECT * FROM records WHERE processing = 1", "SELECT COUNT(*) FROM records"], "ans": 1, "exp": "'Processing' for more than 30 minutes indicates a stuck job or error. updated_at older than 30 minutes with still-processing status = candidate for investigation or retry."}, {"q": "After a user role change API, what SQL verifies permissions were updated?", "opts": ["SELECT * FROM users WHERE id = {id}", "SELECT role, permissions FROM users WHERE id = {id}", "SELECT COUNT(*) FROM users WHERE role = 'admin'", "SELECT * FROM roles WHERE user_id = {id}"], "ans": 1, "exp": "Verify both the role and the actual permissions fields changed. API might update role but forget permissions, or vice versa. Both must match the expected state."}, {"q": "What SQL verifies that all products in a completed order were in stock?", "opts": ["SELECT * FROM products WHERE id IN (SELECT product_id FROM order_items WHERE order_id = {id})", "SELECT oi.product_id, oi.quantity, p.stock_at_order_time FROM order_items oi JOIN products p ON oi.product_id = p.id WHERE oi.order_id = {id}", "SELECT * FROM orders WHERE id = {id}", "SELECT COUNT(*) FROM order_items WHERE order_id = {id}"], "ans": 1, "exp": "Join order_items with product inventory snapshot (stock_at_order_time if available). Verify quantity ordered <= stock available. Detects overselling bugs in the order API."}, {"q": "How do you verify notification delivery after a trigger event?", "opts": ["SELECT * FROM notifications", "SELECT * FROM notifications WHERE user_id = {id} AND type = 'order_confirmation' AND order_id = {order_id} AND created_at >= NOW() - INTERVAL 5 MINUTE", "SELECT COUNT(*) FROM notifications WHERE user_id = {id}", "SELECT * FROM emails WHERE sent = 1"], "ans": 1, "exp": "Verify a specific notification was created for the right user, right type, right reference, within the expected timeframe after the trigger event. All four conditions must match."}, {"q": "What query verifies that rate limiting is being enforced?", "opts": ["SELECT * FROM requests", "SELECT user_id, COUNT(*) as req_count FROM api_logs WHERE created_at >= NOW() - INTERVAL 1 MINUTE GROUP BY user_id HAVING COUNT(*) > {rate_limit}", "SELECT * FROM api_logs WHERE blocked = 1", "SELECT user_id FROM api_logs WHERE status = 429"], "ans": 1, "exp": "Count API requests per user in the last minute. Users exceeding the rate limit should be blocked. This SQL verifies rate limit enforcement by checking actual request counts against the threshold."}, {"q": "What SQL verifies that a price change API didn't affect historical orders?", "opts": ["SELECT * FROM orders", "SELECT o.id, oi.price, p.current_price FROM orders o JOIN order_items oi ON o.id = oi.order_id JOIN products p ON oi.product_id = p.id WHERE o.created_at < NOW() - INTERVAL 1 DAY AND oi.price = p.current_price", "SELECT * FROM products WHERE price_updated_at > NOW() - INTERVAL 1 DAY", "SELECT * FROM order_items"], "ans": 1, "exp": "Historical orders should preserve the price at time of purchase. If order_item.price matches current_price after a price update, historical data was overwritten — a critical bug."}, {"q": "What is the best SQL pattern for a 'smoke test' database check?", "opts": ["SELECT * FROM all_tables", "SELECT 1 (verify DB connection), SELECT COUNT(*) FROM critical_tables (verify data exists), SELECT key_record WHERE id = 1 (verify key data integrity)", "DELETE FROM test_data", "SELECT * FROM users LIMIT 1"], "ans": 1, "exp": "DB smoke test: (1) connection test, (2) critical table row count > 0, (3) key record exists and has expected values. These three checks verify the database is up, populated, and consistent."}, {"q": "How do you verify that an API correctly handles concurrent updates without data loss?", "opts": ["Run one API call", "SELECT updated_at, updated_by FROM records WHERE id = {id} to verify last update is correct after concurrent tests", "SELECT * FROM records", "SELECT COUNT(*) FROM records"], "ans": 1, "exp": "After concurrent updates, verify: updated_at matches the last known update time, updated_by matches the last updater, and the final value is one of the valid concurrent write outcomes — not NULL or corrupted."}, {"q": "What SQL detects records where a calculated total doesn't match its components?", "opts": ["SELECT * FROM orders WHERE total > 0", "SELECT o.id, o.total, SUM(oi.price * oi.quantity) as calculated, ABS(o.total - SUM(oi.price * oi.quantity)) as diff FROM orders o JOIN order_items oi ON o.id = oi.order_id GROUP BY o.id, o.total HAVING diff > 0.01", "SELECT * FROM order_items", "SELECT SUM(total) FROM orders"], "ans": 1, "exp": "Recalculate total from line items and compare to stored total. diff > 0.01 (tolerance for floating point) reveals mismatches — orders where total was calculated incorrectly or updated independently."}, {"q": "What query verifies that a session expiry API correctly invalidates tokens?", "opts": ["SELECT * FROM sessions", "SELECT * FROM sessions WHERE user_id = {id} AND token = '{token}' AND expired_at > NOW() (should return 0 rows after expiry)", "SELECT * FROM users WHERE session_active = 0", "SELECT COUNT(*) FROM sessions"], "ans": 1, "exp": "After session expiry, the token should either be deleted or have expired_at in the past. Query for active unexpired token — if found, expiry API failed."}, {"q": "What SQL pattern verifies a migration successfully transformed legacy data?", "opts": ["SELECT * FROM new_table", "SELECT COUNT(*) as new_count FROM new_table, SELECT COUNT(*) as old_count FROM old_table (counts should match); SELECT n.* FROM new_table n WHERE n.legacy_id NOT IN (SELECT id FROM old_table) (should be empty)", "SELECT * FROM old_table", "SELECT * FROM migration_log"], "ans": 1, "exp": "Post-migration QA: (1) counts match, (2) no orphaned records in new table, (3) sample spot-checks of data transformation. A comprehensive migration verification needs multiple SQL checks."}, {"q": "How do you verify that GDPR data deletion removed ALL user data across multiple tables?", "opts": ["SELECT * FROM users WHERE id = {id}", "SELECT COUNT(*) FROM users WHERE id={id} UNION SELECT COUNT(*) FROM orders WHERE user_id={id} UNION SELECT COUNT(*) FROM reviews WHERE user_id={id} (all should be 0)", "DELETE FROM users WHERE id = {id}", "SELECT id FROM deleted_users"], "ans": 1, "exp": "GDPR deletion must remove data from all tables. UNION of counts across all affected tables — all should return 0. Verifies completeness of the deletion across the entire data model."}, {"q": "What SQL finds records that failed validation in a QA environment?", "opts": ["SELECT * FROM records", "SELECT * FROM records WHERE validation_status = 'failed' OR (required_field IS NULL) OR (email NOT LIKE '%@%.%')", "SELECT COUNT(*) FROM records WHERE valid = 1", "SELECT * FROM records WHERE id > 0"], "ans": 1, "exp": "Combine explicit validation status check with data quality rules. Multiple conditions catch different failure types: explicit failure flag, missing required data, and format violations."}, {"q": "What SQL confirms a user's profile update was saved correctly?", "opts": ["SELECT * FROM users", "SELECT name, email, phone, updated_at FROM users WHERE id = {id} — compare each field to what was sent in PUT request", "UPDATE users SET name = ... WHERE id = {id}", "SELECT COUNT(*) FROM users"], "ans": 1, "exp": "After a PUT/PATCH, select the exact fields that were updated and verify each one matches the request payload. Check updated_at is recent to confirm the update timing."}, {"q": "How do you verify a registration email was sent in the DB (email log table)?", "opts": ["SELECT * FROM emails", "SELECT * FROM email_logs WHERE recipient = '{email}' AND type = 'registration' AND created_at >= NOW() - INTERVAL 5 MINUTE", "SELECT COUNT(*) FROM email_logs", "SELECT * FROM email_logs WHERE type = 'registration'"], "ans": 1, "exp": "Filter by specific recipient, email type, and recent time window. All three conditions confirm the specific registration email was logged for this user in the expected timeframe."}, {"q": "What SQL verifies correct order status transitions from 'pending' to 'processing'?", "opts": ["SELECT * FROM orders WHERE status = 'processing'", "SELECT id, status, previous_status, updated_at FROM orders WHERE id = {id} AND status = 'processing' AND previous_status = 'pending'", "SELECT COUNT(*) FROM orders", "SELECT * FROM order_history WHERE order_id = {id}"], "ans": 1, "exp": "Verify both the current status AND the previous status to confirm the transition happened correctly. If the order table doesn't store previous_status, check the audit/history table."}, {"q": "How do you validate that currency conversion was applied correctly?", "opts": ["SELECT amount FROM payments", "SELECT original_amount, currency, converted_amount, exchange_rate, ABS(converted_amount - original_amount * exchange_rate) as diff FROM payments WHERE id = {id}", "SELECT currency FROM payments WHERE id = {id}", "SELECT * FROM exchange_rates"], "ans": 1, "exp": "Recalculate expected converted_amount from original × rate. Check diff is within tolerance (< 0.01). Any larger diff indicates a conversion bug."}, {"q": "What SQL detects users with duplicate session tokens?", "opts": ["SELECT * FROM sessions", "SELECT user_id, token, COUNT(*) FROM sessions WHERE expires_at > NOW() GROUP BY user_id, token HAVING COUNT(*) > 1", "SELECT DISTINCT token FROM sessions", "SELECT user_id FROM sessions GROUP BY user_id HAVING COUNT(*) > 1"], "ans": 1, "exp": "Active sessions with duplicate tokens for the same user indicate a bug in token generation. GROUP BY user_id + token, HAVING count > 1 reveals the duplicates."}, {"q": "What verifies a webhook was delivered after a payment event?", "opts": ["SELECT * FROM webhooks", "SELECT * FROM webhook_logs WHERE event_type = 'payment.completed' AND reference_id = {payment_id} AND delivered_at IS NOT NULL AND status = 'success'", "SELECT COUNT(*) FROM webhooks", "SELECT * FROM payments WHERE id = {payment_id}"], "ans": 1, "exp": "Four conditions: right event type, right reference, actually delivered (not NULL), and success status. All four must pass to confirm webhook delivery for the specific payment event."}, {"q": "What SQL confirms a user cannot access another user's data (authorization check)?", "opts": ["SELECT * FROM resources", "SELECT r.* FROM resources r WHERE r.owner_id != {requesting_user_id} AND r.id IN (SELECT resource_id FROM access_logs WHERE user_id = {requesting_user_id})", "SELECT * FROM access_logs WHERE user_id = {requesting_user_id}", "SELECT * FROM users WHERE id = {requesting_user_id}"], "ans": 1, "exp": "Find resources the user accessed that belong to other users. Any results indicate an authorization bypass — user can access resources they don't own. Critical security QA check."}, {"q": "How do you verify pagination metadata (total_count) matches actual data?", "opts": ["Trust the API", "SELECT COUNT(*) FROM table WHERE {filters} — compare to total_count in API response header", "SELECT * FROM table", "SELECT MAX(id) FROM table"], "ans": 1, "exp": "Apply the same filters as the API query to get the true count. If the DB count differs from the API's reported total_count, the pagination metadata calculation has a bug."}, {"q": "What SQL validates a 'sold out' product cannot be ordered?", "opts": ["SELECT * FROM products WHERE id = {id}", "SELECT stock_quantity FROM products WHERE id = {id} (should be 0) AND check no new orders with status != 'cancelled' were created for this product after stock reached 0", "SELECT COUNT(*) FROM orders WHERE product_id = {id}", "SELECT * FROM inventory WHERE product_id = {id}"], "ans": 1, "exp": "Two checks: (1) verify stock_quantity IS 0, (2) verify no successful orders exist after the stock-out time. Both confirm the sold-out enforcement is working correctly."}, {"q": "What verifies a coupon code was applied only once per user?", "opts": ["SELECT * FROM coupons", "SELECT user_id, coupon_code, COUNT(*) as uses FROM orders WHERE coupon_code = '{code}' GROUP BY user_id, coupon_code HAVING uses > 1", "SELECT * FROM orders WHERE coupon_code = '{code}'", "SELECT COUNT(*) FROM orders WHERE coupon_code = '{code}'"], "ans": 1, "exp": "GROUP BY user + coupon, HAVING uses > 1 reveals users who applied the same coupon multiple times — a single-use coupon enforcement failure."}, {"q": "What SQL confirms an email is unique before triggering a duplicate account alert?", "opts": ["SELECT * FROM users WHERE email = '{email}'", "SELECT COUNT(*) FROM users WHERE email = '{email}' (> 1 = duplicate)", "SELECT DISTINCT email FROM users", "SELECT * FROM users"], "ans": 1, "exp": "COUNT > 1 means the email already exists when a new registration tries to use it. If COUNT = 1, the email already exists (first user). Business logic determines if 1 is also a problem for the new registration."}, {"q": "What query verifies inventory was decremented after a purchase?", "opts": ["SELECT * FROM inventory", "SELECT stock_before, stock_after, (stock_before - quantity_purchased) as expected, stock_after = (stock_before - quantity_purchased) as correct FROM inventory_events WHERE order_id = {id}", "SELECT COUNT(*) FROM inventory", "SELECT * FROM orders WHERE id = {id}"], "ans": 1, "exp": "Verify stock_after = stock_before - quantity_purchased. The boolean 'correct' column immediately shows if the decrement is mathematically right. Inventory audit events should capture before/after values."}, {"q": "What SQL checks that a feature flag correctly enabled/disabled a feature?", "opts": ["SELECT * FROM feature_flags", "SELECT flag_name, is_enabled, scope, updated_at FROM feature_flags WHERE flag_name = '{feature}' AND (scope = 'user:{user_id}' OR scope = 'global')", "SELECT * FROM users WHERE feature_enabled = 1", "SELECT COUNT(*) FROM feature_flags"], "ans": 1, "exp": "Check the specific feature flag for the specific user scope (user-level override) or global scope. Verify is_enabled = expected value and updated_at confirms the change was recent."}, {"q": "What verifies that soft-delete doesn't appear in list APIs?", "opts": ["SELECT * FROM records", "SELECT COUNT(*) FROM records WHERE deleted_at IS NULL vs API list response count — they should match", "SELECT * FROM records WHERE deleted_at IS NOT NULL", "SELECT * FROM records ORDER BY deleted_at"], "ans": 1, "exp": "Count non-deleted records in DB and compare to the count of items in the API list response. If DB count > API count, soft-deleted items are leaking into the response. If DB count < API count, non-deleted items are missing."}, {"q": "What SQL detects concurrent modification conflicts in a test scenario?", "opts": ["SELECT * FROM records WHERE id = {id}", "SELECT id, version, updated_at, updated_by FROM records WHERE id = {id} — compare version before and after concurrent updates", "SELECT COUNT(*) FROM records", "SELECT * FROM locks WHERE record_id = {id}"], "ans": 1, "exp": "Optimistic locking uses a version counter. After concurrent updates, the version should reflect the number of updates. updated_by should be the last updater. Verify no version numbers were skipped or duplicated."}, {"q": "What query verifies search indexing updated after a product update API?", "opts": ["SELECT * FROM products WHERE id = {id}", "SELECT p.name, p.description, si.indexed_at, si.name as indexed_name FROM products p JOIN search_index si ON p.id = si.product_id WHERE p.id = {id} — verify indexed_at > updated_at and fields match", "SELECT * FROM search_index", "SELECT name FROM products WHERE id = {id}"], "ans": 1, "exp": "Compare product data to search index data. indexed_at should be after the product's updated_at (index is current). Fields in search index should match product fields — confirms indexing job ran correctly."}, {"q": "How do you detect a race condition in a counter increment scenario?", "opts": ["SELECT count FROM counters WHERE id = {id}", "SELECT count FROM counters WHERE id = {id} before N concurrent increments, and after: count should equal initial + N exactly. Any other value = race condition.", "DELETE FROM counters", "SELECT * FROM counters"], "ans": 1, "exp": "Read the counter before concurrent increments, increment N times concurrently, read again. If final count != initial + N, some increments were lost due to race conditions (non-atomic updates)."}, {"q": "What SQL validates that an API correctly handles pagination for a dataset where records are deleted between pages?", "opts": ["SELECT * FROM table LIMIT 10", "Compare each page's LIMIT/OFFSET result before and after delete — count total unique IDs returned across all pages should equal initial COUNT - deleted count", "SELECT COUNT(*) FROM table", "SELECT * FROM table ORDER BY id"], "ans": 1, "exp": "Deletions between pagination calls cause items to shift positions. Page 2 might skip an item that moved to page 1 position due to deletion. Key-based pagination (WHERE id > last_seen_id) avoids this issue."}, {"q": "What query checks for duplicate notification sends?", "opts": ["SELECT * FROM notifications", "SELECT user_id, notification_type, reference_id, COUNT(*) as send_count FROM notifications WHERE created_at >= NOW() - INTERVAL 1 HOUR GROUP BY user_id, notification_type, reference_id HAVING send_count > 1", "SELECT * FROM users WHERE notified = 1", "SELECT COUNT(*) FROM notifications"], "ans": 1, "exp": "Same notification type for same user + reference sent more than once in the window = duplicate notification bug. The HAVING condition isolates the duplicates."}, {"q": "What SQL verifies that audit logs are immutable (no updates after creation)?", "opts": ["SELECT * FROM audit_logs", "SELECT COUNT(*) FROM audit_logs WHERE updated_at != created_at (should = 0 — audit logs should never be updated)", "SELECT * FROM audit_logs ORDER BY updated_at", "SELECT id FROM audit_logs WHERE updated_at IS NULL"], "ans": 1, "exp": "Audit logs must be immutable. If updated_at differs from created_at, the log was modified after creation — violating audit integrity. Count should be 0 for a healthy audit system."}, {"q": "What is the SQL pattern for verifying idempotent API behavior?", "opts": ["Call API once and check", "Call API multiple times with same input, verify SELECT results show exactly 1 record created and the same state regardless of call count", "SELECT COUNT(*) > 1 FROM records", "DELETE duplicates after testing"], "ans": 1, "exp": "Idempotent API: calling with same input N times produces same result as calling once. SQL verification: after N calls, count records = 1 (no duplicates), final state = expected state regardless of call count."}]}, {"id": 9, "title": "Advanced SQL", "level": "Junior+", "icon": "⚡", "desc": "CASE, UNION, Window Functions, CTEs, String/Numeric functions", "questions": [{"q": "What does CASE WHEN status='active' THEN 1 ELSE 0 END produce?", "opts": ["An error", "A binary 0/1 flag based on status", "Updates the status column", "Filters rows by status"], "ans": 1, "exp": "CASE WHEN creates a conditional expression. For 'active' rows it returns 1, all others return 0. Wrapping in SUM() gives a count of active records."}, {"q": "What is the difference between UNION and UNION ALL?", "opts": ["No difference", "UNION removes duplicates; UNION ALL keeps all rows including duplicates", "UNION ALL is faster but otherwise identical", "UNION combines columns; UNION ALL combines rows"], "ans": 1, "exp": "UNION deduplicates (slower due to sort/compare). UNION ALL keeps all rows including duplicates (faster). Use UNION ALL when you know results won't overlap or want all rows."}, {"q": "What does ROW_NUMBER() OVER (PARTITION BY dept ORDER BY salary DESC) do?", "opts": ["Sorts by salary", "Assigns sequential numbers within each department, ranking by salary descending", "Groups departments", "Filters top salaries"], "ans": 1, "exp": "ROW_NUMBER() is a window function. PARTITION BY dept resets the counter per department. ORDER BY salary DESC numbers rows 1, 2, 3... from highest to lowest salary within each department."}, {"q": "What is the OVER clause used for?", "opts": ["Creating views", "Defining the window (partition and ordering) for window functions", "Joining tables", "Filtering results"], "ans": 1, "exp": "OVER() defines the 'window' of rows a window function operates on. PARTITION BY defines groups. ORDER BY defines the order within each partition."}, {"q": "What is the difference between ROW_NUMBER, RANK, and DENSE_RANK?", "opts": ["No difference", "ROW_NUMBER: always unique; RANK: gaps for ties; DENSE_RANK: no gaps for ties", "RANK is always unique; ROW_NUMBER has gaps", "DENSE_RANK is deprecated"], "ans": 1, "exp": "Tie handling: ROW_NUMBER assigns unique numbers (1,2,3 even for equal values). RANK skips numbers for ties (1,1,3). DENSE_RANK no gaps (1,1,2). Example: two employees with same salary get 1,1,3 (RANK) vs 1,1,2 (DENSE_RANK)."}, {"q": "What does LAG(col, 1) OVER (ORDER BY date) return?", "opts": ["Next row's value", "Previous row's value", "The lag between two dates", "Current value"], "ans": 1, "exp": "LAG(col, offset) returns a value from a previous row. LAG(col, 1) returns the value from the immediately preceding row. LEAD(col, 1) returns the next row's value."}, {"q": "What does SUM(amount) OVER (PARTITION BY user_id ORDER BY date) calculate?", "opts": ["Total sum for all users", "Running total of amount per user, accumulated by date", "Average per user", "Sum per date"], "ans": 1, "exp": "A window function with ORDER BY creates a running (cumulative) total. PARTITION BY user_id resets the running total per user. Each row shows the accumulated sum from the first row to the current row for that user."}, {"q": "What does NTILE(4) OVER (ORDER BY score) assign?", "opts": ["Percentiles 0-100", "Quartile number (1-4) based on score distribution", "Top 4 scores", "Error"], "ans": 1, "exp": "NTILE(n) divides rows into n roughly equal groups. NTILE(4) assigns quartile numbers (1=bottom 25%, 2=26-50%, 3=51-75%, 4=top 25%). Used for distribution analysis."}, {"q": "What does PERCENT_RANK() return?", "opts": ["Percentage of rows above", "Relative rank as a percentage: (rank-1)/(total rows-1)", "Percentile of salary", "Error"], "ans": 1, "exp": "PERCENT_RANK() = (RANK()-1) / (COUNT(*)-1). Returns 0 for the first row, 1 for the last. Represents what percentage of rows are ranked below the current row."}, {"q": "What is the purpose of FIRST_VALUE() and LAST_VALUE() window functions?", "opts": ["Find first and last row of table", "Return the first/last value in the window frame", "Calculate min and max", "Same as MIN and MAX"], "ans": 1, "exp": "FIRST_VALUE(col) OVER (...) returns the value from the first row in the window frame. LAST_VALUE is tricky — needs ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING to get the actual last value."}, {"q": "What does CASE WHEN score >= 90 THEN 'A' WHEN score >= 80 THEN 'B' ELSE 'C' END produce?", "opts": ["Error — too many WHEN clauses", "Grade letter based on score, evaluated top to bottom (first match wins)", "Always returns 'C'", "Updates score column"], "ans": 1, "exp": "CASE evaluates WHEN conditions top to bottom and returns the result of the FIRST matching condition. A score of 95 matches >= 90 and returns 'A' — subsequent WHEN clauses are not checked."}, {"q": "Can CASE be used inside aggregate functions?", "opts": ["No — CASE can only be in SELECT", "Yes — SUM(CASE WHEN status='pass' THEN 1 ELSE 0 END) counts conditionally", "Only with GROUP BY", "Only with HAVING"], "ans": 1, "exp": "CASE inside aggregates is a powerful pattern. SUM(CASE WHEN status='pass' THEN 1 ELSE 0 END) counts rows meeting a condition — equivalent to COUNT(CASE WHEN status='pass' THEN 1 END)."}, {"q": "What does UNION require about the SELECT lists?", "opts": ["Same table names", "Same number of columns and compatible data types", "Same column names", "Same WHERE clauses"], "ans": 1, "exp": "UNION requires: same number of columns in each SELECT, and compatible (implicitly convertible) data types in corresponding columns. Column names from the first SELECT are used for the result."}, {"q": "What does LEAD(salary, 1, 0) OVER (ORDER BY id) return for the last row?", "opts": ["NULL", "0 (the default value for when there's no next row)", "Error", "The last salary"], "ans": 1, "exp": "LEAD(col, offset, default) returns the default value when no next row exists. For the last row, LEAD(salary, 1, 0) returns 0 instead of NULL because 0 is specified as the default."}, {"q": "What is a window frame in window functions?", "opts": ["A time window", "The subset of rows in the partition that the function considers for each row", "The columns selected", "The WHERE clause"], "ans": 1, "exp": "A window frame (ROWS BETWEEN or RANGE BETWEEN) defines which rows relative to the current row are included in the calculation. Default varies by function — some use all partition rows, others use rows up to current."}, {"q": "What does ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW define?", "opts": ["All rows after current", "All rows from the partition start up to the current row", "Only the current row", "The entire partition"], "ans": 1, "exp": "This window frame includes all rows from the beginning of the partition to the current row — the definition of a running total/cumulative sum frame."}, {"q": "What is the difference between ROWS and RANGE in window frames?", "opts": ["No difference", "ROWS: physical row positions; RANGE: value-based (includes ties with same value)", "RANGE is deprecated", "ROWS requires ORDER BY"], "ans": 1, "exp": "ROWS BETWEEN counts exact row positions (physical). RANGE BETWEEN includes all rows with the same ORDER BY value as the current row (logical). For running totals with ties, RANGE includes all tied rows at each boundary."}, {"q": "What does PIVOT do in SQL?", "opts": ["Rotates the database", "Transforms rows into columns (converts row values to column headers)", "Creates indexes", "Joins tables"], "ans": 1, "exp": "PIVOT transforms row values into column headers — converting from long format to wide format. MySQL doesn't have a PIVOT keyword natively; use CASE with GROUP BY or conditional aggregation instead."}, {"q": "What does this query do: SELECT * FROM (SELECT *, ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY created_at DESC) as rn FROM orders) t WHERE rn = 1?", "opts": ["All orders", "Most recent order per user", "Oldest order per user", "Orders with row number 1"], "ans": 1, "exp": "ROW_NUMBER() within each user partition, newest first. WHERE rn=1 keeps only the first (most recent) row per user — classic deduplication/latest-record pattern."}, {"q": "What does CONCAT_WS(',', col1, col2, col3) do differently from CONCAT(col1,',',col2,',',col3)?", "opts": ["Same result", "CONCAT_WS ignores NULLs automatically; CONCAT returns NULL if any argument is NULL", "CONCAT_WS is faster", "CONCAT_WS adds extra comma"], "ans": 1, "exp": "CONCAT_WS (Concatenate With Separator) skips NULL values and joins non-NULL values with the separator. CONCAT with NULL in arguments returns NULL. CONCAT_WS is null-safe."}, {"q": "What does SUBSTRING_INDEX('www.example.com', '.', 2) return?", "opts": ["'www'", "'www.example'", "'example.com'", "'com'"], "ans": 1, "exp": "SUBSTRING_INDEX(str, delim, count): returns everything before the Nth delimiter. Count=2: returns 'www.example' (the part before the 2nd dot). Negative count works from the right."}, {"q": "What does the OVER() clause without PARTITION BY apply to?", "opts": ["No rows", "All rows in the result set as one partition", "Current row only", "Random subset"], "ans": 1, "exp": "OVER() with no PARTITION BY treats all result rows as one single partition. ROW_NUMBER() OVER (ORDER BY id) assigns row numbers across the entire result set."}, {"q": "What is a common QA use of window functions?", "opts": ["Creating tables", "Detecting duplicate rows, finding latest record per group, computing running totals without GROUP BY", "Updating records", "Joining tables"], "ans": 1, "exp": "QA window function uses: ROW_NUMBER for deduplication, RANK for top-N per group, LAG/LEAD for comparing consecutive records, running SUM for cumulative totals — all without losing individual row detail."}, {"q": "What does REPLACE('hello world', 'world', 'SQL') return?", "opts": ["'hello world'", "'hello SQL'", "'SQL hello'", "Error"], "ans": 1, "exp": "REPLACE(str, search, replacement) replaces all occurrences of the search string. 'hello world' with 'world' → 'SQL' = 'hello SQL'."}, {"q": "What does LOCATE('l', 'hello') return?", "opts": ["0", "3", "4", "1"], "ans": 1, "exp": "LOCATE(substr, str) returns the position of the first occurrence (1-indexed). 'l' first appears at position 3 in 'hello' (h=1, e=2, l=3)."}, {"q": "What does LPAD('5', 3, '0') return?", "opts": ["'5'", "'005'", "'500'", "'050'"], "ans": 1, "exp": "LPAD(str, length, pad_string) pads the string on the LEFT to reach the specified length. '5' padded to length 3 with '0' = '005'. Useful for formatting IDs or codes."}, {"q": "What is the purpose of REGEXP_REPLACE in SQL?", "opts": ["Validates regex patterns", "Replaces substrings matching a regular expression pattern", "Searches for regex matches", "Creates regex indexes"], "ans": 1, "exp": "REGEXP_REPLACE(str, pattern, replacement) replaces all regex-matching substrings. Available in MySQL 8.0+. Useful for data cleaning and transformation in ETL/QA scripts."}, {"q": "What does CAST('2024-01-15' AS DATE) do?", "opts": ["Returns error", "Converts string to DATE type", "Returns VARCHAR", "Returns integer"], "ans": 1, "exp": "CAST converts a value to the specified type. CAST('2024-01-15' AS DATE) converts the string literal to a proper DATE value. Useful for type consistency in queries."}, {"q": "What does GREATEST(5, 3, 8, 1) return?", "opts": ["1", "5", "8", "3"], "ans": 2, "exp": "GREATEST() returns the largest value from its arguments. GREATEST(5, 3, 8, 1) = 8. LEAST() returns the smallest."}, {"q": "What does TRUNCATE(3.567, 1) return?", "opts": ["3.6", "3.5", "4", "3.57"], "ans": 1, "exp": "TRUNCATE(number, decimal_places) removes digits beyond the specified decimal place WITHOUT rounding. TRUNCATE(3.567, 1) = 3.5 (not 3.6 like ROUND)."}, {"q": "What is SIGN(value) used for?", "opts": ["Returns the absolute value", "Returns -1, 0, or 1 indicating negative, zero, or positive", "Returns the sign character", "Returns the first digit"], "ans": 1, "exp": "SIGN() returns: -1 for negative values, 0 for zero, 1 for positive. Useful in CASE alternatives: SIGN(price - cost) tells you if a product is profitable (1), break-even (0), or at a loss (-1)."}, {"q": "What does FORMAT(1234567.89, 2) return?", "opts": ["1234567.89", "'1,234,567.89'", "Error", "1234568"], "ans": 1, "exp": "FORMAT(number, decimal_places) returns a formatted string with thousands separators: '1,234,567.89'. Returns a VARCHAR string, not a number. Useful for reports."}, {"q": "What is FIELD(value, val1, val2, val3) used for in ORDER BY?", "opts": ["Finds a field in a table", "Returns index position of value in the list — used for custom sort orders", "Returns the value itself", "Counts occurrences"], "ans": 1, "exp": "FIELD('B', 'A', 'B', 'C') returns 2. ORDER BY FIELD(status, 'urgent', 'pending', 'done') sorts rows in a custom defined order — very useful for QA priority-based ordering."}, {"q": "What does WITH RECURSIVE allow you to do?", "opts": ["Speed up CTEs", "Build hierarchical or iterative result sets by referencing the CTE itself", "Create view-like structures", "Define multiple CTEs"], "ans": 1, "exp": "Recursive CTEs define a base case and a recursive step that references the CTE. Used for: organizational hierarchies, graph traversal, generating number series, processing tree structures."}, {"q": "What does IFNULL(LAG(col) OVER (ORDER BY id), col) achieve?", "opts": ["Error", "Returns current value for the first row (no previous row) instead of NULL", "Doubles the column value", "Filters NULLs"], "ans": 1, "exp": "LAG returns NULL for the first row (no previous exists). IFNULL handles this: for the first row use the current value; for all others use the previous row's value."}, {"q": "What is the QA value of running totals with SUM() OVER()?", "opts": ["None", "Verifying that cumulative amounts match expected totals without a separate aggregation query", "Replacing GROUP BY", "Faster than COUNT"], "ans": 1, "exp": "Running totals let you verify: cumulative order revenue by day, progressive test pass rates over time, incremental data growth — all while keeping individual row detail for investigation."}, {"q": "What does CHAR_LENGTH('hello') vs LENGTH('hello') return for multibyte characters?", "opts": ["Always the same", "CHAR_LENGTH counts characters; LENGTH counts bytes — differ for multibyte (UTF-8) characters", "LENGTH is always larger", "CHAR_LENGTH is deprecated"], "ans": 1, "exp": "For ASCII: same result. For UTF-8 multibyte characters (Chinese, emoji): CHAR_LENGTH('中文') = 2 (2 characters), LENGTH('中文') = 6 (3 bytes per character). Critical for string validation in internationalized apps."}, {"q": "What does PARTITION BY in window functions NOT do?", "opts": ["Creates groups for window calculation", "Allows aggregate functions per group without GROUP BY", "Actually removes rows from result", "Resets window numbering per group"], "ans": 2, "exp": "PARTITION BY does NOT filter rows — all rows are still returned. It only defines the groups for window function calculation. Use WHERE/HAVING to filter rows."}, {"q": "What does DENSE_RANK() return for equal values?", "opts": ["Different numbers for each equal value", "Same rank with no gap after ties", "Same rank with gap after ties", "Error for ties"], "ans": 1, "exp": "DENSE_RANK: equal values get the same rank, next rank is consecutive (no gap). Values: 100, 100, 90, 90, 80 → ranks: 1, 1, 2, 2, 3. Compare: RANK gives 1, 1, 3, 3, 5 (with gaps)."}, {"q": "What advanced SQL technique detects outlier test execution times?", "opts": ["SELECT * FROM test_runs WHERE duration > 100", "SELECT *, AVG(duration) OVER() as avg_dur, STDDEV(duration) OVER() as std_dev, (duration - AVG(duration) OVER()) / NULLIF(STDDEV(duration) OVER(), 0) as z_score FROM test_runs HAVING ABS(z_score) > 3", "SELECT MAX(duration) FROM test_runs", "SELECT * FROM test_runs ORDER BY duration DESC LIMIT 10"], "ans": 1, "exp": "Z-score method: values more than 3 standard deviations from the mean are statistical outliers. Window functions calculate avg and stddev across all rows. NULLIF prevents division-by-zero if stddev=0."}, {"q": "What does CUME_DIST() OVER (ORDER BY score) return?", "opts": ["Percentile rank 0-1 (fraction of rows with score <= current row's score)", "Score as percentage", "Cumulative distance in meters", "Error"], "ans": 0, "exp": "CUME_DIST() returns the cumulative distribution: (number of rows with value <= current row) / (total rows). Returns 0.5 for the median value. Used for percentile analysis."}, {"q": "What is a QA use of CASE in aggregate (pivot) queries?", "opts": ["None", "Creating column-per-category counts from a single status column (e.g., passed, failed, skipped counts in one row)", "Deleting records", "Joining tables"], "ans": 1, "exp": "CASE pivot: SELECT SUM(CASE WHEN status='pass' THEN 1 ELSE 0 END) pass, SUM(CASE WHEN status='fail' THEN 1 ELSE 0 END) fail FROM tests GROUP BY suite — gives pass/fail counts per suite in one row."}, {"q": "What does DENSE_RANK() OVER (ORDER BY score) return for scores [90, 90, 80, 70, 70]?", "opts": ["1, 2, 3, 4, 5", "1, 1, 2, 3, 3", "1, 1, 3, 4, 4", "Error"], "ans": 1, "exp": "DENSE_RANK assigns same rank to ties, no gaps: 90,90→1,1; 80→2; 70,70→3,3. Compare RANK: 1,1,3,4,4 (gap after ties). ROW_NUMBER: 1,2,3,4,5 (always unique)."}, {"q": "What does SELECT CASE WHEN salary > 100000 THEN 'Senior' WHEN salary > 50000 THEN 'Mid' ELSE 'Junior' END as band FROM employees produce?", "opts": ["Error — too many WHEN clauses", "A salary band column for each employee based on salary tiers", "Updates employee records", "Returns 'Junior' for all"], "ans": 1, "exp": "CASE evaluates WHEN conditions top to bottom, returning the first match. Salary > 100k = Senior, else > 50k = Mid, else Junior. This produces a computed 'band' column without changing data."}, {"q": "What is the QA use of LEAD() window function?", "opts": ["None", "Comparing each test run's duration to the NEXT run to detect trends or sudden changes", "Sorting test results", "Grouping tests"], "ans": 1, "exp": "LEAD(duration, 1) OVER (PARTITION BY test_name ORDER BY run_date) gets the next run's duration. Compare current vs next to detect sudden duration spikes — automated regression detection."}, {"q": "What does SUM(amount) OVER (ORDER BY date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) calculate?", "opts": ["Total of all amounts", "Running/cumulative total up to and including the current row", "Average up to current row", "Max amount seen so far"], "ans": 1, "exp": "This is the standard running total definition: sum all rows from the start of the partition up to the current row. Each row shows the cumulative sum at that point in time."}, {"q": "What does UNION ALL vs UNION impact on query correctness?", "opts": ["No impact — identical", "UNION deduplicates (may remove valid duplicate rows); UNION ALL keeps all (correct when duplicates are meaningful)", "UNION ALL always correct; UNION never", "UNION is faster"], "ans": 1, "exp": "Choose based on data: use UNION ALL when duplicate rows are valid (e.g., combining two date ranges where a record exists in both). Use UNION only when you want deduplication. Incorrect choice changes the result."}, {"q": "What does ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY score DESC) allow you to do?", "opts": ["Count users", "Rank each user's scores and get the top N per user (WHERE rn <= 3)", "Sort by score", "Remove duplicates"], "ans": 1, "exp": "ROW_NUMBER assigns 1,2,3... per user by score descending. Wrapping in a subquery with WHERE rn <= 3 gives each user's top 3 scores. The most common window function use case."}, {"q": "What is the practical difference between RANK and ROW_NUMBER for QA leaderboards?", "opts": ["No difference", "RANK gives same rank to ties (fair for equal scores); ROW_NUMBER forces unique ranks even for identical scores", "ROW_NUMBER is always correct", "RANK is deprecated"], "ans": 1, "exp": "For equal scores: RANK is fair (both get rank 1). ROW_NUMBER arbitrarily breaks ties (one gets rank 1, other rank 2). Choose based on business logic: fair ranking = RANK, unique position = ROW_NUMBER."}, {"q": "What does the PARTITION BY clause in a window function do?", "opts": ["Filters rows", "Divides result set into partitions — window function resets for each partition", "Sorts results", "Groups for aggregation (same as GROUP BY)"], "ans": 1, "exp": "PARTITION BY creates logical groups for window functions — each partition is processed independently. Unlike GROUP BY, it doesn't collapse rows. All rows are returned, with the function applied within each partition."}, {"q": "What does CASE WHEN col IS NULL THEN 'Unknown' WHEN col = '' THEN 'Empty' ELSE col END handle?", "opts": ["Only NULL values", "NULL, empty string, and actual values — three distinct cases", "Only empty strings", "Only actual values"], "ans": 1, "exp": "Three-way CASE: NULL values → 'Unknown'; empty strings → 'Empty'; actual content → returned as-is. This distinguishes between the three different states a string column can be in."}, {"q": "What does NTILE(10) OVER (ORDER BY score) produce?", "opts": ["Rank from 1-10", "Decile group (1-10) for each row based on score distribution", "Percentile 0-100", "Error"], "ans": 1, "exp": "NTILE(10) divides rows into 10 equal groups (deciles). Row gets a number 1-10 indicating which decile it's in. Useful for statistical distribution analysis in QA test results."}, {"q": "What is the purpose of QUALIFY in some SQL dialects (BigQuery, Snowflake)?", "opts": ["Same as HAVING", "Filters results of window functions without needing a subquery (WHERE rn = 1 becomes QUALIFY ROW_NUMBER() OVER... = 1)", "Sorts window function results", "Partitions data"], "ans": 1, "exp": "QUALIFY (not in MySQL) is a clause specifically for filtering window function results, eliminating the need for a subquery. It's HAVING for window functions. MySQL requires a subquery with WHERE to filter window results."}, {"q": "What does FIRST_VALUE(salary) OVER (PARTITION BY dept ORDER BY hire_date) return?", "opts": ["Highest salary in dept", "Salary of the first hired employee in each department", "Current row's salary", "NULL"], "ans": 1, "exp": "FIRST_VALUE() returns the value from the first row in the partition's window frame. With ORDER BY hire_date, the first row is the earliest hired. Returns that person's salary for every row in the same department."}, {"q": "What SQL generates a date series for 30 days (QA scheduling)?", "opts": ["SELECT CURDATE() + 1,2,3...", "WITH RECURSIVE dates AS (SELECT CURDATE() AS d UNION ALL SELECT d + INTERVAL 1 DAY FROM dates WHERE d < CURDATE() + INTERVAL 29 DAY) SELECT * FROM dates", "SELECT * FROM calendar", "GENERATE_SERIES does not exist in MySQL"], "ans": 1, "exp": "Recursive CTE generates a date series: base case (today) + recursive case (add 1 day) until 30 days. Essential for generating test data or filling date gaps in reports."}, {"q": "What does SUBSTRING(email, 1, LOCATE('@', email) - 1) extract?", "opts": ["Domain part", "Username part (everything before @)", "Entire email", "Error if no @"], "ans": 1, "exp": "LOCATE('@', email) finds the position of @. SUBSTRING starting at 1, with length = position - 1, extracts everything before the @. This is the username/local-part of the email."}, {"q": "What is the QA use of LAG() window function?", "opts": ["None", "Comparing current row values to previous row values — detecting regressions, trends, or state changes", "Sorting", "Grouping"], "ans": 1, "exp": "LAG(status, 1) OVER (ORDER BY date) gives the previous status. Used to detect state changes, LAG(response_time) to compare to previous run's time, LAG(error_count) to detect increases — powerful for trend/regression detection."}, {"q": "What does WITH RECURSIVE org AS (SELECT id, name, manager_id, 0 as level FROM employees WHERE manager_id IS NULL UNION ALL SELECT e.id, e.name, e.manager_id, o.level+1 FROM employees e JOIN org o ON e.manager_id = o.id) SELECT * FROM org return?", "opts": ["Error", "Full organizational hierarchy with depth levels — CEO at level 0, direct reports at 1, etc.", "Only top-level employees", "Only leaf employees"], "ans": 1, "exp": "Classic recursive CTE for org hierarchy: base case = root (no manager). Recursive case = employees who report to the current level. level+1 tracks depth. Returns the full tree structure."}, {"q": "What is the practical use of PIVOT (or CASE+GROUP BY equivalent) in QA?", "opts": ["None", "Converting long-format test results (one row per test run) to wide format (columns per test suite) for cross-suite comparison reports", "Deleting old results", "Normalizing data"], "ans": 1, "exp": "PIVOT (simulated in MySQL with CASE): SELECT suite, SUM(CASE WHEN name='login_test' THEN pass ELSE 0 END) login, SUM(CASE WHEN name='checkout' THEN pass ELSE 0 END) checkout FROM results GROUP BY suite. Shows cross-test comparison in one row per suite."}, {"q": "What does PERCENT_RANK() vs CUME_DIST() differ in for QA percentile analysis?", "opts": ["No difference", "PERCENT_RANK: fraction of values strictly less than current; CUME_DIST: fraction of values less than or equal to current (includes ties)", "CUME_DIST is always larger", "PERCENT_RANK includes ties"], "ans": 1, "exp": "PERCENT_RANK uses strict inequality (not including current row). CUME_DIST uses <= (including ties at current rank). CUME_DIST is always >= PERCENT_RANK. For the max value: PERCENT_RANK < 1 if no ties, CUME_DIST = 1 always."}]}, {"id": 10, "title": "Comprehensive Mixed Review", "level": "Fresher → Junior", "icon": "🏆", "desc": "All topics combined — real QA scenarios and reasoning", "questions": [{"q": "A QA engineer needs to verify a user's order was created after checkout. What is the best SQL?", "opts": ["SELECT * FROM orders", "SELECT id, user_id, total, status, created_at FROM orders WHERE user_id = {uid} ORDER BY created_at DESC LIMIT 1", "SELECT COUNT(*) FROM orders WHERE user_id = {uid}", "SELECT * FROM users WHERE id = {uid}"], "ans": 1, "exp": "Select specific relevant columns, filter by user, get the most recent order. This verifies the right record was created with the right user, total, and status."}, {"q": "Which SQL concept handles 'find all users who have NOT placed an order'?", "opts": ["INNER JOIN", "LEFT JOIN + WHERE right IS NULL (anti-join)", "CROSS JOIN", "FULL OUTER JOIN"], "ans": 1, "exp": "Anti-join pattern: LEFT JOIN orders, WHERE orders.id IS NULL reveals users with no orders. Alternatively: WHERE NOT EXISTS or WHERE id NOT IN (SELECT user_id FROM orders)."}, {"q": "What is wrong with: SELECT user_id, MAX(created_at) FROM orders?", "opts": ["MAX is wrong", "Missing GROUP BY — user_id is non-aggregated but MAX is an aggregate", "Missing WHERE", "Nothing wrong"], "ans": 1, "exp": "Mixing non-aggregated columns (user_id) with aggregate functions (MAX) without GROUP BY is wrong in standard SQL. MySQL may execute it but gives non-deterministic results."}, {"q": "A test found 500 bug reports but 502 rows in the bugs table. What SQL investigates this?", "opts": ["SELECT 500 FROM bugs", "SELECT id, created_at, status FROM bugs ORDER BY created_at DESC LIMIT 10 -- check newest 2 records", "DELETE FROM bugs LIMIT 2", "SELECT * FROM bugs WHERE id > 500"], "ans": 1, "exp": "Check the 2 extra records — newest 2 are likely the discrepancy. Inspect their status, created_at, and data to understand why they're unexpected (test pollution, duplicate, etc.)."}, {"q": "Which LIKE pattern finds email addresses missing the domain extension?", "opts": ["LIKE '%@%'", "LIKE '%@%' AND NOT LIKE '%@%.%'", "LIKE '%@.%'", "LIKE '@%'"], "ans": 1, "exp": "Valid email has @ and a dot in the domain. '%@%' matches any @ but doesn't require a dot after @. Adding NOT LIKE '%@%.%' finds emails with @ but no dot after it — missing domain extension."}, {"q": "What does WHERE salary > (SELECT AVG(salary) FROM employees) return?", "opts": ["All employees", "Employees earning above average", "Average salary value", "Error — can't compare to subquery"], "ans": 1, "exp": "The scalar subquery calculates the average salary. The outer query compares each employee's salary to that average, returning only above-average earners."}, {"q": "A QA engineer wants to find duplicate orders (same user + same total + same day). What SQL?", "opts": ["SELECT * FROM orders WHERE duplicate = 1", "SELECT user_id, DATE(created_at), total, COUNT(*) as cnt FROM orders GROUP BY user_id, DATE(created_at), total HAVING cnt > 1", "SELECT DISTINCT * FROM orders", "SELECT user_id, COUNT(*) FROM orders GROUP BY user_id HAVING COUNT(*) > 1"], "ans": 1, "exp": "Group by all three fields that define a 'duplicate'. HAVING cnt > 1 reveals groups where this exact combination appears multiple times — potential duplicate order submissions."}, {"q": "What happens to a LEFT JOIN when you add a WHERE clause on the right table's non-key column?", "opts": ["Behavior unchanged", "Effectively becomes an INNER JOIN (filters out rows where right table matched but condition failed, plus unmatched rows where col is NULL)", "Adds the condition to the join", "Filters only left table rows"], "ans": 1, "exp": "WHERE on a right-table column (that's not about IS NULL) filters rows. Unmatched rows have NULL in right columns, and non-NULL condition on NULL = NULL (not TRUE). Result: unmatched rows are excluded — same effect as INNER JOIN."}, {"q": "Which query correctly identifies the top 3 products by total sales revenue?", "opts": ["SELECT TOP 3 product_id FROM order_items", "SELECT product_id, SUM(price * quantity) as revenue FROM order_items GROUP BY product_id ORDER BY revenue DESC LIMIT 3", "SELECT product_id, MAX(price) FROM order_items ORDER BY price DESC LIMIT 3", "SELECT * FROM products ORDER BY sales LIMIT 3"], "ans": 1, "exp": "SUM(price * quantity) per product gives total revenue. ORDER BY revenue DESC + LIMIT 3 gives top 3. TOP 3 is SQL Server syntax. MAX(price) gives highest unit price, not revenue."}, {"q": "What is the most appropriate constraint to use for a 'status' column with values ('active','inactive','pending')?", "opts": ["NOT NULL", "UNIQUE", "CHECK(status IN ('active','inactive','pending'))", "FOREIGN KEY"], "ans": 2, "exp": "CHECK constraint with an IN list validates that status can only be one of the defined values. NOT NULL prevents NULL but doesn't restrict values. UNIQUE allows each status only once. FOREIGN KEY references another table."}, {"q": "A QA test creates user A, places order, then deletes user A. After cleanup, what SQL verifies cleanup completeness?", "opts": ["SELECT * FROM users WHERE id = A_id", "SELECT 'users' as t, COUNT(*) FROM users WHERE id=A_id UNION SELECT 'orders', COUNT(*) FROM orders WHERE user_id=A_id (both should be 0)", "SELECT * FROM orders WHERE user_id = A_id", "DELETE FROM users WHERE id = A_id"], "ans": 1, "exp": "Check both tables for traces of user A. Both counts should be 0 after complete cleanup. UNION gives a side-by-side view of cleanup completeness across tables."}, {"q": "What does NULL OR TRUE evaluate to?", "opts": ["NULL", "TRUE", "FALSE", "Error"], "ans": 1, "exp": "Three-valued logic: NULL OR TRUE = TRUE. Even though one operand is unknown, OR with TRUE is always TRUE regardless of the other value."}, {"q": "A batch job should process 1000 records. After running, what SQL verifies it processed all of them?", "opts": ["SELECT * FROM jobs WHERE status = 'processed'", "SELECT COUNT(*) FROM jobs WHERE status='processed' AND batch_id={id} (should = 1000)", "SELECT SUM(*) FROM jobs", "SELECT MAX(id) FROM jobs"], "ans": 1, "exp": "Count processed records for the specific batch ID. Should equal 1000. Also check: SELECT COUNT(*) WHERE status='failed' should be 0. Both checks together verify full batch success."}, {"q": "What is the most concise way to write: WHERE score >= 0 AND score <= 100?", "opts": ["WHERE score BETWEEN -1 AND 101", "WHERE score BETWEEN 0 AND 100", "WHERE score IN (0, 100)", "WHERE score > -1 AND score < 101"], "ans": 1, "exp": "BETWEEN 0 AND 100 is inclusive and more concise than the equivalent >= AND <=. IN (0, 100) matches only exact values 0 and 100. The > -1 AND < 101 option is also correct but less readable."}, {"q": "How do you efficiently find the N-th highest salary without window functions?", "opts": ["SELECT MAX(salary) FROM emp LIMIT N", "SELECT DISTINCT salary FROM emp ORDER BY salary DESC LIMIT 1 OFFSET N-1", "SELECT salary FROM emp WHERE salary = (SELECT MAX(salary) FROM emp WHERE salar
