<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL Examinations for QA Engineers</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --surface3: #30363d;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent2: #388bfd;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --purple: #bc8cff;
    --orange: #ffa657;
    --radius: 8px;
    --font: 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
    --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { font-size: 20px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
  .logo span { color: var(--muted); font-weight: 400; }
  header .subtitle { color: var(--muted); font-size: 13px; }
  .top-nav {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .top-nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 10px;
    border: 1px solid transparent;
    border-radius: 6px;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
  }
  .top-nav a:hover,
  .top-nav a.active {
    color: var(--text);
    background: var(--surface2);
    border-color: var(--border);
  }
  header .spacer { flex: 1; }
  .badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .badge strong { color: var(--accent); }

  /* LAYOUT */
  .layout {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  /* SIDEBAR */
  .sidebar {
    width: 280px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px 12px;
    position: sticky;
    top: 57px;
    height: calc(100vh - 57px);
  }
  .sidebar-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    padding: 0 8px 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }
  .exam-card {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 8px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 2px;
    border: 1px solid transparent;
  }
  .exam-card:hover { background: var(--surface2); }
  .exam-card.active {
    background: rgba(88, 166, 255, 0.1);
    border-color: rgba(88, 166, 255, 0.3);
  }
  .exam-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
  .exam-info { flex: 1; min-width: 0; }
  .exam-name { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; }
  .exam-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .exam-progress-bar {
    height: 3px;
    background: var(--surface3);
    border-radius: 2px;
    margin-top: 6px;
    overflow: hidden;
  }
  .exam-progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s;
    width: 0%;
  }
  .exam-score-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--surface3);
    color: var(--muted);
    flex-shrink: 0;
  }
  .exam-score-badge.done { background: rgba(63,185,80,0.2); color: var(--green); }

  /* MAIN CONTENT */
  .main {
    flex: 1;
    padding: 32px;
    overflow-y: auto;
    max-width: 860px;
    margin: 0 auto;
    width: 100%;
  }

  /* HOME SCREEN */
  .home {
    text-align: center;
    padding: 48px 0;
  }
  .home h1 { font-size: 36px; font-weight: 700; color: var(--text); margin-bottom: 12px; }
  .home h1 span { color: var(--accent); }
  .home p { font-size: 16px; color: var(--muted); margin-bottom: 32px; line-height: 1.6; }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    max-width: 500px;
    margin: 0 auto 40px;
  }
  .stat-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
  }
  .stat-num { font-size: 32px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .topics-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin: 0 auto;
    text-align: left;
  }
  .topic-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .topic-card:hover {
    border-color: var(--accent2);
    background: var(--surface2);
  }
  .topic-icon { font-size: 24px; }
  .topic-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .topic-sub { font-size: 12px; color: var(--muted); }
  .topic-level {
    display: inline-block;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    margin-top: 6px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .level-fresher { background: rgba(63,185,80,0.15); color: var(--green); }
  .level-junior { background: rgba(88,166,255,0.15); color: var(--accent); }
  .level-advanced { background: rgba(188,140,255,0.15); color: var(--purple); }

  /* EXAM SCREEN */
  .exam-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .exam-header .icon { font-size: 32px; }
  .exam-header h2 { font-size: 22px; font-weight: 700; }
  .exam-header .desc { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .exam-header .spacer { flex: 1; }
  .timer {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 16px;
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    text-align: center;
    min-width: 80px;
  }
  .timer.warning { color: var(--yellow); border-color: var(--yellow); }
  .timer.danger { color: var(--red); border-color: var(--red); }

  /* PROGRESS */
  .progress-bar {
    height: 6px;
    background: var(--surface3);
    border-radius: 3px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  /* QUESTION */
  .question-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
  }
  .q-dot {
    width: 26px;
    height: 26px;
    border-radius: 4px;
    background: var(--surface3);
    border: 1px solid var(--border);
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .q-dot:hover { background: var(--surface2); color: var(--text); }
  .q-dot.current { background: var(--accent2); color: white; border-color: var(--accent); }
  .q-dot.correct { background: rgba(63,185,80,0.2); color: var(--green); border-color: var(--green); }
  .q-dot.wrong { background: rgba(248,81,73,0.2); color: var(--red); border-color: var(--red); }
  .q-dot.skipped { background: rgba(210,153,34,0.2); color: var(--yellow); border-color: var(--yellow); }

  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .question-num {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .question-num strong { color: var(--text); }
  .question-text {
    padding: 24px 20px 20px;
    font-size: 16px;
    line-height: 1.6;
    font-weight: 500;
    color: var(--text);
  }
  .question-text code {
    background: var(--surface3);
    color: var(--orange);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 14px;
  }
  .options {
    padding: 0 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    font-size: 14px;
    line-height: 1.5;
    background: var(--surface2);
    position: relative;
  }
  .option:hover:not(.disabled) {
    border-color: var(--accent2);
    background: rgba(88,166,255,0.05);
  }
  .option.disabled { cursor: default; }
  .option.correct {
    border-color: var(--green) !important;
    background: rgba(63,185,80,0.08) !important;
  }
  .option.wrong {
    border-color: var(--red) !important;
    background: rgba(248,81,73,0.08) !important;
  }
  .option.selected-wrong {
    border-color: var(--red) !important;
    background: rgba(248,81,73,0.12) !important;
  }
  .opt-label {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--surface3);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    flex-shrink: 0;
    font-family: var(--mono);
    transition: all 0.15s;
  }
  .option.correct .opt-label {
    background: var(--green);
    border-color: var(--green);
    color: white;
  }
  .option.wrong .opt-label, .option.selected-wrong .opt-label {
    background: var(--red);
    border-color: var(--red);
    color: white;
  }
  .opt-text { flex: 1; color: var(--text); }
  .opt-icon {
    flex-shrink: 0;
    font-size: 16px;
    margin-top: 2px;
  }

  /* EXPLANATION */
  .explanation {
    margin: 0 20px 20px;
    padding: 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
    display: none;
  }
  .explanation.show { display: block; }
  .explanation .exp-header {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    margin-bottom: 8px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
  }
  .explanation.correct-exp { border-color: rgba(63,185,80,0.4); }
  .explanation.wrong-exp { border-color: rgba(248,81,73,0.4); }
  .explanation .exp-header.correct { color: var(--green); }
  .explanation .exp-header.wrong { color: var(--red); }
  .explanation code {
    background: var(--surface3);
    color: var(--orange);
    padding: 2px 5px;
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 12px;
  }

  /* NAV BUTTONS */
  .question-footer {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    align-items: center;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 18px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
    font-family: var(--font);
  }
  .btn-primary {
    background: var(--accent2);
    color: white;
    border-color: var(--accent);
  }
  .btn-primary:hover { background: #1f6feb; }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border-color: var(--border);
  }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }
  .btn-danger {
    background: rgba(248,81,73,0.1);
    color: var(--red);
    border-color: rgba(248,81,73,0.3);
  }
  .btn-danger:hover { background: rgba(248,81,73,0.2); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .score-live {
    margin-left: auto;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .score-live .correct { color: var(--green); font-weight: 700; }
  .score-live .wrong { color: var(--red); font-weight: 700; }

  /* RESULTS */
  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px;
    text-align: center;
    margin-bottom: 24px;
  }
  .result-icon { font-size: 64px; margin-bottom: 16px; }
  .result-score { font-size: 64px; font-weight: 800; line-height: 1; margin-bottom: 8px; }
  .result-label { font-size: 16px; color: var(--muted); margin-bottom: 24px; }
  .result-grade {
    display: inline-block;
    font-size: 14px;
    font-weight: 700;
    padding: 6px 20px;
    border-radius: 20px;
    margin-bottom: 16px;
  }
  .grade-s { background: rgba(63,185,80,0.2); color: var(--green); }
  .grade-a { background: rgba(88,166,255,0.2); color: var(--accent); }
  .grade-b { background: rgba(210,153,34,0.2); color: var(--yellow); }
  .grade-c { background: rgba(255,166,87,0.2); color: var(--orange); }
  .grade-f { background: rgba(248,81,73,0.2); color: var(--red); }
  .result-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin: 24px 0;
  }
  .res-stat {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .res-stat .num { font-size: 28px; font-weight: 700; }
  .res-stat .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .num.green { color: var(--green); }
  .num.red { color: var(--red); }
  .num.yellow { color: var(--yellow); }
  .num.blue { color: var(--accent); }

  /* REVIEW */
  .review-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .review-item.correct-item { border-color: rgba(63,185,80,0.3); }
  .review-item.wrong-item { border-color: rgba(248,81,73,0.3); }
  .review-header {
    padding: 12px 16px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    cursor: pointer;
  }
  .review-q { font-size: 14px; font-weight: 500; flex: 1; line-height: 1.5; }
  .review-tag {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 4px;
    flex-shrink: 0;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .tag-correct { background: rgba(63,185,80,0.2); color: var(--green); }
  .tag-wrong { background: rgba(248,81,73,0.2); color: var(--red); }
  .review-detail {
    padding: 0 16px 16px;
    display: none;
  }
  .review-detail.open { display: block; }
  .review-ans { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .review-ans strong { color: var(--text); }
  .review-exp {
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    header { flex-wrap: wrap; }
    .top-nav { order: 3; width: 100%; }
    .sidebar { display: none; }
    .main { padding: 16px; }
    .stat-grid { grid-template-columns: repeat(3, 1fr); }
    .topics-grid { grid-template-columns: 1fr; }
    .result-stats { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>

  </main>
</div>

<script>
const EXAMS = [{"id": 1, "title": "SELECT & Basic Queries", "level": "Fresher", "icon": "🔍", "desc": "SELECT syntax, aliases, DISTINCT, ORDER BY, LIMIT", "questions": [{"q": "Which keyword retrieves all columns from a table?", "opts": ["FETCH *", "SELECT *", "GET ALL", "RETRIEVE *"], "ans": 1, "exp": "SELECT * is the standard SQL syntax to retrieve all columns. FETCH is used in pagination (FETCH NEXT), GET and RETRIEVE are not valid SQL keywords."}, {"q": "What does the AS keyword do in SQL?", "opts": ["Filters rows", "Creates a table", "Assigns an alias to a column or table", "Joins two tables"], "ans": 2, "exp": "AS assigns a temporary alias. It doesn't filter (that's WHERE), create tables (that's CREATE TABLE), or join tables (that's JOIN)."}, {"q": "Which query returns only unique values in the 'status' column?", "opts": ["SELECT UNIQUE status FROM orders", "SELECT DIFFERENT status FROM orders", "SELECT DISTINCT status FROM orders", "SELECT status WITHOUT DUPLICATES FROM orders"], "ans": 2, "exp": "DISTINCT is the correct keyword. UNIQUE is a constraint keyword, not a SELECT modifier. DIFFERENT and WITHOUT DUPLICATES are not valid SQL."}, {"q": "What does ORDER BY DESC do?", "opts": ["Filters descending rows", "Sorts results from highest to lowest", "Reverses the table permanently", "Deletes lower values"], "ans": 1, "exp": "ORDER BY DESC sorts results in descending order (Z→A, 9→0). It never modifies the table permanently. Filtering is done with WHERE."}, {"q": "Which clause limits the number of rows returned?", "opts": ["TOP", "LIMIT", "ROWCOUNT", "MAXROWS"], "ans": 1, "exp": "LIMIT is the MySQL/PostgreSQL standard. TOP is SQL Server syntax. ROWCOUNT and MAXROWS are not standard SQL clauses."}, {"q": "What is the correct order of clauses in a SELECT statement?", "opts": ["SELECT → WHERE → FROM", "FROM → SELECT → WHERE", "SELECT → FROM → WHERE", "WHERE → FROM → SELECT"], "ans": 2, "exp": "Logical order: SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY. The engine evaluates FROM first internally, but the written order must be SELECT → FROM → WHERE."}, {"q": "What does SELECT 1+1 return?", "opts": ["Error", "'1+1'", "2", "NULL"], "ans": 2, "exp": "SQL evaluates arithmetic expressions. 1+1 = 2. It returns an integer, not a string. NULL is returned only when NULL is involved in the calculation."}, {"q": "Which query retrieves rows 11–20 from a table?", "opts": ["SELECT * FROM t LIMIT 10,10", "SELECT * FROM t LIMIT 10 OFFSET 10", "SELECT * FROM t ROWS 11 TO 20", "Both A and B"], "ans": 3, "exp": "Both A (LIMIT offset,count) and B (LIMIT count OFFSET offset) are valid MySQL syntax for pagination. 'ROWS 11 TO 20' is not standard MySQL syntax."}, {"q": "What happens when you ORDER BY a column that has NULL values by default?", "opts": ["NULLs are excluded", "NULLs appear first in ASC order", "NULLs appear last in ASC order", "Error is thrown"], "ans": 1, "exp": "In MySQL, NULLs are treated as the lowest value, so they appear first in ASC and last in DESC order. Different databases handle this differently (PostgreSQL allows NULLS FIRST/LAST)."}, {"q": "Which is a valid column alias?", "opts": ["SELECT name AS 'Full Name'", "SELECT name AS Full Name", "SELECT name ALIAS Full Name", "SELECT name NAMED 'Full Name'"], "ans": 0, "exp": "Aliases with spaces must be quoted (single or double quotes). 'SELECT name AS Full Name' would be a syntax error. ALIAS and NAMED are not SQL keywords."}, {"q": "What does SELECT DISTINCT name, city return?", "opts": ["Unique names only", "Unique cities only", "Unique combinations of name AND city", "Error"], "ans": 2, "exp": "DISTINCT applies to the full row selected. It returns rows where the combination of name+city is unique, not just unique names or cities alone."}, {"q": "Which ORDER BY is valid for sorting by two columns?", "opts": ["ORDER BY name, age", "ORDER BY name AND age", "ORDER BY name + age", "ORDER BY name THEN age"], "ans": 0, "exp": "Multiple sort columns are separated by commas. AND, +, and THEN are not valid delimiters in ORDER BY."}, {"q": "What does LIMIT 0 return?", "opts": ["All rows", "Error", "The first row", "Zero rows (empty result)"], "ans": 3, "exp": "LIMIT 0 returns an empty result set with no rows. It's sometimes used to retrieve only the column structure of a query."}, {"q": "What is the purpose of a semicolon (;) in SQL?", "opts": ["Comment marker", "Terminates a SQL statement", "Separates column names", "Required after FROM"], "ans": 1, "exp": "The semicolon marks the end of a SQL statement. It is required when executing multiple statements in sequence. -- marks comments. Columns are separated by commas."}, {"q": "Which query finds the 5 most recently created users?", "opts": ["SELECT * FROM users ORDER BY created_at LIMIT 5", "SELECT * FROM users ORDER BY created_at DESC LIMIT 5", "SELECT TOP 5 * FROM users ORDER BY created_at", "SELECT * FROM users LIMIT 5 ORDER BY created_at DESC"], "ans": 1, "exp": "ORDER BY created_at DESC sorts newest first, then LIMIT 5 takes the top 5. Option A sorts oldest first. TOP 5 is SQL Server syntax. ORDER BY must come before LIMIT in MySQL."}, {"q": "Which of these is a valid SQL comment?", "opts": ["// This is a comment", "/* This is a comment */", "## This is a comment", "Both A and B"], "ans": 1, "exp": "/* ... */ is a block comment. -- is a single-line comment. // and ## are not SQL comment styles."}, {"q": "What does the FROM clause specify?", "opts": ["The columns to return", "The condition to filter", "The source table(s)", "The sort order"], "ans": 2, "exp": "FROM specifies the source table or tables. Columns come from SELECT, filters from WHERE, and sort order from ORDER BY."}, {"q": "SELECT name, age FROM users returns:", "opts": ["All columns of users", "Only name and age columns", "All users named 'age'", "Error — must use SELECT *"], "ans": 1, "exp": "Listing specific column names returns only those columns. SELECT * is not required — specific column lists are more efficient and precise."}, {"q": "What is a result set?", "opts": ["A stored procedure", "The rows and columns returned by a query", "A database index", "A type of table join"], "ans": 1, "exp": "A result set is the tabular data returned by a SELECT query — rows and columns meeting the specified conditions."}, {"q": "Which of the following sorts alphabetically Z to A?", "opts": ["ORDER BY name ASC", "ORDER BY name", "ORDER BY name DESC", "ORDER BY name REVERSE"], "ans": 2, "exp": "DESC (descending) sorts Z→A for strings. ASC and default ORDER BY both sort A→Z. REVERSE is not a SQL keyword."}, {"q": "What is the difference between LIMIT 5 and LIMIT 5 OFFSET 5?", "opts": ["No difference", "LIMIT 5 returns rows 1-5; LIMIT 5 OFFSET 5 returns rows 6-10", "LIMIT 5 OFFSET 5 skips 5 columns", "OFFSET changes sort order"], "ans": 1, "exp": "OFFSET skips a number of rows before starting to return results. LIMIT 5 = rows 1-5. LIMIT 5 OFFSET 5 = rows 6-10. OFFSET affects rows, not columns or sort order."}, {"q": "Can you use an alias in the WHERE clause?", "opts": ["Yes, always", "No — aliases are evaluated after WHERE", "Only with subqueries", "Only for table aliases"], "ans": 1, "exp": "Column aliases defined in SELECT cannot be used in WHERE because WHERE is evaluated before SELECT in the logical query processing order. Workaround: use a subquery or repeat the expression."}, {"q": "What does SELECT * FROM users WHERE 1=1 return?", "opts": ["Error", "All rows", "No rows", "Only one row"], "ans": 1, "exp": "1=1 is always TRUE, so the WHERE clause never filters any rows. All rows are returned. This pattern is sometimes used in dynamic query building."}, {"q": "Which clause is used to remove duplicate rows from results?", "opts": ["REMOVE DUPLICATES", "UNIQUE", "DISTINCT", "DEDUPLICATE"], "ans": 2, "exp": "DISTINCT is the only standard SQL keyword for removing duplicate rows from a result set. The others are not valid SQL syntax."}, {"q": "What does SELECT NULL + 5 return?", "opts": ["5", "0", "NULL", "Error"], "ans": 2, "exp": "Any arithmetic operation involving NULL returns NULL. NULL means 'unknown', so unknown + 5 = unknown (NULL)."}, {"q": "How do you give a table an alias?", "opts": ["FROM users AS u", "FROM users u", "Both A and B are valid", "TABLE users = u"], "ans": 2, "exp": "Both 'AS u' and just 'u' (without AS) are valid table alias syntaxes. AS is optional for table aliases."}, {"q": "What does ORDER BY 2 mean?", "opts": ["Sort by the value 2", "Sort by the second column in SELECT", "Error", "Sort by id=2"], "ans": 1, "exp": "ORDER BY can reference columns by position (1-indexed). ORDER BY 2 sorts by the second column listed in SELECT. This is valid but less readable than using the column name."}, {"q": "Which query returns users sorted by age, then name for same ages?", "opts": ["SELECT * FROM users ORDER BY age, name", "SELECT * FROM users ORDER BY age AND name", "SELECT * FROM users SORT BY age THEN name", "SELECT * FROM users ORDER BY age + name"], "ans": 0, "exp": "Comma-separated columns in ORDER BY apply left to right. AND is a logical operator. SORT BY and THEN are not SQL keywords."}, {"q": "Can SELECT be used without FROM?", "opts": ["Never", "Yes — for expressions and functions", "Only in subqueries", "Only in views"], "ans": 1, "exp": "SELECT 1+1, NOW(), 'hello' are all valid without FROM. This is commonly used to test expressions or call functions."}, {"q": "What is the output of SELECT 'hello' AS greeting?", "opts": ["Error", "greeting = hello", "A column named 'greeting' with value 'hello'", "The word 'greeting'"], "ans": 2, "exp": "This returns a single row with a column aliased as 'greeting' containing the string value 'hello'."}, {"q": "What does LIMIT 10, 20 mean?", "opts": ["Return 10 rows starting at row 20", "Return 20 rows starting at row 10", "Return rows 10 to 20", "Return 10 rows then 20 rows"], "ans": 1, "exp": "LIMIT offset, count syntax: first number is offset (skip), second is count (return). LIMIT 10, 20 skips 10 rows and returns the next 20."}, {"q": "Which is more efficient for QA verification: SELECT * or SELECT id, email?", "opts": ["SELECT * is always better", "SELECT specific columns is better", "They are identical in performance", "SELECT * is required for verification"], "ans": 1, "exp": "Selecting specific columns is more efficient (less data transferred), more explicit about what you're checking, and less affected by schema changes that add new columns."}, {"q": "How do you select a column named 'order' (a reserved word)?", "opts": ["SELECT order FROM t", "SELECT `order` FROM t", "SELECT [order] FROM t", "Reserved words cannot be column names"], "ans": 1, "exp": "Backticks (`) in MySQL allow using reserved words as column names. Brackets ([]) work in SQL Server. Reserved words can be column names but require quoting."}, {"q": "What happens if ORDER BY references a column not in SELECT?", "opts": ["Error always", "Works fine — ORDER BY can reference any table column", "Only works with SELECT *", "Syntax error in all databases"], "ans": 1, "exp": "ORDER BY can reference any column in the FROM table(s), not just columns listed in SELECT. This is valid SQL."}, {"q": "What does SELECT DISTINCT * do?", "opts": ["Error", "Returns unique rows based on all columns", "Returns only the first row", "Removes NULL rows"], "ans": 1, "exp": "DISTINCT * deduplicates based on all selected columns combined. A row is considered duplicate only if every column matches another row exactly."}, {"q": "Which is NOT a valid SELECT statement?", "opts": ["SELECT 1", "SELECT now()", "SELECT FROM users", "SELECT 'test'"], "ans": 2, "exp": "SELECT FROM users is missing a column list or *. Valid syntax is SELECT [columns] FROM [table]. SELECT 1, SELECT now(), and SELECT 'test' are all valid expressions without FROM."}, {"q": "What is the result of SELECT 10 / 3 in integer division?", "opts": ["3", "3.33", "3.333...", "Error"], "ans": 0, "exp": "In MySQL, 10/3 returns 3.3333 (float division). However, 10 DIV 3 returns 3 (integer division). MySQL's / operator performs float division by default."}, {"q": "How do you comment out a single line in SQL?", "opts": ["// comment", "# comment or -- comment", "/* comment */", "Both B and C"], "ans": 1, "exp": "-- and # are both single-line comment styles in MySQL. /* */ is a block comment. // is not valid SQL comment syntax."}, {"q": "What does SELECT CONCAT('Hello', ' ', 'World') return?", "opts": ["Error", "'Hello World'", "'HelloWorld'", "NULL"], "ans": 1, "exp": "CONCAT joins strings. 'Hello' + ' ' + 'World' = 'Hello World'. Note: if any argument is NULL, CONCAT returns NULL in MySQL."}, {"q": "Which query returns columns in reverse definition order?", "opts": ["SELECT * REVERSE FROM t", "SELECT col3, col2, col1 FROM t", "SELECT * ORDER BY COLUMN_DEFINITION DESC", "Not possible in SQL"], "ans": 1, "exp": "SQL doesn't have a reverse column order feature. The only way to control column order is to explicitly list them. SELECT * always returns columns in the table's definition order."}, {"q": "What does SELECT UPPER('hello') return?", "opts": ["'hello'", "'HELLO'", "'Hello'", "Error"], "ans": 1, "exp": "UPPER() converts all characters to uppercase. LOWER() converts to lowercase."}, {"q": "What is the result of SELECT LENGTH('SQL')?", "opts": ["1", "2", "3", "4"], "ans": 2, "exp": "LENGTH() returns the number of characters. 'SQL' has 3 characters, so LENGTH('SQL') = 3."}, {"q": "What does TRIM(' hello ') return?", "opts": ["' hello '", "'hello'", "'hello '", "' hello'"], "ans": 1, "exp": "TRIM() removes leading and trailing spaces. LTRIM removes only leading spaces. RTRIM removes only trailing spaces."}, {"q": "Can you SELECT from multiple tables without JOIN?", "opts": ["No", "Yes — using comma-separated tables (implicit cross join)", "Only with subqueries", "Only with UNION"], "ans": 1, "exp": "SELECT * FROM t1, t2 performs an implicit CROSS JOIN (Cartesian product). It's valid but usually unintentional and produces t1.rows × t2.rows rows."}, {"q": "What does SELECT ROUND(3.567, 2) return?", "opts": ["3.5", "3.56", "3.57", "4"], "ans": 2, "exp": "ROUND(value, decimals) rounds to specified decimal places. 3.567 rounded to 2 decimal places = 3.57 (rounds up since 3rd decimal ≥ 5)."}, {"q": "Which clause would you use to rename a column in output?", "opts": ["RENAME", "AS", "ALIAS", "COLUMN"], "ans": 1, "exp": "AS (or omitting AS) is the standard SQL way to alias column names in output. RENAME alters table structure. ALIAS and COLUMN are not SQL keywords for this purpose."}, {"q": "What does SELECT MOD(10, 3) return?", "opts": ["3", "1", "0.33", "3.33"], "ans": 1, "exp": "MOD(10, 3) returns the remainder of 10 ÷ 3 = 1. Same as 10 % 3 = 1."}, {"q": "What is the purpose of OFFSET in pagination?", "opts": ["Limits column count", "Skips a number of rows before returning results", "Sorts in reverse", "Removes duplicates"], "ans": 1, "exp": "OFFSET skips the specified number of rows. LIMIT 10 OFFSET 20 skips the first 20 rows and returns rows 21-30. Used for page-based navigation."}, {"q": "Which is a deterministic SQL function?", "opts": ["NOW()", "RAND()", "UUID()", "ABS(-5)"], "ans": 3, "exp": "ABS(-5) always returns 5 — it's deterministic. NOW() changes every execution. RAND() produces random values. UUID() generates unique identifiers. Non-deterministic functions return different values on each call."}, {"q": "What does SELECT IF(1>0, 'yes', 'no') return?", "opts": ["yes", "no", "1", "Error"], "ans": 0, "exp": "IF(condition, true_value, false_value) is MySQL's conditional expression. 1>0 is TRUE, so it returns 'yes'."}, {"q": "Which query returns the total number of rows in a table?", "opts": ["SELECT ROWS FROM t", "SELECT COUNT(*) FROM t", "SELECT SUM(*) FROM t", "SELECT TOTAL FROM t"], "ans": 1, "exp": "COUNT(*) counts all rows including NULLs. SUM() adds numeric values. ROWS and TOTAL are not SQL aggregate functions."}, {"q": "What does SELECT ISNULL(NULL) return in MySQL?", "opts": ["1", "0", "NULL", "Error"], "ans": 0, "exp": "ISNULL() in MySQL returns 1 if the value is NULL, 0 otherwise. This is different from SQL Server's ISNULL() which replaces NULL with a default value."}, {"q": "What is wrong with: SELECT FROM users;", "opts": ["Missing WHERE clause", "Missing column list or *", "Missing semicolon", "Nothing — it's valid"], "ans": 1, "exp": "SELECT requires either specific column names or * after it. 'SELECT FROM users' has no column specification and is a syntax error."}, {"q": "What does ORDER BY name ASC, age DESC mean?", "opts": ["Sort by name ascending, use age only if names differ", "Sort by name ascending then age descending together", "Error — can't mix ASC and DESC", "Sort name ascending OR age descending"], "ans": 0, "exp": "Multiple ORDER BY columns apply left to right. First sort by name (A→Z). When names are equal, sort by age (9→0). Mixing ASC and DESC in one ORDER BY is perfectly valid."}, {"q": "What is returned by SELECT COALESCE(NULL, NULL, 'found', 'ignored')?", "opts": ["NULL", "'found'", "'ignored'", "Error"], "ans": 1, "exp": "COALESCE returns the first non-NULL value. It checks left to right: NULL, NULL, then 'found' — returns 'found'. 'ignored' is never evaluated."}, {"q": "Which of these does NOT modify a column's displayed name?", "opts": ["SELECT name AS n", "SELECT name n", "SELECT name", "SELECT name ALIAS n"], "ans": 3, "exp": "ALIAS is not a SQL keyword for aliasing. Options A and B both create aliases. Option C returns the column as its original name 'name'. ALIAS is not valid SQL."}, {"q": "What does FLOOR(4.9) return?", "opts": ["4", "5", "4.9", "Error"], "ans": 0, "exp": "FLOOR() rounds DOWN to the nearest integer. FLOOR(4.9) = 4. CEILING(4.9) = 5. ROUND(4.9, 0) = 5."}, {"q": "What does CEILING(4.1) return?", "opts": ["4", "5", "4.1", "Error"], "ans": 1, "exp": "CEILING() rounds UP to the nearest integer regardless of decimal. CEILING(4.1) = 5. FLOOR(4.1) = 4. ROUND(4.1, 0) = 4."}, {"q": "Which is valid for selecting rows 21-30?", "opts": ["LIMIT 10 OFFSET 20", "LIMIT 20, 10", "LIMIT 10, 20", "Both A and B"], "ans": 3, "exp": "Both syntaxes are valid in MySQL. 'LIMIT count OFFSET skip' and 'LIMIT skip, count'. Note: Option C (LIMIT 10, 20) would return 20 rows starting at row 11."}, {"q": "What does SELECT ABS(-42) return?", "opts": ["-42", "42", "0", "Error"], "ans": 1, "exp": "ABS() returns the absolute value — always positive. ABS(-42) = 42. ABS(42) = 42."}]}, {"id": 2, "title": "WHERE Clause & Filtering", "level": "Fresher", "icon": "🔎", "desc": "Comparison operators, BETWEEN, IN, LIKE, NULL, AND/OR", "questions": [{"q": "Which operator checks for an exact match?", "opts": ["LIKE", "=", "BETWEEN", "IN"], "ans": 1, "exp": "= is for exact equality. LIKE is for pattern matching. BETWEEN checks a range. IN checks a list of values."}, {"q": "What does WHERE age BETWEEN 18 AND 65 return?", "opts": ["Ages 19-64", "Ages 18-65 (inclusive)", "Ages 18-65 (exclusive)", "Ages < 18 or > 65"], "ans": 1, "exp": "BETWEEN is inclusive on both ends. WHERE age BETWEEN 18 AND 65 includes 18 and 65. To exclude endpoints, use: age > 18 AND age < 65."}, {"q": "What does LIKE '%test%' match?", "opts": ["Strings starting with 'test'", "Strings ending with 'test'", "Strings containing 'test' anywhere", "Only the exact string 'test'"], "ans": 2, "exp": "% is a wildcard matching zero or more characters. 'test%' matches start, '%test' matches end, '%test%' matches anywhere."}, {"q": "What does WHERE status IN ('active', 'pending') return?", "opts": ["Rows where status = 'active' AND 'pending'", "Rows where status is either 'active' or 'pending'", "Error — IN takes only numbers", "Rows where status is NOT 'active' or 'pending'"], "ans": 1, "exp": "IN is a shorthand for multiple OR conditions. It checks if the column value is any of the listed values. Works with strings and numbers."}, {"q": "What is the correct way to check for NULL?", "opts": ["WHERE col = NULL", "WHERE col IS NULL", "WHERE col == NULL", "WHERE col EQUALS NULL"], "ans": 1, "exp": "NULL cannot be compared with = or ==. You must use IS NULL or IS NOT NULL. This is because NULL represents unknown, and unknown = unknown is also unknown (not TRUE)."}, {"q": "What does WHERE email NOT LIKE '%@gmail.com' return?", "opts": ["All Gmail users", "All non-Gmail users", "Error", "Rows where email is NULL"], "ans": 1, "exp": "NOT LIKE returns rows that do NOT match the pattern. Note: it does not include rows where email IS NULL, since NULL comparisons always return NULL (not TRUE or FALSE)."}, {"q": "What does WHERE age > 18 AND age < 30 return?", "opts": ["Ages 18 and 30", "Ages 19-29", "Ages 18-30", "Ages < 18 or > 30"], "ans": 1, "exp": "Both conditions must be TRUE. age > 18 excludes 18, age < 30 excludes 30. Result: ages 19 through 29."}, {"q": "What is the result of WHERE 1=0?", "opts": ["All rows", "No rows", "Error", "NULL"], "ans": 1, "exp": "1=0 is always FALSE. A WHERE clause that is always FALSE returns an empty result set. Used in query templates to return no data."}, {"q": "Which LIKE pattern matches exactly 3 characters?", "opts": ["LIKE '___'", "LIKE '%___%'", "LIKE '3'", "LIKE '???'"], "ans": 0, "exp": "Underscore (_) matches exactly ONE character. Three underscores match exactly 3 characters. % matches zero or more. '3' and '???' are not wildcard patterns."}, {"q": "What is the operator precedence: WHERE a=1 OR b=2 AND c=3?", "opts": ["(a=1 OR b=2) AND c=3", "a=1 OR (b=2 AND c=3)", "Equal precedence — left to right", "Undefined"], "ans": 1, "exp": "AND has higher precedence than OR, similar to multiplication before addition. b=2 AND c=3 evaluates first, then OR with a=1. Use parentheses to make intent explicit."}, {"q": "What does NOT IN ('a','b','c') return when the column value is NULL?", "opts": ["TRUE — NULL is not in the list", "FALSE — NULL is excluded", "NULL — the comparison is unknown", "Error"], "ans": 2, "exp": "NULL comparisons return NULL (unknown). NULL NOT IN ('a','b','c') = NULL, not TRUE. This is a common QA bug source — NOT IN with NULLs in a subquery can return empty results."}, {"q": "Which operator means 'not equal'?", "opts": ["!= only", "<> only", "Both != and <>", "NOT ="], "ans": 2, "exp": "Both != and <> mean 'not equal' in SQL and are interchangeable. != is more common in modern usage. NOT = is not valid SQL syntax."}, {"q": "What does LIKE 'A_C' match?", "opts": ["Any string starting with A and ending with C", "Exactly 'A_C' with underscore", "Three-character strings starting with A and ending with C", "Any string containing A and C"], "ans": 2, "exp": "_ matches exactly one character. 'A_C' matches 3-character strings: A + any one character + C. Examples: 'ABC', 'AXC', 'A1C'."}, {"q": "What does WHERE email IS NOT NULL AND email != '' check for?", "opts": ["Emails that are NULL", "Emails that have actual values (not null or empty)", "All emails", "Emails equal to empty string"], "ans": 1, "exp": "This combination checks for emails that are neither NULL nor empty string — ensuring the field has a real value. Both conditions are needed: IS NOT NULL catches NULLs, != '' catches empty strings."}, {"q": "What does WHERE price NOT BETWEEN 10 AND 50 return?", "opts": ["Prices 10-50", "Prices < 10 or > 50 (excludes 10 and 50)", "Prices outside 10-50 inclusive", "Prices that are NULL"], "ans": 2, "exp": "NOT BETWEEN is exclusive on both ends for the 'not' side — it returns prices < 10 or > 50. Since BETWEEN is inclusive (10 and 50 are in range), NOT BETWEEN excludes 10 and 50."}, {"q": "What is wrong with: WHERE age = NULL?", "opts": ["Nothing — it's correct", "NULL can't be compared with =; use IS NULL", "= requires quotes around NULL", "WHERE can't filter by NULL"], "ans": 1, "exp": "NULL represents unknown, and unknown = unknown is also unknown (not TRUE). The correct syntax is WHERE age IS NULL. This is one of the most common SQL beginner mistakes."}, {"q": "Which correctly checks if a column value is in a range?", "opts": ["WHERE age IN (18, 65)", "WHERE age BETWEEN 18 AND 65", "WHERE age >= 18 AND age <= 65", "Both B and C"], "ans": 3, "exp": "BETWEEN 18 AND 65 and age >= 18 AND age <= 65 are equivalent — both inclusive. IN(18, 65) would only match exactly 18 or 65, not values between them."}, {"q": "What does WHERE name LIKE 'J%n' match?", "opts": ["Only 'John'", "Names starting with J and ending with n", "Names containing J and n", "'Jn' only"], "ans": 1, "exp": "J% matches J followed by any characters, then n at the end. Matches: Jon, John, Jason, Justin, Jenn. The string must start with J and end with n."}, {"q": "What does AND do in a WHERE clause?", "opts": ["Returns rows where at least one condition is true", "Returns rows where ALL conditions are true", "Combines two separate queries", "Acts like OR"], "ans": 1, "exp": "AND requires ALL conditions to be TRUE for a row to be included. OR requires at least one condition to be TRUE."}, {"q": "What does OR do in a WHERE clause?", "opts": ["Requires all conditions to be true", "Returns rows where AT LEAST ONE condition is true", "Is the same as AND", "Negates both conditions"], "ans": 1, "exp": "OR includes a row if ANY one condition is TRUE. AND includes a row only if ALL conditions are TRUE."}, {"q": "Where does LIKE work best from a performance perspective?", "opts": ["'%value' (starts with wildcard)", "'value%' (ends with wildcard)", "'%value%' (contains)", "All perform equally"], "ans": 1, "exp": "'value%' can use a database index since it starts with a known prefix. '%value' and '%value%' require full table scans because the beginning is unknown."}, {"q": "What is the difference between WHERE and HAVING?", "opts": ["No difference", "WHERE filters before grouping, HAVING filters after grouping", "HAVING filters individual rows", "WHERE filters aggregates"], "ans": 1, "exp": "WHERE filters rows before any GROUP BY aggregation. HAVING filters groups after aggregation. You cannot use aggregate functions (COUNT, SUM) in WHERE — use HAVING instead."}, {"q": "What does WHERE status IN (SELECT status FROM active_statuses) do?", "opts": ["Error — IN requires literal values", "Filters rows based on a subquery result", "Creates a join between tables", "Updates status values"], "ans": 1, "exp": "IN accepts both literal value lists and subquery results. This is a correlated subquery pattern — common in QA verification queries."}, {"q": "How do you find rows where a string column contains a percent sign literally?", "opts": ["LIKE '%%'", "LIKE '%\\%%'", "LIKE '%[%]%'", "Percent signs cannot be searched with LIKE"], "ans": 1, "exp": "ESCAPE character allows treating wildcards literally. LIKE '%\\%%' with backslash escape matches a literal %. Alternatively: LIKE '%[%]%' works in SQL Server."}, {"q": "What does WHERE role = 'admin' OR role = 'superadmin' simplify to?", "opts": ["WHERE role BETWEEN 'admin' AND 'superadmin'", "WHERE role IN ('admin', 'superadmin')", "WHERE role LIKE 'admin'", "WHERE role AND 'admin'"], "ans": 1, "exp": "IN is the concise way to write multiple OR equality checks for the same column. BETWEEN doesn't apply to arbitrary string lists."}, {"q": "Can WHERE use calculated expressions?", "opts": ["No — only column names", "Yes — WHERE price * quantity > 1000 is valid", "Only with aliases", "Only with subqueries"], "ans": 1, "exp": "WHERE can use expressions, functions, and calculations. WHERE price * quantity > 1000 and WHERE LENGTH(name) > 10 are both valid."}, {"q": "What does WHERE name LIKE '%' match?", "opts": ["Only empty strings", "Nothing — it's an error", "All rows including empty strings but excluding NULL", "All rows including NULL"], "ans": 2, "exp": "'%' matches any string including empty string. However, NULL does not match any LIKE pattern — LIKE '%' excludes NULL rows."}, {"q": "What is the result of WHERE TRUE AND FALSE?", "opts": ["TRUE", "FALSE", "NULL", "Error"], "ans": 1, "exp": "TRUE AND FALSE = FALSE. The row is excluded. All AND conditions must be TRUE for the row to be included."}, {"q": "Which query finds users created in the last 7 days?", "opts": ["WHERE created_at > 7", "WHERE created_at >= NOW() - INTERVAL 7 DAY", "WHERE DATE_DIFF(NOW(), created_at) = 7", "WHERE created_at BETWEEN -7 AND NOW()"], "ans": 1, "exp": "INTERVAL arithmetic is the correct approach. NOW() - INTERVAL 7 DAY gives a datetime 7 days ago. Option A compares a datetime to an integer (invalid). DATE_DIFF syntax is wrong. BETWEEN -7 AND NOW() is invalid."}, {"q": "What does WHERE NOT (a=1 AND b=2) expand to?", "opts": ["WHERE a!=1 AND b!=2", "WHERE a!=1 OR b!=2", "WHERE NOT a=1 AND NOT b=2", "WHERE a=1 OR b=2"], "ans": 1, "exp": "De Morgan's Law: NOT(A AND B) = NOT A OR NOT B. So NOT(a=1 AND b=2) = a!=1 OR b!=2. This is a key logical reasoning concept for QA."}, {"q": "What does LIKE '___' match that LIKE '%' doesn't specifically require?", "opts": ["Any string length", "Exactly 3 characters", "Strings with underscores", "Uppercase strings only"], "ans": 1, "exp": "'___' requires exactly 3 characters (three _ wildcards). '%' matches any string including empty string and any length."}, {"q": "What happens with WHERE id IN (1, 2, NULL)?", "opts": ["Error", "Returns rows with id=1 or id=2 (NULL is ignored in IN)", "Returns rows with id=1, id=2, or NULL", "Returns only NULL rows"], "ans": 1, "exp": "NULL in an IN list is ignored for matching purposes, but creates a subtle bug with NOT IN — NOT IN with NULL in the list returns no results."}, {"q": "Which correctly filters for both NULL and empty status?", "opts": ["WHERE status IS NULL", "WHERE status = ''", "WHERE status IS NULL OR status = ''", "WHERE status IN (NULL, '')"], "ans": 2, "exp": "You need both conditions: IS NULL for NULL values, and = '' for empty strings. IN (NULL, '') won't work because IN checks with =, and NULL = NULL returns NULL, not TRUE."}, {"q": "What does WHERE price > ALL (SELECT price FROM discounts) mean?", "opts": ["Error — ALL isn't valid here", "Price is greater than every price in discounts", "Price is greater than any price in discounts", "Price is in the discounts table"], "ans": 1, "exp": "ALL requires the condition to be true for ALL values in the subquery. ANY/SOME requires it to be true for at least one value."}, {"q": "What type of wildcard matches exactly one character in LIKE?", "opts": ["%", "_", "*", "?"], "ans": 1, "exp": "Underscore (_) matches exactly one character. Percent (%) matches zero or more. * and ? are wildcards in file systems but not SQL LIKE."}, {"q": "What does WHERE age BETWEEN 18 AND 18 return?", "opts": ["Error", "All rows where age = 18", "No rows", "Ages 17-19"], "ans": 1, "exp": "BETWEEN x AND x with same value returns rows where the column equals exactly that value. It's equivalent to WHERE age = 18."}, {"q": "Which condition would you use to detect potential SQL injection in stored user data?", "opts": ["WHERE input LIKE '%select%'", "WHERE input LIKE '%''%'", "WHERE input LIKE '%OR 1=1%'", "All of the above — multiple patterns needed"], "ans": 3, "exp": "SQL injection detection requires checking for multiple patterns: single quotes, SQL keywords, comment sequences (--), etc. No single LIKE pattern catches all injection attempts."}, {"q": "What does WHERE LENGTH(name) = 0 catch?", "opts": ["NULL names", "Empty string names", "Both NULL and empty", "Names with spaces"], "ans": 1, "exp": "LENGTH(NULL) returns NULL, not 0. So this only catches empty strings ''. To catch both, use: WHERE name IS NULL OR LENGTH(name) = 0."}, {"q": "How do you filter rows where a JSON column contains a specific key?", "opts": ["WHERE col LIKE '%key%'", "WHERE JSON_CONTAINS_KEY(col, 'key')", "WHERE col->'$.key' IS NOT NULL", "LIKE is sufficient"], "ans": 2, "exp": "MySQL's JSON path operator (->) or JSON_EXTRACT() is used for JSON column queries. LIKE is unreliable for JSON as it's just string matching and may give false positives."}, {"q": "What does WHERE email REGEXP '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$' validate?", "opts": ["Emails that contain @", "Emails matching standard email format", "Only .com emails", "Only lowercase emails"], "ans": 1, "exp": "REGEXP with this pattern validates standard email format: local part + @ + domain + dot + TLD. More precise than LIKE for email validation checks."}, {"q": "Which query finds rows updated in the last hour?", "opts": ["WHERE updated_at > NOW()-1", "WHERE updated_at >= NOW() - INTERVAL 1 HOUR", "WHERE updated_at BETWEEN -1 AND NOW()", "WHERE HOUR(updated_at) = HOUR(NOW())"], "ans": 1, "exp": "INTERVAL 1 HOUR is the correct MySQL interval syntax. Option A subtracts integer 1 (interpreted as 1 second in some contexts). HOUR(updated_at) = HOUR(NOW()) compares only the hour part, ignoring the date."}, {"q": "What does WHERE city IN ('', NULL) return?", "opts": ["Rows where city is NULL or empty", "Only rows where city is empty (NULL match fails with =)", "Error", "All rows"], "ans": 1, "exp": "IN uses = for comparison. NULL = NULL returns NULL (not TRUE), so NULL in the IN list doesn't match NULL values. Only empty string '' rows are returned. Use: WHERE city IS NULL OR city = ''."}, {"q": "What is short-circuit evaluation in SQL WHERE?", "opts": ["SQL always evaluates all conditions", "Some databases optimize by skipping conditions once result is determined", "SQL evaluates right to left", "Conditions are evaluated in random order"], "ans": 1, "exp": "Some databases may use short-circuit evaluation: for AND, if the first condition is FALSE, skip the rest; for OR, if the first is TRUE, skip the rest. However, SQL standard doesn't guarantee evaluation order."}, {"q": "How do you filter by a specific year?", "opts": ["WHERE date = 2024", "WHERE YEAR(date) = 2024", "WHERE date LIKE '2024%'", "Both B and C"], "ans": 3, "exp": "YEAR(date) = 2024 is clean and index-unfriendly. LIKE '2024%' works if date is stored as a string. For a DATE type, BETWEEN '2024-01-01' AND '2024-12-31' is best for index usage."}, {"q": "What does WHERE id NOT IN (SELECT user_id FROM banned) do when banned has NULL user_ids?", "opts": ["Returns all non-banned users", "Returns no rows at all", "Error", "Returns banned users"], "ans": 1, "exp": "This is the NULL poison problem. NOT IN with a subquery containing NULL returns empty results because NOT IN internally uses !=, and NULL != x returns NULL. Use NOT EXISTS instead."}, {"q": "What is the safest way to check 'not in this list' when the list might contain NULLs?", "opts": ["NOT IN (...)", "NOT EXISTS (SELECT 1 FROM ... WHERE ...)", "<> ALL (...)", "LEFT JOIN ... WHERE right IS NULL"], "ans": 1, "exp": "NOT EXISTS is NULL-safe because it returns TRUE/FALSE based on row existence, not value comparison. NOT IN and <> ALL fail when NULLs are present in the subquery."}, {"q": "What does WHERE price > 100 OR discount IS NOT NULL return?", "opts": ["Rows with price > 100 AND discount", "Rows with price > 100 OR rows with a discount", "Only rows with discount", "Rows where both conditions are true"], "ans": 1, "exp": "OR returns rows where either condition is TRUE. A row with price = 50 and a discount would be included. A row with price = 200 and no discount would also be included."}, {"q": "What does WHERE name REGEXP '^[A-Z]' match?", "opts": ["Names starting with any letter", "Names starting with an uppercase letter", "Names containing uppercase letters", "Names in all caps"], "ans": 1, "exp": "^ anchors to the start, [A-Z] matches one uppercase letter. This matches names that START with an uppercase letter."}, {"q": "Which is faster for exact match filtering?", "opts": ["LIKE 'value'", "= 'value'", "REGEXP '^value$'", "All are identical"], "ans": 1, "exp": "= can use indexes directly and is the fastest for exact matches. LIKE without wildcards also uses indexes in some databases. REGEXP is generally slowest as it can't use standard B-tree indexes."}, {"q": "What does WHERE COALESCE(col, 0) > 0 accomplish?", "opts": ["Selects rows where col > 0", "Selects rows where col > 0 OR col is NULL", "Selects rows where col > 0 (treats NULL as 0, which is not > 0)", "Error"], "ans": 2, "exp": "COALESCE(col, 0) replaces NULL with 0. So NULL becomes 0, which is not > 0. Result: only rows where col is actually greater than 0 are returned. Rows with NULL col are excluded."}, {"q": "What does WHERE DATEDIFF(NOW(), last_login) > 30 return?", "opts": ["Users who logged in within 30 days", "Users who haven't logged in for more than 30 days", "Users with 30 days of login history", "All users where last_login is set"], "ans": 1, "exp": "DATEDIFF(NOW(), last_login) gives days since last login. > 30 returns users inactive for more than 30 days."}, {"q": "What does WHERE id BETWEEN 100 AND 200 NOT match?", "opts": ["id = 100", "id = 150", "id = 200", "id = 99"], "ans": 3, "exp": "BETWEEN 100 AND 200 is inclusive — it includes 100, 150, 200, and everything between. id = 99 is outside the range and is NOT matched."}, {"q": "How would you query test data you inserted exactly 5 minutes ago?", "opts": ["WHERE created_at = NOW()-5", "WHERE created_at >= NOW() - INTERVAL 5 MINUTE", "WHERE MINUTE(created_at) = 5", "WHERE created_at = NOW() - 5/1440"], "ans": 1, "exp": "INTERVAL 5 MINUTE is the correct MySQL syntax. NOW()-5 subtracts 5 seconds. MINUTE(created_at) = 5 matches any row where the minute part is :05. The fraction approach works in some databases but is non-standard."}, {"q": "What does WHERE email LIKE '%@%@%' detect?", "opts": ["Valid emails", "Emails with more than one @ sign (invalid)", "Emails without @", "All emails"], "ans": 1, "exp": "A valid email has exactly one @. '%@%@%' matches strings with at least two @ signs, which indicates an invalid email format."}, {"q": "Which WHERE clause finds users registered today?", "opts": ["WHERE created_at = TODAY()", "WHERE DATE(created_at) = CURDATE()", "WHERE created_at = NOW()", "WHERE created_at IS TODAY"], "ans": 1, "exp": "DATE(created_at) extracts the date part, then compare to CURDATE(). Using = NOW() would require an exact timestamp match (very unlikely). TODAY() and IS TODAY are not valid MySQL functions."}, {"q": "What is the purpose of ESCAPE in LIKE?", "opts": ["Speeds up LIKE queries", "Allows treating wildcard characters (%, _) as literals", "Required for NULL handling", "Enables case-sensitive matching"], "ans": 1, "exp": "LIKE 'A\\%B' ESCAPE '\\' treats \\% as a literal percent sign. Without ESCAPE, % and _ in a LIKE pattern are always wildcards."}, {"q": "What does WHERE status = 'ACTIVE' return if the column stores 'active'?", "opts": ["The row is returned (case-insensitive by default in MySQL)", "No rows (case-sensitive)", "Error", "Depends on LIKE"], "ans": 0, "exp": "MySQL string comparisons are case-insensitive by default for standard collations (utf8_general_ci). If the collation is _bin or _cs, it would be case-sensitive."}, {"q": "What does WHERE quantity <= 0 catch for QA?", "opts": ["Zero quantity only", "Negative and zero quantities (invalid inventory)", "Positive quantities", "NULL quantities"], "ans": 1, "exp": "<= 0 catches both zero and negative quantities — both likely data integrity issues in an inventory system. NULL is not caught (NULL <= 0 returns NULL)."}, {"q": "What does WHERE col LIKE '_a%' match?", "opts": ["Strings starting with 'a'", "Strings where the second character is 'a'", "Strings ending with 'a'", "Strings containing 'a' anywhere"], "ans": 1, "exp": "_ matches exactly one character, so '_a%' means: any one character, then 'a', then anything. Examples: 'basic', 'cat', '1abc'."}, {"q": "What does WHERE salary BETWEEN 3000 AND 5000 NOT match?", "opts": ["salary = 3000", "salary = 4000", "salary = 5000", "salary = 2999"], "ans": 3, "exp": "BETWEEN is inclusive. 3000 and 5000 are both included. 2999 is below the lower bound and is NOT matched."}]}, {"id": 3, "title": "JOIN Operations", "level": "Fresher → Junior", "icon": "🔗", "desc": "INNER JOIN, LEFT JOIN, RIGHT JOIN, FULL JOIN, Self JOIN", "questions": [{"q": "What does INNER JOIN return?", "opts": ["All rows from both tables", "Only rows with matching values in both tables", "All rows from the left table", "All rows from the right table"], "ans": 1, "exp": "INNER JOIN returns only rows where the join condition is met in BOTH tables. Non-matching rows from either table are excluded."}, {"q": "What does LEFT JOIN return?", "opts": ["Only matching rows", "All rows from left table + matching rows from right (NULLs for no match)", "All rows from right table + matching rows from left", "All rows from both tables"], "ans": 1, "exp": "LEFT JOIN returns all rows from the left (first) table. For rows with no match in the right table, right table columns are NULL."}, {"q": "How do you find orphan records using LEFT JOIN?", "opts": ["WHERE right.id IS NOT NULL", "WHERE right.id IS NULL", "WHERE left.id IS NULL", "WHERE left.id = right.id"], "ans": 1, "exp": "LEFT JOIN all rows from left + NULLs for no match. WHERE right.id IS NULL isolates rows that have no match — these are 'orphan' records."}, {"q": "What is the result of CROSS JOIN?", "opts": ["Matching rows only", "Cartesian product: every row × every row", "An error", "Random row combinations"], "ans": 1, "exp": "CROSS JOIN produces a Cartesian product — every row in table A combined with every row in table B. If A has 3 rows and B has 4 rows, result has 12 rows. Use with caution."}, {"q": "What does RIGHT JOIN do that LEFT JOIN doesn't?", "opts": ["Returns the right table's primary key", "Prioritizes all rows from the RIGHT table instead of left", "Filters right table rows", "Joins on multiple columns"], "ans": 1, "exp": "RIGHT JOIN keeps all rows from the right table and NULLs for non-matching left rows. LEFT JOIN keeps all left rows. They are symmetrically interchangeable by swapping table order."}, {"q": "What is a self join?", "opts": ["Joining a table to itself", "Joining without a condition", "An automatic join by the database", "A join using primary keys only"], "ans": 0, "exp": "A self join joins a table to itself using aliases. Useful for hierarchical data (manager-employee) or comparing rows within the same table."}, {"q": "In a LEFT JOIN, what value appears in right-table columns for unmatched rows?", "opts": ["0", "''", "NULL", "Error"], "ans": 2, "exp": "Unmatched rows from the right table get NULL in all right-table columns. This is how LEFT JOIN signals 'no match found'."}, {"q": "What does ON specify in a JOIN?", "opts": ["The tables to join", "The join condition (how tables are connected)", "The columns to select", "The sort order"], "ans": 1, "exp": "ON specifies the condition for matching rows between tables (e.g., ON orders.user_id = users.id). Without ON, the result is a CROSS JOIN."}, {"q": "Which JOIN type would you use to find all users and their orders (including users with no orders)?", "opts": ["INNER JOIN users with orders", "LEFT JOIN users with orders", "RIGHT JOIN orders with users", "CROSS JOIN"], "ans": 1, "exp": "LEFT JOIN users WITH orders keeps all users. Users with no orders get NULL order columns. INNER JOIN would exclude users with no orders."}, {"q": "What is a FULL OUTER JOIN?", "opts": ["A join with multiple ON conditions", "Returns all rows from both tables — NULLs where no match", "Only matching rows", "Same as CROSS JOIN"], "ans": 1, "exp": "FULL OUTER JOIN returns all rows from both tables. Non-matching rows get NULL from the other table. MySQL doesn't support FULL OUTER JOIN natively — simulate with LEFT JOIN UNION RIGHT JOIN."}, {"q": "Can you JOIN more than two tables?", "opts": ["No — only two tables per JOIN", "Yes — chain multiple JOINs", "Only with subqueries", "Only with UNION"], "ans": 1, "exp": "You can chain any number of JOINs: FROM a JOIN b ON ... JOIN c ON ... JOIN d ON ... Each JOIN adds one more table."}, {"q": "What is the difference between ON and USING in JOINs?", "opts": ["No difference", "USING is used when columns have the SAME name in both tables", "ON is faster", "USING requires primary keys"], "ans": 1, "exp": "USING (col) is a shorthand when the join column has the same name in both tables. ON is more flexible and allows different column names or expressions."}, {"q": "Which JOIN finds payments that have no corresponding order?", "opts": ["INNER JOIN payments and orders", "LEFT JOIN payments with orders WHERE orders.id IS NULL", "RIGHT JOIN orders with payments", "CROSS JOIN payments and orders"], "ans": 1, "exp": "LEFT JOIN payments WITH orders keeps all payments. WHERE orders.id IS NULL isolates payments with no matching order — a data integrity issue."}, {"q": "What does a self join on an employee table reveal?", "opts": ["Duplicate employees", "Manager-subordinate relationships", "Employees with no manager", "Both B and C depending on WHERE clause"], "ans": 3, "exp": "Self join: e1.manager_id = e2.id. INNER JOIN reveals manager-employee pairs. LEFT JOIN reveals those too PLUS employees with no manager (NULL manager)."}, {"q": "What is a natural join?", "opts": ["A join without conditions", "A join that automatically matches columns with the same name", "A join based on primary/foreign keys", "An optimized inner join"], "ans": 1, "exp": "NATURAL JOIN automatically joins on all columns with identical names in both tables. It's convenient but risky — adding columns can silently change join behavior. Explicit ON is preferred."}, {"q": "How do you join tables with different key column names?", "opts": ["ON t1.user_id = t2.id", "USING (user_id)", "JOIN ON 'user_id'='id'", "The columns must have the same name"], "ans": 0, "exp": "ON allows joining on columns with different names. USING only works when column names are identical. Column names don't need to match for a JOIN."}, {"q": "What query finds users who HAVE placed at least one order?", "opts": ["SELECT u.* FROM users u LEFT JOIN orders o ON u.id=o.user_id WHERE o.id IS NULL", "SELECT u.* FROM users u INNER JOIN orders o ON u.id=o.user_id", "SELECT DISTINCT u.* FROM users u LEFT JOIN orders o ON u.id=o.user_id WHERE o.id IS NOT NULL", "Both B and C"], "ans": 3, "exp": "INNER JOIN naturally keeps only users with orders. LEFT JOIN + WHERE o.id IS NOT NULL also works but is less efficient. DISTINCT in option C is needed because a user might have multiple orders."}, {"q": "In SQL, what is an equijoin?", "opts": ["A join using = in the ON condition", "A join where both tables have equal row counts", "A join that returns equal numbers of rows from each table", "A JOIN with no condition"], "ans": 0, "exp": "An equijoin uses the = operator in its join condition. It's the most common type of join. Non-equijoins use operators like >, <, BETWEEN, etc."}, {"q": "What does SELECT * FROM a, b WHERE a.id = b.a_id represent?", "opts": ["A LEFT JOIN", "An INNER JOIN using old syntax", "A CROSS JOIN", "An error"], "ans": 1, "exp": "The comma syntax (FROM a, b) with WHERE creates an implicit INNER JOIN. This is old SQL-89 syntax; explicit JOIN...ON is preferred for clarity."}, {"q": "What is a non-equijoin?", "opts": ["A join without an ON clause", "A join using operators other than = (e.g., BETWEEN, >, <)", "A join between non-related tables", "A JOIN with NULL values"], "ans": 1, "exp": "Non-equijoins use non-equality operators. Example: JOIN salary_grades ON emp.salary BETWEEN sg.low AND sg.high. Useful for range-based lookups."}, {"q": "What issue arises from joining without a proper ON condition?", "opts": ["Error", "Cartesian product — every row combined with every row", "Only first row matches", "NULL results"], "ans": 1, "exp": "Without ON (or with a comma join without WHERE), you get a Cartesian product. For large tables this can return millions of rows and crash the database."}, {"q": "Can a LEFT JOIN produce more rows than the left table?", "opts": ["No — always same count", "Yes — if one left row matches multiple right rows", "Only with duplicates", "Only with DISTINCT"], "ans": 1, "exp": "If one row in the left table matches multiple rows in the right table, it appears multiple times in the result. This is called a 'fan-out' and is a common source of inflated counts in QA verification."}, {"q": "What does SELECT COUNT(*) FROM a LEFT JOIN b ON a.id=b.a_id vs INNER JOIN return if some a rows have no b match?", "opts": ["Same count", "LEFT JOIN returns higher count (includes unmatched a rows)", "INNER JOIN returns higher count", "Cannot be determined"], "ans": 1, "exp": "LEFT JOIN includes all a rows even those without b matches. INNER JOIN only includes rows with matches. If some a rows have no matching b row, LEFT JOIN count > INNER JOIN count."}, {"q": "How do you check referential integrity between orders and users tables?", "opts": ["INNER JOIN and check COUNT", "LEFT JOIN orders ON users where users.id IS NULL", "LEFT JOIN users ON orders where users.id IS NULL", "RIGHT JOIN users ON orders"], "ans": 2, "exp": "LEFT JOIN users (right) on orders (left). WHERE users.id IS NULL finds orders with user_ids that don't exist in the users table — broken foreign key references."}, {"q": "What is the purpose of table aliases in JOINs?", "opts": ["Required for JOINs to work", "Makes queries shorter and clearer when joining the same table multiple times", "Improves query performance", "Changes the actual table name"], "ans": 1, "exp": "Aliases are especially useful in self-joins (must alias the same table twice) and multi-table queries. They don't change actual table names and don't inherently affect performance."}, {"q": "Which query returns users and their order count (including 0 orders)?", "opts": ["SELECT u.id, COUNT(o.id) FROM users u INNER JOIN orders o ON u.id=o.user_id GROUP BY u.id", "SELECT u.id, COUNT(o.id) FROM users u LEFT JOIN orders o ON u.id=o.user_id GROUP BY u.id", "SELECT u.id, COUNT(*) FROM users u LEFT JOIN orders o ON u.id=o.user_id GROUP BY u.id", "Both B and C are correct"], "ans": 1, "exp": "LEFT JOIN keeps all users. COUNT(o.id) counts only non-NULL order IDs — so users with no orders get 0. COUNT(*) in option C would count 1 even for unmatched rows (the NULL row)."}, {"q": "What does JOIN without specifying INNER/LEFT/RIGHT default to?", "opts": ["FULL OUTER JOIN", "LEFT JOIN", "INNER JOIN", "CROSS JOIN"], "ans": 2, "exp": "JOIN alone is shorthand for INNER JOIN. Explicit INNER JOIN is preferred for clarity, but they are functionally identical."}, {"q": "How do you join on multiple conditions?", "opts": ["ON a.id = b.id AND a.type = b.type", "ON a.id = b.id, a.type = b.type", "ON (a.id, a.type) = (b.id, b.type)", "ON a.id = b.id WHERE a.type = b.type"], "ans": 0, "exp": "Multiple join conditions use AND in the ON clause. Comma separation and tuple comparison aren't valid ON syntax. Using WHERE for join conditions works but is old syntax."}, {"q": "What is an anti-join?", "opts": ["A join that excludes matching rows", "A LEFT JOIN with WHERE right IS NULL to find non-matching rows", "A NOT INNER JOIN", "Both A and B"], "ans": 3, "exp": "An anti-join returns rows from the left table with NO match in the right table. Achieved with LEFT JOIN + WHERE right.pk IS NULL, or NOT EXISTS, or NOT IN."}, {"q": "What does a QA engineer use JOINs for most commonly?", "opts": ["Creating reports", "Data integrity verification (checking foreign keys, orphan records)", "Performance optimization", "Creating indexes"], "ans": 1, "exp": "QA engineers use JOINs to verify: referential integrity (orphan records), data consistency across related tables, and that API calls correctly persist related data."}, {"q": "Why is DISTINCT sometimes needed with JOINs?", "opts": ["To improve performance", "To eliminate duplicate rows caused by one-to-many joins", "Required syntax for LEFT JOIN", "To handle NULL values"], "ans": 1, "exp": "If one row joins to multiple rows, you get duplicates. DISTINCT removes them. Example: a user with 3 orders appears 3 times in a users-orders join — DISTINCT collapses to 1 user row."}, {"q": "What does FROM a LEFT JOIN b ON a.id=b.a_id LEFT JOIN c ON b.id=c.b_id do if b has no match for a row?", "opts": ["Error", "a row appears with NULL for b and c columns", "Only c is NULL", "The row is excluded"], "ans": 1, "exp": "Chained LEFT JOINs: if b has no match, b columns are NULL. Since c joins on b.id (which is NULL), c also gets NULL. The a row is still included."}, {"q": "Which JOIN simulates FULL OUTER JOIN in MySQL?", "opts": ["INNER JOIN UNION LEFT JOIN", "LEFT JOIN UNION ALL RIGHT JOIN WHERE left IS NULL", "LEFT JOIN UNION RIGHT JOIN", "CROSS JOIN with filter"], "ans": 2, "exp": "MySQL lacks FULL OUTER JOIN. Simulate it: LEFT JOIN (all left rows) UNION RIGHT JOIN (all right rows) removes duplicates. UNION ALL would need WHERE to exclude shared rows."}, {"q": "What is wrong with: FROM orders JOIN users ON orders.user_id = users.user_id AND WHERE users.status = 'active'?", "opts": ["JOIN condition should be in WHERE", "AND cannot be used in ON", "AND WHERE is invalid — WHERE is a separate clause", "Both A and C"], "ans": 2, "exp": "ON and WHERE are separate clauses. Correct syntax: JOIN users ON orders.user_id = users.user_id WHERE users.status = 'active'. 'AND WHERE' is not valid SQL syntax."}, {"q": "What is the difference between filtering in ON vs WHERE for LEFT JOINs?", "opts": ["No difference", "ON filter is applied before joining (keeps all left rows); WHERE filter is applied after (may exclude left rows)", "WHERE filter is applied before; ON is applied after", "ON and WHERE cannot both be used"], "ans": 1, "exp": "For LEFT JOIN: conditions in ON are evaluated during the join (left rows always kept). Conditions in WHERE filter the final result (can exclude left rows where right is NULL). This is a critical distinction."}, {"q": "What query detects order_items with no parent order?", "opts": ["SELECT oi.* FROM order_items oi INNER JOIN orders o ON oi.order_id = o.id", "SELECT oi.* FROM order_items oi LEFT JOIN orders o ON oi.order_id = o.id WHERE o.id IS NULL", "SELECT oi.* FROM orders o LEFT JOIN order_items oi ON o.id = oi.order_id WHERE oi.id IS NULL", "SELECT * FROM order_items WHERE order_id NOT IN (SELECT id FROM orders)"], "ans": 1, "exp": "LEFT JOIN order_items WITH orders. WHERE orders.id IS NULL finds order_items whose order_id doesn't exist in orders — classic orphan record detection. Option D also works but fails if orders has NULL ids."}, {"q": "What happens when you JOIN on a NULL column?", "opts": ["NULL = NULL is TRUE in JOINs", "NULL values never match (NULL = NULL is NULL, not TRUE)", "Error", "Only LEFT JOIN handles NULL joins"], "ans": 1, "exp": "NULL = NULL is NULL (unknown), not TRUE, in SQL. So rows with NULL in join columns don't match each other in INNER JOIN. Use IS NULL + special handling for NULL-keyed joins."}, {"q": "Which JOIN type preserves all rows from both tables?", "opts": ["INNER JOIN", "LEFT JOIN", "RIGHT JOIN", "FULL OUTER JOIN"], "ans": 3, "exp": "FULL OUTER JOIN returns all rows from both tables, with NULLs where no match exists. MySQL requires simulation via LEFT JOIN UNION RIGHT JOIN."}, {"q": "What is a hash join?", "opts": ["A join using hash symbols in column names", "A join algorithm where the database builds a hash table for one table to speed up matching", "A join on hashed password columns", "A JOIN with DISTINCT"], "ans": 1, "exp": "Hash join is a query execution strategy: build a hash map for the smaller table, then probe with larger table rows. Generally faster than nested loop joins for large tables."}, {"q": "If table A has 5 rows and B has 0 rows, what does LEFT JOIN return?", "opts": ["0 rows", "5 rows with NULL for B columns", "Error", "5 rows with B columns empty string"], "ans": 1, "exp": "LEFT JOIN always returns all rows from the left table. Even when the right table is empty, all 5 left rows appear with NULL values for all right-table columns."}, {"q": "Which is typically more efficient for checking existence?", "opts": ["JOIN", "EXISTS", "IN", "COUNT > 0"], "ans": 1, "exp": "EXISTS stops at the first match found. JOIN and IN may process all matching rows. EXISTS is generally most efficient for existence checks."}, {"q": "What does SELECT u.name, o.total FROM users u JOIN orders o USING (id) do?", "opts": ["Joins on both tables' id column", "Error — users and orders have different id meanings", "Joins users.id = orders.id which is likely wrong", "Same as ON u.id = o.id"], "ans": 2, "exp": "USING (id) joins on orders.id = users.id. But orders.id is the ORDER id, not the user_id. The correct join should be ON u.id = o.user_id. USING on 'id' is semantically wrong here."}, {"q": "What does a join on a non-indexed column cause?", "opts": ["Error", "Full table scan — performance issue", "Correct results but a warning", "Automatically creates an index"], "ans": 1, "exp": "Joining on non-indexed columns forces a full table scan for each row match. For QA environments this may be acceptable but can time out in production. Always check that join columns are indexed."}, {"q": "What does SELECT p.*, o.* FROM payments p LEFT JOIN orders o ON p.order_id = o.id WHERE p.amount != o.total detect?", "opts": ["Payments with no order", "Payment amount mismatches with order total", "Duplicate payments", "All payments"], "ans": 1, "exp": "This detects data integrity issues where a payment's recorded amount doesn't match the associated order's total — a QA critical check after payment processing."}, {"q": "When should you use NOT EXISTS instead of NOT IN?", "opts": ["Never — they're identical", "When the subquery might return NULL values", "Only for performance", "Only for string columns"], "ans": 1, "exp": "NOT IN fails silently when the subquery returns any NULL — returns empty result. NOT EXISTS is NULL-safe and returns correct results. Always prefer NOT EXISTS for exclusion checks."}, {"q": "What does joining users, orders, and order_items allow a QA engineer to verify?", "opts": ["User account details only", "Full order traceability — from user to order to line items", "Item inventory only", "Nothing useful"], "ans": 1, "exp": "A 3-table join allows end-to-end verification: which user placed which order containing which items. This is the foundation of e-commerce data integrity testing."}, {"q": "What is the risk of a many-to-many join without a bridge table?", "opts": ["Performance only", "Data redundancy and incorrect aggregations", "NULL errors", "Can't be done in SQL"], "ans": 1, "exp": "Many-to-many relationships without a bridge table cause data duplication. JOINs produce Cartesian-like products and aggregations (SUM, COUNT) produce inflated values."}, {"q": "What does the ON clause need to include to avoid a Cartesian product?", "opts": ["At least one WHERE condition", "A condition linking columns from both joined tables", "ORDER BY", "LIMIT clause"], "ans": 1, "exp": "The ON clause must have a condition that links specific columns between the two tables. Without a valid linking condition, you get all combinations (Cartesian product)."}, {"q": "How do you join a table to itself to find duplicate email users?", "opts": ["SELECT a.* FROM users a JOIN users b ON a.email = b.email WHERE a.id != b.id", "SELECT * FROM users SELF JOIN users", "SELECT * FROM users JOIN users", "SELECT DISTINCT * FROM users"], "ans": 0, "exp": "Self-join with different IDs but same email reveals duplicates. Alias the table twice (a, b). WHERE a.id != b.id excludes matching a row with itself."}, {"q": "What is the difference between DELETE with JOIN and DELETE with subquery?", "opts": ["No difference", "JOIN allows deleting from multiple tables simultaneously; subquery deletes from one", "Subqueries cannot be used with DELETE", "JOIN-based DELETE is always faster"], "ans": 1, "exp": "DELETE with JOIN can delete rows from one or more tables in a single statement. Subquery-based DELETE deletes from one table based on another table's data. JOINs are more explicit about the target."}, {"q": "In a QA scenario, which query verifies that all invoices have a corresponding payment?", "opts": ["SELECT * FROM invoices INNER JOIN payments ON invoices.id = payments.invoice_id", "SELECT i.* FROM invoices i LEFT JOIN payments p ON i.id = p.invoice_id WHERE p.id IS NULL", "SELECT * FROM payments LEFT JOIN invoices ON payments.invoice_id = invoices.id", "SELECT COUNT(*) FROM invoices INNER JOIN payments ON invoices.id = payments.invoice_id"], "ans": 1, "exp": "LEFT JOIN invoices WITH payments. WHERE payments.id IS NULL reveals invoices with no associated payment — a critical billing integrity check."}, {"q": "What is a theta join?", "opts": ["A join using non-equality operators", "A join on calculated columns", "A join using Greek letter theta as column name", "A LEFT JOIN variant"], "ans": 0, "exp": "A theta join uses any comparison operator (=, >, <, !=, BETWEEN, etc.) in the join condition. An equijoin is a special case of theta join using =."}, {"q": "Can you JOIN a table to a subquery?", "opts": ["No — can only JOIN real tables", "Yes — subqueries can act as derived tables in JOINs", "Only with LEFT JOIN", "Only with INNER JOIN"], "ans": 1, "exp": "Derived tables (subqueries in FROM clause) can be joined like regular tables. Example: JOIN (SELECT user_id, COUNT(*) as cnt FROM orders GROUP BY user_id) oc ON u.id = oc.user_id."}, {"q": "What does SELECT a.id, b.name FROM a LEFT JOIN b ON a.b_id = b.id WHERE b.id IS NOT NULL behave like?", "opts": ["LEFT JOIN", "INNER JOIN — WHERE b.id IS NOT NULL excludes unmatched rows", "CROSS JOIN", "RIGHT JOIN"], "ans": 1, "exp": "Adding WHERE b.id IS NOT NULL to a LEFT JOIN filters out rows where no match was found (those have NULL for b.id). The result is identical to an INNER JOIN."}, {"q": "Can two tables be joined on a non-primary key column?", "opts": ["No — must join on primary keys", "Yes — JOIN can use any column as long as values are comparable", "Only with FOREIGN KEY", "Only with UNIQUE columns"], "ans": 1, "exp": "JOIN conditions can use any column(s). The join co
