y < MAX(salary))", "SELECT TOP N salary FROM emp"], "ans": 1, "exp": "DISTINCT removes duplicates, ORDER BY DESC sorts highest first, OFFSET N-1 skips N-1 rows, LIMIT 1 takes the Nth. Example: 3rd highest = OFFSET 2, LIMIT 1. Window functions (DENSE_RANK) are cleaner for this."}, {"q": "What QA scenario requires COALESCE in a SELECT clause?", "opts": ["Joining tables", "Displaying 'N/A' when an optional field like middle_name is NULL", "Counting rows", "Filtering by date"], "ans": 1, "exp": "COALESCE(middle_name, 'N/A') displays 'N/A' instead of NULL in reports or API responses. Required when NULL would break display logic or application null handling."}, {"q": "What is the correct join to use when you want ALL records from both tables?", "opts": ["INNER JOIN", "LEFT JOIN", "RIGHT JOIN", "FULL OUTER JOIN (simulated in MySQL with LEFT JOIN UNION RIGHT JOIN)"], "ans": 3, "exp": "FULL OUTER JOIN returns all rows from both tables with NULLs where no match exists. MySQL lacks native FULL OUTER JOIN — use LEFT JOIN UNION RIGHT JOIN."}, {"q": "What does DISTINCT in SELECT * DISTINCT mean?", "opts": ["Valid — returns unique rows", "Syntax error — DISTINCT comes after SELECT, not after *", "Same as UNIQUE", "Removes NULL rows"], "ans": 1, "exp": "DISTINCT must immediately follow SELECT: SELECT DISTINCT * FROM table. SELECT * DISTINCT is invalid SQL syntax."}, {"q": "A payment of $100 was processed but the order total shows $0. What SQL investigates?", "opts": ["SELECT * FROM payments", "SELECT o.id, o.total, p.amount, p.status, p.created_at FROM orders o JOIN payments p ON o.id = p.order_id WHERE p.id = {payment_id}", "SELECT * FROM orders WHERE total = 0", "SELECT COUNT(*) FROM payments"], "ans": 1, "exp": "Join payments to orders for the specific payment. Check if the order's total was updated, when the payment was processed vs when the order was created. The mismatch may reveal a timing or update bug."}, {"q": "Which is a valid use of HAVING without GROUP BY?", "opts": ["Not valid", "HAVING COUNT(*) > 1000 — returns the full result only if it has more than 1000 rows", "HAVING applied to individual rows", "HAVING required only with aggregates"], "ans": 1, "exp": "Without GROUP BY, the entire table is one group. HAVING COUNT(*) > 1000 returns all rows only if there are more than 1000 total — a quick way to check if a table is non-trivially populated."}, {"q": "What makes a QA SQL query 'production-safe'?", "opts": ["Always using SELECT *", "Avoiding full table scans on large tables, limiting results, not using DELETE without WHERE, read-only access where possible", "Only using COUNT(*)", "Avoiding JOINs"], "ans": 1, "exp": "Production-safe QA SQL: SELECT specific columns, add LIMIT on large tables, never run DELETE/UPDATE without WHERE in production, use read replicas for QA queries, avoid functions on indexed columns in WHERE."}, {"q": "What does WHERE id IN (1, 2, 3) OR id IS NULL return?", "opts": ["Only ids 1, 2, 3", "Rows where id is 1, 2, or 3 OR where id is NULL", "Error — IN and IS NULL can't combine", "Only NULL rows"], "ans": 1, "exp": "OR combines two conditions. id IN (1,2,3) checks specific values. id IS NULL checks for NULL separately (since IN doesn't match NULL). Both conditions are valid together."}, {"q": "How do you verify that a reporting API returns the correct date range of data?", "opts": ["Trust the API", "SELECT MIN(created_at) as earliest, MAX(created_at) as latest FROM report_data WHERE report_id = {id} and verify against requested range", "SELECT * FROM report_data", "SELECT COUNT(*) FROM report_data"], "ans": 1, "exp": "MIN and MAX of created_at in the report's data should exactly match the requested date range boundaries. If MIN is later or MAX is earlier than requested, the API is filtering incorrectly."}, {"q": "What is the risk of using SELECT * in a JOIN query?", "opts": ["No risk", "Returns ambiguous columns with the same name from different tables, making result processing error-prone", "Too many columns slows down queries", "SELECT * is not valid with JOIN"], "ans": 1, "exp": "JOINs on multiple tables may produce columns with the same name (e.g., id from both tables). SELECT * returns all of them — causing ambiguity in application code. Explicit column selection prevents this."}, {"q": "A QA engineer runs a test that inserts 50 records. What SQL verifies exactly 50 were inserted?", "opts": ["SELECT * FROM table LIMIT 50", "SELECT COUNT(*) FROM table WHERE test_batch = '{batch_id}' (should = 50)", "SELECT 50 FROM table", "SELECT MAX(id) FROM table"], "ans": 1, "exp": "Count with the specific batch identifier. Comparing to 50 verifies exactly the right number were inserted. Without the batch filter, other records might inflate the count."}, {"q": "Which SQL technique is best for finding the most recent activity per user?", "opts": ["SELECT * FROM activity ORDER BY date DESC", "SELECT * FROM (SELECT *, ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY created_at DESC) as rn FROM activity) t WHERE rn = 1", "SELECT MAX(created_at) FROM activity GROUP BY user_id", "Both B and C (different use cases)"], "ans": 3, "exp": "B returns the full most-recent row per user (all columns). C returns only user_id and max date. For verification (needing the full record), B is better. For existence/timing check, C is sufficient."}, {"q": "A login API isn't enforcing failed attempt limits. What DB check helps confirm?", "opts": ["SELECT * FROM users", "SELECT user_id, COUNT(*) as attempts FROM login_attempts WHERE success = 0 AND created_at >= NOW() - INTERVAL 1 HOUR GROUP BY user_id HAVING attempts > 5", "SELECT * FROM login_attempts WHERE failed = 1", "SELECT user_id FROM sessions"], "ans": 1, "exp": "Count failed login attempts per user in the last hour. Users with > 5 failures who are still able to attempt login indicate the lockout mechanism isn't enforced — a security QA finding."}, {"q": "What is the QA purpose of checking COUNT(DISTINCT col) vs COUNT(*)?", "opts": ["Performance comparison", "Detecting duplicate values in a column — difference indicates duplicates", "NULL detection", "Index verification"], "ans": 1, "exp": "If COUNT(DISTINCT email) < COUNT(*), there are duplicate email values. The difference tells you how many duplicates exist. This is the most concise duplicate detection check."}, {"q": "Which is the most efficient way to check if a table is empty?", "opts": ["SELECT COUNT(*) FROM t", "SELECT EXISTS (SELECT 1 FROM t LIMIT 1)", "SELECT * FROM t", "SELECT MAX(id) FROM t IS NULL"], "ans": 1, "exp": "EXISTS with LIMIT 1 stops at the first found row. COUNT(*) scans all rows. SELECT * returns all data unnecessarily. EXISTS is O(1) for existence checks vs O(n) for COUNT."}, {"q": "What does the following detect: SELECT * FROM test_results tr1 WHERE duration > 3 * (SELECT AVG(duration) FROM test_results tr2 WHERE tr2.test_name = tr1.test_name)?", "opts": ["Slow tests in general", "Tests running 3x slower than their own historical average (per test name)", "Tests with 3 failures", "All test results"], "ans": 1, "exp": "Correlated subquery calculates average duration for each specific test name. Outer query finds instances where duration exceeds 3x that test's own average — detecting regressions per test case."}, {"q": "How do you write a query that's easy for another QA engineer to understand?", "opts": ["Use * everywhere, no aliases", "Use meaningful aliases, one join per line, comments for complex logic, specific column names over SELECT *", "Write everything in one line", "Avoid comments"], "ans": 1, "exp": "Readable SQL: aliases that explain the table's role (u for users, o for orders), one clause per line, /* comment */ for complex conditions, specific columns over SELECT *, consistent indentation."}, {"q": "What SQL would you run first to understand an unfamiliar table?", "opts": ["SELECT * FROM table LIMIT 1000", "DESCRIBE table; SELECT * FROM table LIMIT 5", "SELECT COUNT(*) FROM table", "SELECT * FROM table ORDER BY id DESC"], "ans": 1, "exp": "DESCRIBE shows column names, types, and constraints (structure). Then SELECT a few rows to see real data patterns. This gives structure + content understanding without overwhelming data volume."}, {"q": "A QA report shows test pass rate dropped from 95% to 70% overnight. What SQL investigates?", "opts": ["SELECT * FROM tests", "SELECT DATE(run_time), COUNT(*) total, SUM(CASE WHEN result='pass' THEN 1 ELSE 0 END) passed, ROUND(SUM(CASE WHEN result='pass' THEN 1 ELSE 0 END)*100.0/COUNT(*),1) pct FROM test_runs WHERE run_time >= NOW() - INTERVAL 2 DAY GROUP BY DATE(run_time) ORDER BY DATE(run_time)", "SELECT * FROM tests WHERE result = 'fail'", "SELECT COUNT(*) FROM tests WHERE result = 'fail'"], "ans": 1, "exp": "Daily breakdown of total, passed, and pass percentage over 2 days reveals exactly when the drop occurred and what the magnitude is. Essential for identifying the root cause timing."}, {"q": "What does SELECT COALESCE(SUM(refund_amount), 0) FROM refunds WHERE order_id = {id} return when no refunds exist?", "opts": ["NULL", "0", "Error", "Empty string"], "ans": 1, "exp": "SUM of an empty set returns NULL. COALESCE(NULL, 0) = 0. This is the correct pattern for financial totals when no matching rows exist — returns 0 instead of NULL."}, {"q": "What is the correct SQL to clean up QA test data created in the last 24 hours?", "opts": ["DELETE FROM users", "DELETE FROM users WHERE email LIKE '%@test.%' AND created_at >= NOW() - INTERVAL 24 HOUR (always add both conditions)", "DROP TABLE users", "DELETE FROM users LIMIT 100"], "ans": 1, "exp": "Always combine the data marker (test email pattern) AND time window (last 24h). Data marker ensures only test data is deleted. Time window prevents accidentally deleting old test accounts still needed. Never DELETE without WHERE."}, {"q": "What SQL helps QA verify an API's response time SLA is being met?", "opts": ["SELECT * FROM api_logs", "SELECT endpoint, COUNT(*) total, AVG(response_time_ms) avg_  (1) LIMIT on large tables for safety, (2) WHERE clause on all modifications, (3) SELECT first to preview what DELETE/UPDATE will affect, (4) specific column names in verification queries."}, {"q": "What does it mean when COUNT(*) and COUNT(DISTINCT id) return different values?", "opts": ["Nothing unusual", "Duplicate IDs exist in the table — a primary key violation or data integrity issue", "The table has NULLs", "COUNT functions are unreliable"], "ans": 1, "exp": "If id is the primary key, COUNT(*) should equal COUNT(DISTINCT id). A difference means duplicate id values exist — a serious data integrity breach, since primary keys must be unique."}, {"q": "What SQL would you write to generate a QA test completion summary?", "opts": ["SELECT * FROM tests", "SELECT DATE(run_date) as date, test_suite, COUNT(*) total, SUM(CASE WHEN result='pass' THEN 1 ELSE 0 END) pass, SUM(CASE WHEN result='fail' THEN 1 ELSE 0 END) fail, ROUND(SUM(CASE WHEN result='pass' THEN 1 ELSE 0 END)*100.0/COUNT(*),1) pass_rate FROM test_runs WHERE run_date >= NOW() - INTERVAL 7 DAY GROUP BY DATE(run_date), test_suite ORDER BY date, test_suite", "SELECT COUNT(*) FROM tests", "SELECT * FROM test_runs WHERE result = 'fail'"], "ans": 1, "exp": "A complete QA test summary: date + suite grouping, total count, pass count, fail count, and pass rate percentage. 7-day window, sorted chronologically by suite. This is the foundation of a QA dashboard query."}]}];

let state = {
  screen: 'home',
  examId: null,
  qIndex: 0,
  answers: {},   // examId -> array of chosen opt indices (or null)
  timer: {},
  timerInt: null,
  timerVals: {},
};

const TIMER_SEC = 60 * 60; // 60 min per exam

function getLevelClass(level) {
  if (level.includes('Junior+') || level.includes('Advanced')) return 'level-advanced';
  if (level.includes('Junior')) return 'level-junior';
  return 'level-fresher';
}

function getScoreColor(pct) {
  if (pct >= 90) return 'var(--green)';
  if (pct >= 75) return 'var(--accent)';
  if (pct >= 60) return 'var(--yellow)';
  if (pct >= 50) return 'var(--orange)';
  return 'var(--red)';
}

function getGrade(pct) {
  if (pct >= 90) return ['S — Exceptional', 'grade-s'];
  if (pct >= 80) return ['A — Excellent', 'grade-a'];
  if (pct >= 70) return ['B — Good', 'grade-b'];
  if (pct >= 60) return ['C — Passing', 'grade-c'];
  return ['F — Needs Review', 'grade-f'];
}

function getIcon(pct) {
  if (pct >= 90) return '🏆';
  if (pct >= 75) return '🎯';
  if (pct >= 60) return '📚';
  return '💪';
}

function formatTime(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = (sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function getExamAnswers(examId) {
  if (!state.answers[examId]) {
    state.answers[examId] = new Array(EXAMS[examId-1].questions.length).fill(null);
  }
  return state.answers[examId];
}

function getExamScore(examId) {
  const exam = EXAMS[examId-1];
  const ans = state.answers[examId];
  if (!ans) return null;
  let correct = 0, answered = 0;
  ans.forEach((a, i) => {
    if (a !== null) {
      answered++;
      if (a === exam.questions[i].ans) correct++;
    }
  });
  return { correct, answered, total: exam.questions.length };
}

function isExamComplete(examId) {
  const ans = state.answers[examId];
  if (!ans) return false;
  return ans.every(a => a !== null);
}

function renderSidebar() {
  const list = document.getElementById('examList');
  list.innerHTML = EXAMS.map(e => {
    const sc = getExamScore(e.id);
    const pct = sc && sc.answered === sc.total ? Math.round(sc.correct / sc.total * 100) : null;
    const isActive = state.examId === e.id && state.screen === 'exam';
    const fillPct = sc ? Math.round(sc.answered / sc.total * 100) : 0;
    return `<div class="exam-card ${isActive ? 'active' : ''}" onclick="startExam(${e.id})">
      <div class="exam-icon">${e.icon}</div>
      <div class="exam-info">
        <div class="exam-name">${e.id}. ${e.title}</div>
        <div class="exam-meta">${e.level} · ${e.questions.length}Q</div>
        <div class="exam-progress-bar"><div class="exam-progress-fill" style="width:${fillPct}%"></div></div>
      </div>
      ${pct !== null ? `<div class="exam-score-badge done">${pct}%</div>` : `<div class="exam-score-badge">${sc ? sc.answered : 0}/${e.questions.length}</div>`}
    </div>`;
  }).join('');
}

function renderHome() {
  const app = document.getElementById('app');
  const totalAnswered = Object.values(state.answers).reduce((sum, a) => sum + (a ? a.filter(x => x !== null).length : 0), 0);
  const totalCorrect = EXAMS.reduce((sum, e) => {
    const sc = getExamScore(e.id);
    return sum + (sc ? sc.correct : 0);
  }, 0);

  app.innerHTML = `
  <div class="home">
    <div style="font-size:48px;margin-bottom:16px">🎓</div>
    <h1>SQL Examinations for <span>QA Engineers</span></h1>
    <p>10 comprehensive exams covering SQL fundamentals to advanced patterns.<br>Each exam has 60 questions with detailed wrong-answer explanations.</p>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-num">10</div><div class="stat-label">Exams</div></div>
      <div class="stat-box"><div class="stat-num">600</div><div class="stat-label">Questions</div></div>
      <div class="stat-box"><div class="stat-num">${totalAnswered}</div><div class="stat-label">Answered</div></div>
    </div>
    <div class="topics-grid">
    ${EXAMS.map(e => `
      <div class="topic-card" onclick="startExam(${e.id})">
        <div class="topic-icon">${e.icon}</div>
        <div>
          <div class="topic-title">${e.id}. ${e.title}</div>
          <div class="topic-sub">${e.desc}</div>
          <span class="topic-level ${getLevelClass(e.level)}">${e.level}</span>
        </div>
      </div>
    `).join('')}
    </div>
  </div>`;
}

function startExam(examId) {
  state.screen = 'exam';
  state.examId = examId;
  state.qIndex = 0;

  // Init answers if first visit
  getExamAnswers(examId);

  // Start timer if not already started
  if (!state.timerVals[examId]) {
    state.timerVals[examId] = TIMER_SEC;
  }
  startTimer(examId);

  renderSidebar();
  renderExam();
  window.scrollTo(0, 0);
}

function startTimer(examId) {
  if (state.timerInt) clearInterval(state.timerInt);
  if (isExamComplete(examId)) return;

  state.timerInt = setInterval(() => {
    if (state.examId !== examId || state.screen !== 'exam') {
      clearInterval(state.timerInt);
      return;
    }
    state.timerVals[examId] = Math.max(0, state.timerVals[examId] - 1);
    const el = document.getElementById('timer');
    if (el) {
      const t = state.timerVals[examId];
      el.textContent = formatTime(t);
      el.className = 'timer' + (t < 600 && t > 60 ? ' warning' : t <= 60 ? ' danger' : '');
    }
    if (state.timerVals[examId] === 0) {
      clearInterval(state.timerInt);
    }
  }, 1000);
}

function renderExam() {
  const exam = EXAMS[state.examId - 1];
  const qIdx = state.qIndex;
  const q = exam.questions[qIdx];
  const answers = getExamAnswers(state.examId);
  const chosen = answers[qIdx];
  const answered = chosen !== null;
  const isCorrect = answered && chosen === q.ans;
  const sc = getExamScore(state.examId);
  const t = state.timerVals[state.examId] ?? TIMER_SEC;

  const qDots = exam.questions.map((_, i) => {
    const a = answers[i];
    let cls = '';
    if (i === qIdx) cls = 'current';
    else if (a === null) cls = '';
    else if (a === exam.questions[i].ans) cls = 'correct';
    else cls = 'wrong';
    return `<div class="q-dot ${cls}" onclick="goToQ(${i})">${i+1}</div>`;
  }).join('');

  const optLabels = ['A', 'B', 'C', 'D'];
  const options = q.opts.map((opt, i) => {
    let cls = '';
    let icon = '';
    if (answered) {
      if (i === q.ans) { cls = 'correct disabled'; icon = '✓'; }
      else if (i === chosen && !isCorrect) { cls = 'selected-wrong disabled'; icon = '✗'; }
      else cls = 'disabled';
    }
    return `<div class="option ${cls}" onclick="${answered ? '' : `selectAnswer(${i})`}">
      <div class="opt-label">${optLabels[i]}</div>
      <div class="opt-text">${opt}</div>
      ${icon ? `<div class="opt-icon">${icon}</div>` : ''}
    </div>`;
  }).join('');

  let expHtml = '';
  if (answered) {
    const expCls = isCorrect ? 'correct-exp' : 'wrong-exp';
    const hdrCls = isCorrect ? 'correct' : 'wrong';
    const hdrText = isCorrect ? '✓ Correct!' : '✗ Incorrect';
    expHtml = `<div class="explanation show ${expCls}">
      <div class="exp-header ${hdrCls}">${hdrText}</div>
      ${q.exp}
    </div>`;
  }

  const app = document.getElementById('app');
  app.innerHTML = `
  <div class="exam-header">
    <div class="icon">${exam.icon}</div>
    <div>
      <h2>${exam.title}</h2>
      <div class="desc">${exam.desc}</div>
    </div>
    <div class="spacer"></div>
    <div id="timer" class="timer">${formatTime(t)}</div>
  </div>

  <div class="progress-info">
    <span>Question ${qIdx+1} of ${exam.questions.length}</span>
    <span>${sc ? sc.answered : 0} answered · ${sc ? sc.correct : 0} correct</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" style="width:${Math.round((sc ? sc.answered : 0) / exam.questions.length * 100)}%"></div>
  </div>

  <div class="question-nav">${qDots}</div>

  <div class="question-card">
    <div class="question-num">
      <strong>Q${qIdx+1}</strong>
      <span style="color:var(--muted)">·</span>
      <span>${exam.title}</span>
    </div>
    <div class="question-text">${formatQuestion(q.q)}</div>
    <div class="options">${options}</div>
    ${expHtml}
    <div class="question-footer">
      <button class="btn btn-ghost" onclick="prevQ()" ${qIdx === 0 ? 'disabled' : ''}>← Prev</button>
      <button class="btn btn-primary" onclick="nextQ()" ${qIdx === exam.questions.length - 1 ? 'style="display:none"' : ''}>Next →</button>
      ${qIdx === exam.questions.length - 1 && answered ? `<button class="btn btn-primary" onclick="showResults()">See Results 🎯</button>` : ''}
      ${isExamComplete(state.examId) ? `<button class="btn btn-ghost" onclick="showResults()">Results 📊</button>` : ''}
      <div class="score-live">
        <span class="correct">${sc ? sc.correct : 0} ✓</span>
        <span class="wrong">${sc ? sc.answered - sc.correct : 0} ✗</span>
        <span style="color:var(--muted)">${sc ? exam.questions.length - sc.answered : exam.questions.length} –</span>
      </div>
    </div>
  </div>`;

  // Restart timer display
  startTimer(state.examId);
}

function formatQuestion(q) {
  // Highlight SQL keywords in question text
  return q.replace(/`([^`]+)`/g, '<code>$1</code>');
}

function selectAnswer(optIdx) {
  const answers = getExamAnswers(state.examId);
  if (answers[state.qIndex] !== null) return;
  answers[state.qIndex] = optIdx;
  state.answers[state.examId] = answers;
  renderSidebar();
  renderExam();
}

function nextQ() {
  const exam = EXAMS[state.examId - 1];
  if (state.qIndex < exam.questions.length - 1) {
    state.qIndex++;
    renderExam();
    window.scrollTo(0, 0);
  }
}

function prevQ() {
  if (state.qIndex > 0) {
    state.qIndex--;
    renderExam();
    window.scrollTo(0, 0);
  }
}

function goToQ(idx) {
  state.qIndex = idx;
  renderExam();
  document.querySelector('.question-card')?.scrollIntoView({behavior:'smooth', block:'start'});
}

function showResults() {
  clearInterval(state.timerInt);
  state.screen = 'results';
  renderResults();
  renderSidebar();
}

function renderResults() {
  const exam = EXAMS[state.examId - 1];
  const sc = getExamScore(state.examId);
  const pct = Math.round(sc.correct / sc.total * 100);
  const [grade, gradeCls] = getGrade(pct);
  const icon = getIcon(pct);
  const scoreColor = getScoreColor(pct);
  const elapsed = TIMER_SEC - (state.timerVals[state.examId] ?? TIMER_SEC);
  const skipped = sc.total - sc.answered;

  // Wrong answers for review
  const wrongs = [];
  const answers = state.answers[state.examId];
  exam.questions.forEach((q, i) => {
    if (answers[i] !== null && answers[i] !== q.ans) {
      wrongs.push({q, i, chosen: answers[i]});
    }
  });

  const app = document.getElementById('app');
  app.innerHTML = `
  <div class="result-card">
    <div class="result-icon">${icon}</div>
    <div class="result-score" style="color:${scoreColor}">${pct}%</div>
    <div class="result-label">Exam ${exam.id}: ${exam.title}</div>
    <span class="result-grade ${gradeCls}">${grade}</span>
    <div class="result-stats">
      <div class="res-stat">
        <div class="num green">${sc.correct}</div>
        <div class="lbl">Correct</div>
      </div>
      <div class="res-stat">
        <div class="num red">${sc.answered - sc.correct}</div>
        <div class="lbl">Wrong</div>
      </div>
      <div class="res-stat">
        <div class="num yellow">${skipped}</div>
        <div class="lbl">Skipped</div>
      </div>
      <div class="res-stat">
        <div class="num blue">${formatTime(elapsed)}</div>
        <div class="lbl">Time Used</div>
      </div>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:8px">
      <button class="btn btn-ghost" onclick="retakeExam()">↺ Retake Exam</button>
      <button class="btn btn-primary" onclick="goHome()">← All Exams</button>
    </div>
  </div>

  ${wrongs.length > 0 ? `
  <div style="margin-bottom:16px">
    <h3 style="font-size:16px;font-weight:700;margin-bottom:16px;color:var(--red)">
      ✗ Wrong Answers (${wrongs.length}) — Study These
    </h3>
    ${wrongs.map(w => `
    <div class="review-item wrong-item">
      <div class="review-header" onclick="toggleReview(this)">
        <div style="color:var(--red);font-size:16px;flex-shrink:0">✗</div>
        <div class="review-q">Q${w.i+1}. ${w.q.q}</div>
        <span class="review-tag tag-wrong">Wrong</span>
      </div>
      <div class="review-detail">
        <div class="review-ans">Your answer: <strong style="color:var(--red)">${w.q.opts[w.chosen]}</strong></div>
        <div class="review-ans">Correct: <strong style="color:var(--green)">${w.q.opts[w.q.ans]}</strong></div>
        <div class="review-exp">${w.q.exp}</div>
      </div>
    </div>
    `).join('')}
  </div>
  ` : '<div style="text-align:center;padding:24px;color:var(--green);font-size:18px;font-weight:700">🎯 Perfect score! All answers correct!</div>'}

  ${sc.correct > 0 ? `
  <div>
    <h3 style="font-size:16px;font-weight:700;margin-bottom:16px;color:var(--green)">
      ✓ Correct Answers (${sc.correct})
    </h3>
    ${exam.questions.map((q, i) => {
      const a = answers[i];
      if (a === null || a !== q.ans) return '';
      return `<div class="review-item correct-item">
        <div class="review-header" onclick="toggleReview(this)">
          <div style="color:var(--green);font-size:16px;flex-shrink:0">✓</div>
          <div class="review-q">Q${i+1}. ${q.q}</div>
          <span class="review-tag tag-correct">Correct</span>
        </div>
        <div class="review-detail">
          <div class="review-ans">Your answer: <strong style="color:var(--green)">${q.opts[a]}</strong></div>
          <div class="review-exp">${q.exp}</div>
        </div>
      </div>`;
    }).join('')}
  </div>
  ` : ''}`;
}

function toggleReview(header) {
  const detail = header.nextElementSibling;
  detail.classList.toggle('open');
}

function retakeExam() {
  state.answers[state.examId] = new Array(EXAMS[state.examId-1].questions.length).fill(null);
  state.timerVals[state.examId] = TIMER_SEC;
  state.qIndex = 0;
  state.screen = 'exam';
  renderSidebar();
  renderExam();
}

function goHome() {
  clearInterval(state.timerInt);
  state.screen = 'home';
  state.examId = null;
  renderSidebar();
  renderHome();
}

function setActiveNav() {
  const path = window.location.pathname.toLowerCase();
  document.querySelectorAll('.top-nav a').forEach(link => {
    const target = link.getAttribute('href').toLowerCase();
    const isSql = target === 'sql.html' && (path.endsWith('/') || path.endsWith('/index.html') || path.endsWith('/sql.html'));
    const isSyllabus = target === 'demo-syllabus.html' && path.endsWith('/demo-syllabus.html');
    link.classList.toggle('active', isSql || isSyllabus);
  });
}

// Init
setActiveNav();
renderSidebar();
renderHome();
</script>
</body>
</html>
